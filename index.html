形に2%、差額補充法ね。"],["ずんだもん","その前に、売掛金の中の外貨建の分を、決算日のレートに直すのだ。"],["めたん","480,000ドルの売掛金が、65,280で入っているわ。"],["ずんだもん","割ってみると、1ドル136円で入っているのだ。"],["めたん","売掛金は将来お金になるから、決算日の138円に直すのね。"],["ずんだもん","そうなのだ。1ドル2円増えて、960の為替差益なのだ。"],["ずんだもん","この960を足してから、2%を掛けるのだ。"],["めたん","それから、前T/Bの貸倒引当金1,110を引くのを忘れないのね。"],["ずんだもん","その通りなのだ。貸倒引当金繰入の欄は13,850なのだ。"],["めたん","為替差益は、前T/Bの380から、為替予約の1,110を引いて、960を足すのね。"],["ずんだもん","そうなのだ。為替差益の欄は230なのだ。"]],[["ずんだもん","次は6番、減価償却なのだ。"],["ずんだもん","埋まるのは、減価償却費の欄なのだ。3つ足すのだ。"],["めたん","建物は定額法で40年、残存価額は10%ね。"],["ずんだもん","取得原価の90%を40年で割って、20,250なのだ。"],["めたん","備品は200%定率法で8年ね。"],["ずんだもん","償却率は、1÷8年を2倍して、0.25なのだ。"],["ずんだもん","取得原価から累計額を引いた残りに掛けて、15,820なのだ。"],["めたん","保証率で、改定償却率に切り替えるか確かめないと。"],["ずんだもん","取得原価に保証率を掛けると11,864なのだ。15,820の方が大きいから、0.25のままでいいのだ。"],["めたん","機械装置は、資産除去債務がからむのよね。"],["ずんだもん","そうなのだ。だから次の場面で、図を描いてから出すのだ。"]],[["ずんだもん","機械装置は当期首に500,000で取得して、除去費用は40,000と見積もっていたのだ。"],["ずんだもん","埋まるのは、資産除去債務利息費用と、問2の資産除去債務、それに減価償却費の残りなのだ。"],["めたん","資産除去債務って何？"],["ずんだもん","使い終わった設備を取り壊す、将来の費用を、今のうちに負債にしたものなのだ。"],["ずんだもん","時間の線に、当期首、決算、10年後の除去を並べるのだ。"],["ずんだもん","線の上の行が負債、下の行が機械装置なのだ。"],["めたん","除去の所に40,000を置いて、4%で今に戻すのね。"],["ずんだもん","そうなのだ。10年で4%の現価係数を掛けて、27,022なのだ。"],["めたん","それが前T/Bの資産除去債務27,022ね。"],["ずんだもん","負債が増えたら、同じだけ機械装置も引き上げるのだ。機械装置は527,022なのだ。"],["ずんだもん","1年たつと、債務は4%ぶん増えるのだ。これが利息費用なのだ。"],["めたん","決算日から見ると、残りは9年ね。"],["ずんだもん","そうなのだ。9年で4%の係数を掛けて、28,104なのだ。"],["めたん","増えた分は、1,082になるわ。"],["ずんだもん","その通りなのだ。資産除去債務利息費用の欄は1,082なのだ。"],["ずんだもん","27,022に4%を掛けて出すと1,081なのだ。こっちも正解なのだ。"],["めたん","その都度四捨五入、の注意がここで効いてくるのね。"],["ずんだもん","次に、除去費用が42,000に増えたのだ。"],["めたん","増えたのは2,000ね。これも4%で戻せばいいわよね。"],["ずんだもん","違うのだ。増えた分だけ、決算日の割引率3%で戻すのだ。"],["ずんだもん","増えた分は、元からあった債務とは別の物ができたと考えるのだ。だから新しい率なのだ。"],["めたん","9年で3%の係数を掛けて、1,533ね。"],["ずんだもん","その通りなのだ。1,533を、資産除去債務と機械装置の両方に足すのだ。"],["ずんだもん","問2の資産除去債務の欄は、28,104と足して29,637なのだ。"],["めたん","機械装置の減価償却は、増えた1,533も入れて計算するの？"],["ずんだもん","入れないのだ。決算日に足したから、当期はまだ1日も使っていないのだ。"],["ずんだもん","機械装置は527,022を10年で割って、52,702なのだ。"],["めたん","これで減価償却費の3つがそろったわ。"],["ずんだもん","建物と機械装置と備品を足して、減価償却費の欄は88,772なのだ。"]],[["ずんだもん","次は7番、社債なのだ。"],["ずんだもん","埋まるのは、社債利息、社債買入消却益、問2の社債なのだ。"],["めたん","前T/Bの社債が？になってるわ。"],["ずんだもん","まずそこを出すのだ。発行は前々期の4月1日、額面400,000を93.25円で出したのだ。"],["めたん","払い込まれたのは、373,000ね。"],["ずんだもん","利息法だから、毎年、簿価に実効利子率2.66%を掛けたのが社債利息なのだ。"],["ずんだもん","クーポンは額面の1.20%で4,800なのだ。"],["めたん","社債利息からクーポンを引いた分だけ、簿価が増えていくのね。"],["ずんだもん","その通りなのだ。2年間で増えて、前T/Bの社債は383,380なのだ。"],["めたん","当期も、まるまる持っていたら、いくら増えるの？"],["ずんだもん","社債利息10,198からクーポンを引いて、5,398なのだ。"]],[["ずんだもん","当期の1月31日に、額面100,000を買い入れて消却したのだ。"],["めたん","400,000のうち100,000だから、25%ね。"],["ずんだもん","長方形で描くのだ。横が年、縦が額面なのだ。"],["ずんだもん","横線で上の75%の未償還分と、下の25%の償還分に割るのだ。"],["めたん","期首の383,380も、上と下に75対25で分けるのね。"],["ずんだもん","そうなのだ。1コマの面積が、その年の償却なのだ。1コマに償却とクーポンの2つが入るのだ。"],["ずんだもん","下の償還分は、1月31日で切るのだ。期中に返すものは、期中で消すのだ。"],["めたん","4月1日から1月31日までで、10ヵ月ね。"],["ずんだもん","償却は、5,398の25%の10ヵ月分で、1,125なのだ。"],["ずんだもん","クーポンも、4,800の25%の10ヵ月分で、1,000なのだ。"],["めたん","償還分の1月31日の簿価は、期首の95,845に償却を足して96,970ね。"],["ずんだもん","その通りなのだ。"],["めたん","払ったのは仮払金の96,000よね。差の970が消却益かしら。"],["ずんだもん","そこが引っかけなのだ。96,000には経過利息が入っているのだ。"],["めたん","裸相場とか、経過利息とか、何のこと？"],["ずんだもん","裸相場は利息を含まない値段、経過利息は前の利払日から買った日までの利息なのだ。"],["ずんだもん","返した社債のクーポン券は消えてしまうから、その分の利息は返すときに一緒に払うのだ。"],["ずんだもん","裸相場は、1口100円につき95円で、95,000なのだ。経過利息は、さっきのクーポン1,000なのだ。"],["めたん","2つを足して、ちょうど96,000になるわ。"],["ずんだもん","だから消却益は、簿価96,970から裸相場95,000を引くのだ。"],["めたん","社債買入消却益の欄は、1,970ね。"],["ずんだもん","その通りなのだ。"],["ずんだもん","上の未償還分は、12ヵ月まるまる持っているのだ。"],["めたん","償却もクーポンも、1年分の75%ね。"],["ずんだもん","そうなのだ。償却4,048を足して、問2の社債の欄は291,583なのだ。"],["めたん","社債利息は、長方形の当期の列を全部足せばいいのね。"],["ずんだもん","その通りなのだ。下の2つと上の2つで、社債利息の欄は9,773なのだ。"]],[["ずんだもん","次は8番、退職給付なのだ。"],["ずんだもん","埋まるのは、退職給付費用の欄なのだ。"],["ずんだもん","左に退職給付引当金、右に年金資産と退職給付債務のT勘定を並べるのだ。"],["めたん","年金資産は期首705,250、退職給付債務は期首874,500ね。"],["ずんだもん","引当金の期首は、その差の169,250なのだ。前T/Bと一致するのだ。"],["めたん","年金資産には、期待運用収益が入るのね。"],["ずんだもん","そうなのだ。年金資産の2%で、14,105なのだ。"],["めたん","債務には、勤務費用9,800と、利息費用が入るわ。"],["ずんだもん","利息費用は、債務の1%で8,745なのだ。"],["ずんだもん","数理計算上の差異は、6,000の借方差異なのだ。"],["めたん","数理計算上の差異って何？"],["ずんだもん","割引率や運用収益率は予想なのだ。予想と実際がずれた分なのだ。"],["ずんだもん","それを差異の勘定に移して、そこから毎年、じわじわ費用にしていくのだ。"],["めたん","当期から8年で定額法だから、6,000÷8年で750ね。"],["ずんだもん","その通りなのだ。"],["ずんだもん","退職給付費用は、丸を付けた数字の合計なのだ。費用の丸は足して、収益の丸は引くのだ。"],["めたん","勤務費用と利息費用と差異の償却を足して、期待運用収益を引くのね。"],["ずんだもん","退職給付費用の欄は5,190なのだ。"],["めたん","仮払金の掛金11,000と一時金8,000は？"],["ずんだもん","引当金を減らすのだ。仮払金から引当金へ、19,000を振り替えるのだ。"],["めたん","年金基金からの支払4,250は？"],["ずんだもん","年金資産と債務が同じだけ減るから、引当金には影響しないのだ。"]],[["ずんだもん","9番と10番は、短いのだ。"],["めたん","販売費の前払分と、一般管理費の未払分ね。"],["ずんだもん","前払は今年の費用じゃないから引いて、未払は今年の費用だから足すのだ。"],["めたん","販売費は810,400、一般管理費は238,800になるわ。"],["ずんだもん","その通りなのだ。販売費の欄は810,400、一般管理費の欄は238,800なのだ。"],["ずんだもん","法人税、住民税及び事業税は、そのまま132,500なのだ。"]],[["ずんだもん","これで問1の損益計算書がそろったのだ。"],["めたん","当期純利益は、811,029になるのね。"],["ずんだもん","そうなのだ。資産除去債務利息費用を1,081にした別解だと、利益は1ずれるのだ。"],["めたん","配点が2点の欄は、棚卸減耗損・退職給付費用・減価償却費・評価益・為替差益ね。"],["ずんだもん","どれも、引っかけのある所なのだ。"]],[["ずんだもん","問2は、5つの欄なのだ。"],["めたん","4つは、ここまでに出した数字のままね。"],["ずんだもん","最後の繰越利益剰余金は、前T/Bの112,000に、当期純利益を足すのだ。"],["めたん","当期純利益811,029を足して、923,029ね。"],["ずんだもん","問2の繰越利益剰余金の欄は923,029なのだ。"]],[["ずんだもん","最後に、引っかけをまとめておくのだ。"],["ずんだもん","戻しと割戻しは、原価率の分子と分母の両方から引くのだ。"],["めたん","未着品の売上原価は、保守点検の前の売上を1.25で割るのね。"],["ずんだもん","3月3日の未記帳の仕入は、先物の142円で入れるのだ。"],["めたん","直先差額は月割りで、当期は1ヵ月分の740だけね。"],["ずんだもん","役務収益は、売上高にまとめるのだ。"]],[["ずんだもん","貸倒引当金は、外貨建の売掛金を換算替えしてから2%なのだ。"],["めたん","除去費用の増加は、増えた分だけ決算日の3%で戻すのね。"],["ずんだもん","増えた分は決算日に足すから、当期の償却には入れないのだ。"],["めたん","社債の支払96,000には、経過利息1,000が入ってるわ。"],["ずんだもん","償還分は10ヵ月、未償還分は12ヵ月なのだ。"],["めたん","どれも、問題文の一言を読み落とすと間違える所ね。"],["ずんだもん","その通りなのだ。問題文の指示に印を付けながら解くのだ。"]]]},{"kind":"exam","no":"165回","sub":"過去問","ch":165,"probs":[],"hl":"[税率変更]から/[一部売却]まで","acct":"過去問","id":"x165-ka","title":"会計学","sn":"会計","w":0.0,"wt":[],"video":{"blob":"bcddf034ce89c00db3d71a1a99cb70a4","secs":1046.25,"mb":12.5},"scenes":[[0,"会計学の全体像"],[25.57,"問題1の1：将来減算一時差異"],[102.04,"問題1の1：税率変更の法人税等調整額"],[185.57,"問題1の2：貸倒懸念債権"],[236.59,"問題1の2：キャッシュ・フロー見積法"],[311.81,"問題1の3：会計上の見積りの開示"],[355.72,"問題2：資料と答案の形"],[416.11,"P社の個別の処理"],[460.83,"タイムテーブル：支配獲得のとき"],[513.5,"タイムテーブル：前期と評価差額の実現"],[591.8,"タイムテーブル：当期の利益と配当"],[653.18,"未実現利益"],[697.98,"一部売却：個別と連結のずれ"],[769.06,"一部売却：タイムテーブルで読む"],[831.65,"当期首残高の欄"],[879.71,"当期純利益"],[918.35,"当期末残高と変動額"],[975.13,"模範解答"],[1001.34,"まとめ：問題1"],[1021.46,"まとめ：問題2"]],"script":[[["ずんだもん","今回は、165回の会計学を、最初から最後まで解くのだ。"],["めたん","会計学は2問ね。"],["ずんだもん","問題1は、文章の空欄を埋める問題なのだ。アからクまで8つあるのだ。"],["ずんだもん","問題2は、連結株主資本等変動計算書を作る問題なのだ。"],["めたん","配点は問題1が10点、問題2が15点になっているわ。"],["ずんだもん","問題1は、語句だけでなく、計算で出す金額が2つ入っているのだ。"],["めたん","ウとカね。ここは下書きを描いて出すのね。"],["ずんだもん","そうなのだ。では、1の税効果会計から見ていくのだ。"]],[["ずんだもん","1の文章で埋まるのは、アとイなのだ。"],["めたん","税法上の損金算入限度額を超えた減価償却費から、将来なんとか一時差異が生じる、とあるわ。"],["ずんだもん","まず、会計と税務は世界が違う、というところから始めるのだ。"],["ずんだもん","会計で費用になっても、税務署が損金と認めてくれるとは限らないのだ。"],["めたん","損金って、税務の上の費用のことよね。"],["ずんだもん","その通りなのだ。減価償却費も、税務署が決めた限度額までしか損金にならないのだ。"],["めたん","会社が5年で使い切ると思っても、税務署は法定の耐用年数で計算させるわけね。"],["ずんだもん","そうなのだ。だから会計の償却が多くて、税務の償却が少なくなるのだ。"],["ずんだもん","でも、建物を使い終わるまでに償却する合計は、どちらも同じなのだ。"],["めたん","今年ずれた分は、将来どこかで戻ってくるのね。"],["ずんだもん","そうなのだ。一時的にずれているだけの差なので、一時差異と言うのだ。"],["めたん","将来の課税所得は、増えるの？減るの？"],["ずんだもん","将来、税務でも償却できるようになるので、将来の課税所得が減るのだ。だから将来減算一時差異なのだ。"],["ずんだもん","アは「減算」なのだ。"],["めたん","じゃあイは、繰延税金の資産か負債かね。"],["ずんだもん","今に引き戻して考えるのだ。将来減算ということは、今は課税所得が多い、つまり今は税金を多く払っているのだ。"],["めたん","会計の利益で考えた税金より、税務署に多く取られたのね。"],["ずんだもん","税務署には逆らえないので、仕方なく多い分を前払いした、と考えるのだ。"],["めたん","前払いなら、資産になるわ。"],["ずんだもん","その通りなのだ。前払費用と同じで、繰延税金資産になるのだ。イは「資産」なのだ。"],["ずんだもん","将来減算と来たらDTA、と覚えておくのだ。DTAは繰延税金資産の頭文字なのだ。"]],[["ずんだもん","次は、ウの法人税等調整額なのだ。"],["めたん","前年度末の一時差異が20,000、当年度末が22,000ね。"],["ずんだもん","そして税率が、前年度末は35%、当年度末は30%に変わっているのだ。"],["めたん","税率が変わると、急に難しくなりそうね。"],["ずんだもん","下書きさえあれば、何も難しくないのだ。"],["ずんだもん","T勘定を2つ並べるのだ。左が前の期末、右が当期末なのだ。"],["ずんだもん","それぞれの右肩に、税率を書いておくだけなのだ。"],["めたん","左のT勘定に20,000、右に22,000を入れるのね。"],["ずんだもん","そうなのだ。T勘定の中は、税率を掛ける前の一時差異なのだ。"],["ずんだもん","下に、税率を掛けた後のDTAを書くのだ。"],["めたん","左は20,000に35%を掛けて、7,000になるわ。"],["ずんだもん","右は22,000に30%を掛けるのだ。"],["めたん","6,600ね。"],["ずんだもん","その通りなのだ。"],["めたん","法人税等調整額は、どうやって出すの？"],["ずんだもん","去年のDTAと今年のDTAの差を取るだけなのだ。"],["めたん","7,000から6,600に、400減っているわ。"],["ずんだもん","資産のDTAが減ったので、貸方にDTA400なのだ。相手は法人税等調整額なのだ。"],["ずんだもん","ウは「400」なのだ。"],["めたん","一時差異は増えたのに、DTAは減るのね。"],["ずんだもん","税率が下がった分で、DTAが小さくなったのだ。"],["めたん","前の期末の7,000も、本当は30%で計算し直すんじゃないの？"],["ずんだもん","いい質問なのだ。前の期末の残高は、もう去年の決算で35%で載っているのだ。"],["ずんだもん","当期末には、差が解消する年の税率、つまり新しい30%で載せ直すのだ。その差が全部、当期の法人税等調整額に入るのだ。"],["めたん","だからDTAの差を取れば、税率の変更分まで一度に出るのね。"],["ずんだもん","税効果会計は将来重視なのだ。DTAは、将来いくら税金が安くなるかを表しているのだ。"]],[["ずんだもん","2の文章で埋まるのは、エとオなのだ。"],["めたん","貸倒なんとか債権について、財務内容評価法とキャッシュ・フロー見積法の2つがある、とあるわ。"],["ずんだもん","債権は、回収のしやすさで3つに分けるのだ。"],["ずんだもん","普通に回収できそうな一般債権、ちょっと回収できないかもしれない貸倒懸念債権、もう赤信号の破産更生債権等なのだ。"],["めたん","下に行くほど、回収しにくくなるのね。"],["ずんだもん","そうなのだ。2つの方法から選べるのは、まん中の貸倒懸念債権なのだ。"],["ずんだもん","エは「懸念」なのだ。"],["めたん","次のオは、債権額から何かの処分見込額を引くのね。"],["ずんだもん","お金を貸した相手が返せなくなっても、担保を取っていれば、それを売って回収できるのだ。"],["めたん","担保を売った分は、損にならないわけね。"],["ずんだもん","その通りなのだ。だから債権額から担保と保証の分を引いて、損をする最大の額を出すのだ。"],["ずんだもん","オは「担保」なのだ。"],["めたん","その残りを、全部引き当てるの？"],["ずんだもん","貸倒懸念債権は、相手の財政状態を見て、何割か引き当てるのだ。"],["ずんだもん","全部引き当てるのは、破産更生債権等のほうなのだ。"],["めたん","懸念のほうは、まだ疑わしいだけだからね。"]],[["ずんだもん","次は、カの貸倒見積高なのだ。もう1つの、キャッシュ・フロー見積法で出すのだ。"],["めたん","帳簿価額が50,000、当初の約定利子率が3%ね。"],["ずんだもん","キャッシュ・フロー見積法は、債権の価値を、将来のキャッシュの割引現在価値で測る方法なのだ。"],["めたん","割引現在価値って、将来もらえるお金を、今の価値に直したものよね。"],["ずんだもん","そうなのだ。もともとの約束どおりに返してもらえるなら、3%で割り引くと、ちょうど帳簿価額になるのだ。"],["めたん","でも今は、2年後に500、3年後に30,600しか入ってこない見込みね。"],["ずんだもん","時間軸を描くのだ。当期末から、1年後、2年後、3年後と並べるのだ。"],["ずんだもん","2年後の500は、1.03で2回割り引くのだ。"],["めたん","471になるわ。"],["ずんだもん","3年後の30,600は、1.03で3回割り引くのだ。"],["めたん","こっちは28,003ね。"],["ずんだもん","足した28,474が、今の債権の価値なのだ。"],["めたん","帳簿価額の50,000との差が、貸倒見積高ね。"],["ずんだもん","その通りなのだ。50,000−28,474で、21,526なのだ。"],["ずんだもん","カは「21,526」なのだ。"],["めたん","割り引くのは、今の金利じゃなくて、当初の3%のままなのね。"],["ずんだもん","割引率まで変えると、価値の違いが分からなくなるのだ。"],["ずんだもん","比べたいのは、もとの約束と、今の見込みの価値なのだ。だから将来のキャッシュだけ見込みに変えて、割引率はそろえておくのだ。"],["めたん","将来のキャッシュは変更後、割引率は変更前、ってことね。"],["ずんだもん","そうなのだ。それと、端数を途中で丸めないと21,525になるのだ。模範解答では21,525も正解になっているのだ。"]],[["ずんだもん","最後の3で埋まるのは、キとクなのだ。"],["めたん","会計上のなんとかの開示に関する会計基準、とあるわ。"],["ずんだもん","見積りの開示なのだ。キは「見積り」なのだ。"],["めたん","どういう基準なの？"],["ずんだもん","この基準より前は、減損損失いくら、という見積りの結果だけが財務諸表に載っていたのだ。"],["ずんだもん","でも結果の金額だけでは、どうやって出したのか分からないのだ。"],["めたん","だから、見積りの過程や仮定も開示させるのね。"],["ずんだもん","そうなのだ。たとえば、割り引くときの利率や、売上が毎年どれだけ伸びると仮定したか、を書くのだ。"],["ずんだもん","そして、翌年度の財務諸表にどんな影響が出そうかも書くのだ。"],["めたん","クは、翌年度の財務諸表に重要な影響を及ぼすなんとか、ね。かっこの中に、有利な場合と不利な場合の両方を含む、とあるわ。"],["ずんだもん","ここは「リスク」なのだ。良い方にも悪い方にも転ぶ可能性のことなので、両方を含むのだ。"],["めたん","リスクって、悪いことだけじゃないのね。"],["ずんだもん","この基準では両方なのだ。これで問題1は全部埋まったのだ。"]],[["ずんだもん","次は問題2なのだ。20X3年度の連結株主資本等変動計算書を作るのだ。"],["めたん","株主資本等変動計算書って、純資産の部を横に並べた表よね。"],["ずんだもん","そうなのだ。貸借対照表の純資産を、縦ではなく横に並べて、1年の動きを書く表なのだ。"],["ずんだもん","はじめの当期首残高が前期末の貸借対照表、おしまいの当期末残高が当期末の貸借対照表なのだ。"],["めたん","連結だから、列は資本金、資本剰余金、利益剰余金、自己株式、その他の包括利益累計額、非支配株主持分になっているわ。"],["ずんだもん","税効果は考えなくていいのだ。"],["ずんだもん","資料は8つあるのだ。順に見ていくのだ。"],["めたん","1は、X1年度末にP社がS社の80%を550,000で取って、子会社にしたのね。"],["ずんだもん","2は、そのときのS社の土地と建物の時価なのだ。"],["めたん","土地も建物も、時価のほうが簿価より高いのね。"],["ずんだもん","建物は残り5年で減価償却するのだ。ここが大事なところなのだ。"],["めたん","のれんは翌年度から10年で償却ね。"],["ずんだもん","3が、P社とS社の純資産の部の表なのだ。評価・換算差額等は、その他有価証券評価差額金のことなのだ。"],["めたん","4から8は、X3年度に起きたことね。配当、P社の増資、自己株式の処分、S社株の10%の売却、それと未実現利益があるわ。"]],[["ずんだもん","まずP社だけで起きたことを先に片付けるのだ。資料5と6なのだ。"],["めたん","資料5は、P社が株式を発行して、200,000払い込まれたのね。"],["ずんだもん","原則は全額を資本金にするのだ。でも半分までなら資本金にしなくてよいのだ。"],["めたん","2分の1を資本金にしない、とあるから、資本金100,000、残りの100,000は資本準備金ね。"],["ずんだもん","その通りなのだ。資本準備金は、表では資本剰余金の列に入るのだ。"],["めたん","資料6は、自己株式20,000を18,000で処分したのね。"],["ずんだもん","自己株式の処分は、新しく株を発行するのと同じ、株主との取引なのだ。だから損益は出さないのだ。"],["めたん","差額の2,000は、売却損じゃないってことね。"],["ずんだもん","そうなのだ。損益ではなく、その他資本剰余金を2,000減らすのだ。"],["めたん","資本剰余金の列に△2,000、自己株式の列に20,000が入るわ。"],["ずんだもん","この2つは、連結の修正は何もないのだ。P社の数字がそのまま連結の株式の発行と自己株式の処分の欄に入るのだ。"]],[["ずんだもん","ここから連結なのだ。下書きはタイムテーブルを描くのだ。"],["めたん","タイムテーブルって何？"],["ずんだもん","子会社の純資産の動きを、時間の順に書いた下書きなのだ。これがあれば、仕訳を切らなくても連結の数字がほとんど出るのだ。"],["ずんだもん","横にX1年度末、X2年度末、X3年度末を並べるのだ。X1年度末の上に、取った割合の＋80%を書くのだ。"],["めたん","縦に並べるのは、資本金、利益剰余金、その他有価証券評価差額金、評価差額ね。"],["ずんだもん","その他有価証券評価差額金も、S社の純資産なのだ。含み益なので、利益剰余金と同じに扱うのだ。"],["めたん","評価差額は、土地と建物の時価と簿価の差を足すのね。10,000になるわ。"],["ずんだもん","そうなのだ。時価と簿価の差で、S社の資産を時価に直した分なのだ。"],["ずんだもん","X1年度末の合計は670,000なのだ。これに80%を掛けたのが、P社の持分なのだ。"],["めたん","536,000になるわ。"],["ずんだもん","P社は、それを550,000で買ったのだ。"],["めたん","払いすぎた差の14,000が、のれんね。"],["ずんだもん","その通りなのだ。のれんは翌年度から10年なので、毎年1,400ずつ償却するのだ。"]],[["ずんだもん","次はX2年度なのだ。S社の利益剰余金は、1年で30,000増えているのだ。"],["めたん","この30,000を、80%と20%に分ければいいのね。"],["ずんだもん","その前に、もう1つ直すことがあるのだ。建物の評価差額なのだ。"],["めたん","評価差額って、時価に直したときの差よね。売ってないのに、何か起きるの？"],["ずんだもん","建物は減価償却するのだ。連結では時価の18,000で償却するので、S社の個別より償却費が多くなるのだ。"],["めたん","評価差額の2,000を5年で割って、毎年400ずつ多いのね。"],["ずんだもん","そうなのだ。これを評価差額の実現と言うのだ。実現が難しければ、解消と思えばいいのだ。"],["ずんだもん","売却の指示がなくても、建物を時価評価した瞬間に、毎年この修正が要るのだ。ここに気づかないと、非支配株主持分も当期純利益も全部ずれるのだ。"],["めたん","400は誰の利益が減るの？"],["ずんだもん","S社の利益が減るのだ。だからタイムテーブルに評価差額の実現という段を足して、△400を入れるのだ。"],["ずんだもん","評価差額の段は10,000のまま動かさないのだ。"],["めたん","じゃあ、S社のX2年度の利益は、30,000から400を引いた29,600になるのね。"],["ずんだもん","その通りなのだ。この29,600を、矢印の上に80%、矢印の下に20%で分けるのだ。"],["めたん","上が23,680、下が5,920ね。"],["ずんだもん","矢印の上が親会社の取り分、下が非支配株主の取り分なのだ。"],["ずんだもん","グループの業績になるのは、支配した後に増えた矢印の上だけなのだ。"],["ずんだもん","その他有価証券評価差額金も同じなのだ。1年で3,000増えたのだ。"],["めたん","上が2,400、下が600になるわ。"],["ずんだもん","X2年度末の合計は702,600なのだ。これが当期首の数字になるのだ。"]],[["ずんだもん","当期のX3年度は、当期純利益と配当を分けて書くのだ。"],["めたん","どうして分けるの？"],["ずんだもん","非支配株主に帰属する当期純利益を出すには、利益だけの数字が要るからなのだ。"],["めたん","S社の利益剰余金は、当期に20,000増えているわ。"],["ずんだもん","それは配当を払った後の増え方なのだ。配当の6,000を足し戻して、当期純利益は26,000なのだ。"],["めたん","そこから評価差額の実現の400を引いて、25,600ね。"],["ずんだもん","その通りなのだ。矢印の上が20,480、下が5,120なのだ。"],["めたん","配当の6,000も、80%と20%に分けるのね。"],["ずんだもん","そうなのだ。80%の4,800はP社が受け取った受取配当金なので、グループの中のお金の移動として消すのだ。"],["ずんだもん","20%の1,200は、非支配株主持分を減らすのだ。"],["めたん","1,200は、非支配株主に帰属する当期純利益から引くんじゃないの？"],["ずんだもん","そこがよくある間違いなのだ。配当を払っても、S社の当期純利益は動いていないのだ。"],["ずんだもん","配当は、S社の純資産が減ったということなので、非支配株主持分そのものを減らすのだ。"],["めたん","その他有価証券評価差額金は、当期に2,000減ったわ。"],["ずんだもん","上が△1,600、下が△400なのだ。"],["ずんだもん","X3年度末の合計は720,200なのだ。評価差額の実現は、2年分で△800になっているのだ。"]],[["ずんだもん","次は資料8の未実現利益なのだ。"],["めたん","P社がS社に売った商品が、S社の棚卸資産に残っているのね。"],["ずんだもん","親会社から子会社に売る、ダウンストリームなのだ。"],["ずんだもん","グループの中で売っても、外に売れていない商品の利益は、まだ本当の利益ではないのだ。"],["ずんだもん","スタートは商品なのだ。身内に売って値段が上がるわけがないので、期末の商品が過大なのだ。"],["めたん","だから期末の1,600は、商品を減らして、売上原価を増やすのね。"],["ずんだもん","そうなのだ。P社が計上した利益を、売上原価で1,600消すのだ。"],["めたん","前期末の2,000は、どうするの？"],["ずんだもん","去年消した分を、今年も引き継いで消すのだ。でも前の期末に残っていた商品は、今年は外に売れているのだ。"],["ずんだもん","だから当期首の利益剰余金を2,000減らして、当期の売上原価を2,000減らすのだ。"],["めたん","当期首は2,000減って、当期の利益は2,000増えるのね。"],["ずんだもん","その通りなのだ。期首の仕訳は覚えなくていいのだ。期末の仕訳を書いて、引き継いで逆にすれば出てくるのだ。"]],[["ずんだもん","いよいよ資料7、S社株の10%の売却なのだ。"],["めたん","80%持っていたのが、70%になるのね。まだ子会社のままだわ。"],["ずんだもん","そうなのだ。支配は続いているので、P社と非支配株主の間の取引になるのだ。"],["ずんだもん","連結では、P社と非支配株主を親戚のように考えるのだ。だからこの売却は、資本取引なのだ。"],["めたん","資本取引だと、どうなるの？"],["ずんだもん","損益は出さないのだ。差が出たら、売却益ではなく資本剰余金にするのだ。"],["ずんだもん","まず個別の仕訳から見るのだ。P社は80%を550,000で買ったのだ。"],["めたん","売った10%の分の原価は、550,000を80%で割って、10%を掛けるのね。"],["ずんだもん","その通りなのだ。68,750なのだ。これが個別上の簿価、個ボカなのだ。"],["めたん","82,000で売ったから、個別の売却益は13,250ね。"],["ずんだもん","でも連結では、子会社株式という科目は使えないのだ。代わりに非支配株主持分が増えるのだ。"],["ずんだもん","連結で売った物の値打ちは、取得原価ではなく、S社の純資産の10%なのだ。これを連結上の簿価、連ボカと言うのだ。"],["めたん","個別は取得原価で、連結は純資産と連動した値打ちなのね。"],["ずんだもん","そうなのだ。王冠の絵を描くのだ。左に売価、まん中に個ボカ、右に連ボカなのだ。"],["ずんだもん","個別の仕訳は、売価と個ボカの差で、売却益13,250を出しているのだ。"],["ずんだもん","連結では、売価と連ボカの差を、資本剰余金にするのだ。個別の売却益は、ペケして消すのだ。"],["めたん","個別から連結に直すのが、連結修正仕訳ね。"]],[["ずんだもん","連ボカを、タイムテーブルで出すのだ。"],["ずんだもん","X3年度末の合計720,200に、売った10%を掛けるのだ。"],["めたん","72,020になるわ。これが連ボカね。"],["ずんだもん","もう1手あるのだ。その他有価証券評価差額金の取り崩しなのだ。"],["めたん","売ったら、評価差額金も動くの？"],["ずんだもん","これまでP社の分として連結に載せてきた評価差額金は、矢印の上の分なのだ。"],["ずんだもん","X2年度の＋2,400と、X3年度の△1,600で、合わせて800なのだ。"],["ずんだもん","そのうち、売った10%の分は、もうP社の分ではないのだ。80分の10で、100を取り崩すのだ。"],["めたん","800に80分の10を掛けて、100ね。"],["ずんだもん","タイムテーブルには、△72,020と＋100を2段に分けて書くのだ。2つを合わせた71,920が、連結上の簿価なのだ。"],["めたん","非支配株主持分は72,020増えて、評価差額金は100減るのね。"],["ずんだもん","その通りなのだ。売価の82,000から71,920を引いて、10,080なのだ。"],["めたん","売価のほうが大きいから、資本剰余金がプラスの10,080ね。"],["ずんだもん","そうなのだ。連結損益計算書の子会社株式売却益は、必ずゼロなのだ。"],["めたん","その分、個別の売却益13,250は、連結の当期純利益から消えるのね。"],["ずんだもん","ここを引き忘れる人が多いのだ。あとの当期純利益で必ず引くのだ。"]],[["ずんだもん","材料がそろったので、答案の表を埋めていくのだ。まずは、はじめの当期首残高なのだ。"],["めたん","資本金と資本剰余金は、P社とS社を足すの？"],["ずんだもん","足しても、S社の分は投資と資本の相殺で全部消えるのだ。だから結局P社のみなのだ。"],["めたん","資本金も資本剰余金も自己株式も、P社のX2年度の数字をそのまま書くのね。"],["ずんだもん","利益剰余金は、P社の300,000に、タイムテーブルの矢印の上を足すのだ。"],["めたん","前期の矢印の上の23,680を足すのね。"],["ずんだもん","そこから、前期ののれん償却1,400と、前期末の未実現利益2,000を引くのだ。"],["めたん","320,280になるわ。"],["ずんだもん","その他の包括利益累計額も同じなのだ。P社の20,000に、矢印の上の2,400を足すのだ。"],["めたん","22,400ね。"],["ずんだもん","非支配株主持分は、X2年度末の合計702,600に20%を掛けるだけなのだ。"],["めたん","140,520になるわ。評価差額の実現の分も、もう合計に入っているのね。"],["ずんだもん","その通りなのだ。だから電卓だけで出るのだ。"]],[["ずんだもん","次は、親会社株主に帰属する当期純利益なのだ。利益剰余金の列の当期変動額なのだ。"],["めたん","これも、P社の利益に、矢印の上を足すのね。"],["ずんだもん","そうなのだ。P社の120,000に、S社の当期の矢印の上20,480を足すのだ。"],["めたん","そこから、修正を足し引きするのね。"],["ずんだもん","1つ目は、当期ののれん償却1,400を引くのだ。"],["ずんだもん","2つ目は、S社から受け取った配当4,800を引くのだ。グループの中のお金の移動だったのだ。"],["めたん","3つ目は未実現利益ね。期首の2,000が実現して足して、期末の1,600を引くわ。"],["ずんだもん","4つ目が、個別の子会社株式売却益13,250を引くのだ。"],["めたん","全部で121,430になるわ。"],["ずんだもん","その通りなのだ。剰余金の配当は、P社の△20,000だけなのだ。S社の配当は、全部消えているのだ。"]],[["ずんだもん","最後に当期末残高と、残りの変動額なのだ。"],["めたん","資本剰余金は、P社の598,000に、一部売却の10,080を足すのね。"],["ずんだもん","その通りなのだ。608,080なのだ。"],["めたん","利益剰余金は、期首から配当を引いて、当期純利益を足して、421,710ね。"],["ずんだもん","その他の包括利益累計額は、P社の18,000に、矢印の上を足して、取り崩しを引くのだ。"],["めたん","矢印の上は、2,400と△1,600で800ね。100を引いて、18,700になるわ。"],["ずんだもん","変動額は、期末から期首を引いた△3,700なのだ。"],["めたん","非支配株主持分の期末は、X3年度末の合計720,200に、売った後の30%を掛けるのね。"],["ずんだもん","そうなのだ。216,060なのだ。"],["めたん","変動額は、矢印の下を足していけばいいのね。"],["ずんだもん","そこは必ず、期末から期首を引いた差額で取るのだ。"],["ずんだもん","配当の1,200や、一部売却の72,020があるので、矢印の下だけを足すと合わないのだ。"],["めたん","216,060から140,520を引いて、75,540ね。"],["ずんだもん","その通りなのだ。期首と期末を電卓だけで出して、差額を取る。こうすれば、配当や売却があっても間違えないのだ。"]],[["ずんだもん","最後に、模範解答で全部の欄を確かめるのだ。"],["めたん","当期首残高は、P社のみと、矢印の上の足し算だったわね。"],["ずんだもん","当期変動額は、株式の発行と自己株式の処分がP社の個別のまま、剰余金の配当もP社のみなのだ。"],["めたん","子会社株式の売却による持分の増減額が、資本剰余金の10,080ね。"],["ずんだもん","そうなのだ。株主資本以外の項目の当期変動額は、差額で△3,700と75,540なのだ。"],["めたん","最後に縦に足して、当期末残高が合うかを確かめるのね。"],["ずんだもん","その通りなのだ。"]],[["ずんだもん","まとめなのだ。問題1は文章と計算の8つだったのだ。"],["めたん","減価償却の限度超過は将来減算で、税金の前払いだからDTAだったわね。"],["ずんだもん","税率変更は、T勘定を2つ並べて、DTAの差が法人税等調整額なのだ。"],["めたん","キャッシュ・フロー見積法は、将来のキャッシュだけ変えて、割引率は当初のままね。"],["ずんだもん","見積りの開示のリスクは、有利な場合と不利な場合の両方を含むのだ。"]],[["ずんだもん","問題2は、タイムテーブルが全部の出発点だったのだ。"],["めたん","建物の評価差額は、売らなくても毎年400ずつ実現するのね。"],["ずんだもん","期首の欄は、P社の数字に、矢印の上を足すのだ。非支配株主持分は合計に比率を掛けるのだ。"],["めたん","非支配株主持分の変動額は、必ず差額で取るのね。"],["ずんだもん","一部売却の差は資本剰余金で、個別の売却益は消すのだ。"],["めたん","評価差額金の取り崩しも、忘れないようにするわ。"],["ずんだもん","これで165回の会計学は全部なのだ。お疲れさまなのだ。"]]],"shorts":[{"hl":"[税率変更]は/DTAの差で","at":102.04,"blob":"564896741b51cc9656a3399c3f32df57"},{"hl":"割引率は/[当初の3%]のまま","at":236.59,"blob":"d5087bb91bf7137627aa05d90ff66c04"},{"hl":"建物は/[売らなくても]実現","at":513.5,"blob":"e066a682e4b34928a57da3cc62312678"},{"hl":"一部売却の差は/[資本剰余金]","at":697.98,"blob":"43e2782eedf3caa0d0f97eda290a333e"},{"hl":"非支配株主持分は/[期末−期首]で","at":918.35,"blob":"6f4390dc789ad7dbbb4fc49453ad896e"}]},{"kind":"exam","no":"165回","sub":"過去問","ch":165,"probs":[],"hl":"","acct":"過去問","id":"x165-ko","title":"工業簿記","sn":"工簿","w":0.0,"wt":[]},{"kind":"exam","no":"165回","sub":"過去問","ch":165,"probs":[],"hl":"[取替投資]の差額と/[再投資の仮定]","acct":"過去問","id":"x165-ge","title":"原価計算","sn":"原計","w":0.0,"wt":[],"video":{"blob":"1c8414593f266ae731025b6e279cccbc","secs":795.62,"mb":10.2},"scenes":[[0,"原価計算の全体像"],[37.33,"意思決定の2つの種類"],[77.79,"取替投資は差額で考える"],[113.39,"新設備の購入と旧設備の売却"],[146.55,"売却損と、その節税"],[202.19,"旧TAXはいつ入れるか"],[234.2,"2023年度末の差額キャッシュ・フロー"],[259.46,"差額P/LでRを出す"],[312.48,"税金がある場合のR"],[351.65,"R を問題の3つに分ける"],[435.39,"差額タイムテーブル"],[472.94,"正味現在価値"],[514.87,"再投資の仮定とは"],[544.43,"金庫に入れておく場合"],[583.84,"資本コストで再投資する場合"],[659.11,"内部利益率法の再投資の仮定"],[696.34,"回収期間法"],[737.31,"模範解答"],[763.28,"まとめ：差額キャッシュ・フロー"],[781.37,"まとめ：再投資の仮定"]],"script":[[["ずんだもん","今回は、165回の原価計算を、最初から最後まで解くのだ。"],["めたん","原価計算は1問だけね。設備を新しいものに取り替えるかどうか、という話だわ。"],["ずんだもん","そうなのだ。設備投資の意思決定、その中でも取替投資なのだ。"],["めたん","文章の空欄に、アからチまでの金額と、aからdまでの言葉を入れるのね。"],["ずんだもん","金額は全部で17個あるのだ。でも、前の答えを使って次を出す形なので、下書きが一番大事なのだ。"],["めたん","1個つまずくと、後ろが全部ずれるってことね。"],["ずんだもん","その通りなのだ。だから、差額のP/Lとタイムテーブルを、最初にきちんと描くのだ。"],["めたん","下書きは差額P/Lとタイムテーブル、その2つで進めるのね。"],["ずんだもん","そうなのだ。最後に、再投資の仮定と回収期間法の話も出てくるのだ。順に見ていくのだ。"]],[["ずんだもん","最初の空欄はaなのだ。意思決定には、a的意思決定と設備投資の意思決定がある、とあるのだ。"],["めたん","設備投資のほうは、何年も先までお金が動く、大きな話よね。"],["ずんだもん","そうなのだ。何百億もかけて新しいエリアを作る、というような、トップが決める話なのだ。"],["めたん","じゃあ、もう一方は現場の細かい話ね。"],["ずんだもん","その通りなのだ。お土産をTシャツにするか風船にするか、というような、日々の業務の話なのだ。"],["ずんだもん","aは「業務」なのだ。模範解答では、業務執行的と書いても正解なのだ。"],["めたん","業務的意思決定では、差額原価と差額収益で比べるのよね。"],["ずんだもん","そうなのだ。でも設備投資は何年にもわたるので、お金の時間価値を考えるのだ。"],["めたん","今年の100と来年の100は、値打ちが違うってことね。"],["ずんだもん","そうなのだ。だから利益ではなく、いつ入っていつ出るか分かるキャッシュで考えるのだ。"]],[["ずんだもん","この問題は取替投資なのだ。もう古い設備があって、それを新しい設備に取り替えるか悩んでいるのだ。"],["めたん","新しい設備を買う案と、古い設備を使い続ける案を、それぞれ計算して比べるのね。"],["ずんだもん","それだと遅いのだ。この手の問題は、両方の案を丁寧には聞いてこないのだ。"],["ずんだもん","新しい案と古い案の差を、一発で聞いてくるのだ。だから下書きも、最初から差で描くのだ。"],["めたん","問題文にも、旧設備を使い続ける場合と比べて異なってくるキャッシュ・フローを考える、とあるわ。"],["ずんだもん","それが差額キャッシュ・フローなのだ。取り替えたと仮定して、取り替えなければ起きなかったお金の出入りだけを拾うのだ。"],["めたん","取り替えたことにして、増えたお金と減ったお金を数えるのね。"],["ずんだもん","その通りなのだ。コツは、本当に取り替えたと思うことなのだ。"]],[["ずんだもん","では、取り替えたと思って、投資する時点で起きることを並べるのだ。ここでアとイが埋まるのだ。"],["めたん","まず新しい設備を買うから、20,000,000が出ていくわ。"],["ずんだもん","そうなのだ。お金が出ていくので、△を付けるのだ。アは△20,000,000なのだ。"],["めたん","新しい設備を買ったら、古い設備はもういらないわね。"],["ずんだもん","設備が2台あっても仕方ないのだ。新しいのを買った瞬間に、古いのを9,000,000で売るのだ。"],["めたん","売ったお金は入ってくるから、イは9,000,000ね。"],["ずんだもん","その通りなのだ。タイムテーブルでは、線の上がプラス、線の下がマイナスなのだ。"],["ずんだもん","投資する時点の線の下に新C、線の上に旧Sを置くのだ。Cは設備に払うお金、Sは売ったお金のことなのだ。"]],[["ずんだもん","次はウとエなのだ。問題文でも、忘れてはいけない、と念を押しているところなのだ。"],["めたん","旧設備の簿価と売却価格の差が売却損になる、とあるわ。"],["ずんだもん","まず簿価を出すのだ。旧設備は18,000,000で買って、6年で償却しているのだ。"],["めたん","1年で3,000,000ずつ償却して、2年使ったのね。"],["ずんだもん","そうなのだ。2年分の6,000,000が減って、簿価は12,000,000なのだ。"],["めたん","それを9,000,000で売るから、3,000,000の損になるわ。"],["ずんだもん","その通りなのだ。ウは3,000,000なのだ。"],["めたん","でも、売却損はお金じゃないわよね。キャッシュで考えるなら、関係ないんじゃない？"],["ずんだもん","いいところに気づいたのだ。売却損そのものは、お金が出ていくわけではないのだ。"],["ずんだもん","でも売却損も費用なので、利益が減って、払う税金が安くなるのだ。"],["めたん","税金が浮いた分は、お金が残るのね。"],["ずんだもん","そうなのだ。税金が浮くのもキャッシュのプラスなのだ。3,000,000に税率30%を掛けるのだ。"],["めたん","900,000ね。これがエになるわ。"],["ずんだもん","その通りなのだ。売却の代金ではなく、売却損に税率を掛けるのが大事なのだ。"],["めたん","売った9,000,000に30%を掛けたくなるけど、それは違うのね。"],["ずんだもん","税金を動かすのは損益だけなのだ。売った代金は税金に関係ないのだ。"]],[["ずんだもん","この900,000を、タイムテーブルのどこに置くかが問題なのだ。"],["めたん","税金を払うのは、普通は1年後よね。"],["ずんだもん","よく出るのは、期首に取り替えを悩んでいて、1年後の期末に税金が出る形なのだ。"],["ずんだもん","でも一番大事なのは、問題に指示があれば指示に従うことなのだ。"],["めたん","この問題は、税金の支払いは次年度はじめ、つまりその年度末と同じだと書いてあるわ。"],["ずんだもん","そうなのだ。旧設備を売ったのは2023年度末なので、税金の効果も同じ2023年度末に入れるのだ。"],["めたん","売った日と、税金が浮く日が同じなのね。"],["ずんだもん","その通りなのだ。だから旧TAXは、旧Sの真上に積むのだ。TAXは税金のことなのだ。"]],[["ずんだもん","これで、投資する時点の箱がそろったのだ。オを出すのだ。"],["めたん","出ていくのが新しい設備の20,000,000ね。"],["ずんだもん","入ってくるのは、旧設備の売却9,000,000と、売却損の節税900,000なのだ。"],["めたん","20,000,000から、9,000,000と900,000を引くのね。"],["ずんだもん","そうなのだ。出ていく方が多いので、差し引き10,100,000の支出なのだ。"],["ずんだもん","オは△10,100,000なのだ。"],["めたん","新しい設備は20,000,000でも、実際の負担は半分くらいになるのね。"],["ずんだもん","古い設備を売ったお金と、浮いた税金が助けてくれるのだ。"]],[["ずんだもん","次は、毎年のキャッシュ・フローなのだ。ここからカ、キ、ク、ケが埋まるのだ。"],["ずんだもん","下書きは、差額のP/LをT勘定で描くのだ。新しい設備と古い設備の差だけを書くのだ。"],["めたん","新と旧でT勘定を2つ切るんじゃなくて、いきなり差を1つ書くのね。"],["ずんだもん","そうなのだ。右がキャッシュ・インフロー、左がキャッシュ・アウトフローなのだ。"],["めたん","キャッシュ・インフローは、毎年8,000,000増えるわ。"],["ずんだもん","取替投資は、普通は売上が変わらないのだ。古いエアコンでも新しいエアコンでも、お客さんは増えないのだ。"],["めたん","でもこの問題は、品質の高い製品が作れて、高い値段で売れるのね。"],["ずんだもん","その通りなのだ。だから右に8,000,000が入るのだ。左の現金支出原価は2,000,000増えるのだ。"],["めたん","減価償却費は、どう入れるの？"],["ずんだもん","減価償却費も、新と旧の差で入れるのだ。"],["めたん","新しい設備は取得原価を4年で割るから、古い設備の3,000,000より大きくなるわね。"],["ずんだもん","新しい設備は5,000,000なので、差は2,000,000なのだ。取り替えると、減価償却費がその分だけ増えるのだ。"],["めたん","残りが営業利益ね。8,000,000から、2,000,000と2,000,000を引いて、4,000,000になるわ。"],["ずんだもん","その通りなのだ。"]],[["ずんだもん","この差額P/Lから、毎年増えるお金を出すのだ。リターンのR、と呼ぶのだ。"],["めたん","Rは、営業利益の4,000,000でいいんじゃないの？"],["ずんだもん","そこが間違えやすいところなのだ。減価償却費は費用だけど、お金は出ていかないのだ。"],["めたん","だから、減価償却費の分は会社に残るのね。"],["ずんだもん","そうなのだ。ただ税金があるので、営業利益の30%は税金で取られるのだ。"],["ずんだもん","営業利益の4,000,000のうち、左下の30%が、虫食いのように税金で取られるのだ。"],["めたん","取られるのは1,200,000ね。"],["ずんだもん","残った形は、減価償却費と、営業利益の70%を合わせた、いびつな面積なのだ。"],["めたん","2,000,000と、4,000,000の70%の2,800,000を足して、4,800,000ね。"],["ずんだもん","その通りなのだ。これが毎年のR、4,800,000なのだ。"]],[["ずんだもん","この問題は、Rを3つに分けて聞いているのだ。カ、キ、クなのだ。"],["めたん","カは、減価償却費の節税を一切考えない、税引後の差額キャッシュ・フローね。"],["ずんだもん","もし減価償却費が無かったら、いくら残るか、と考えるのだ。"],["めたん","入ってくる8,000,000から、出ていく2,000,000を引くと6,000,000ね。"],["ずんだもん","そうなのだ。減価償却費が無ければ、その6,000,000の30%を丸ごと取られるのだ。"],["めたん","70%が残るから、4,200,000になるわ。"],["ずんだもん","カは4,200,000なのだ。"],["ずんだもん","次のキは、新設備の減価償却費による節税なのだ。タックス・シールドと言うのだ。"],["めたん","タックス・シールドって、どういう意味？"],["ずんだもん","減価償却費が損金になって、税金という攻撃から会社を守ってくれる、盾のことなのだ。"],["めたん","減価償却費があるおかげで、その税率分だけ税金を取られずに済むのね。"],["ずんだもん","そうなのだ。新しい設備の減価償却費5,000,000に、30%を掛けるのだ。"],["めたん","1,500,000ね。これがキだわ。"],["ずんだもん","最後のクは、旧設備の減価償却費の節税なのだ。"],["めたん","旧設備は売ってしまうから、その盾がなくなるのね。"],["ずんだもん","その通りなのだ。使い続けていれば、毎年3,000,000の30%で、900,000の税金が浮いていたのだ。"],["ずんだもん","取り替えると、それがなくなるのだ。だから差額では△900,000なのだ。クは900,000なのだ。"],["めたん","問題文に、すでに△が付いているから、答えは900,000だけ書けばいいのね。"],["ずんだもん","そうなのだ。3つを合わせると、4,200,000に1,500,000を足して、900,000を引くのだ。"],["めたん","4,800,000になって、差額P/Lで出したRと同じね。"],["ずんだもん","その通りなのだ。ケは4,800,000なのだ。"],["めたん","キとクをまとめると、減価償却費の差2,000,000の30%で、600,000になるわ。"],["ずんだもん","そうなのだ。差額P/Lでは、その600,000が、減価償却費の欄の小さい丸なのだ。"]],[["ずんだもん","Rが出たので、タイムテーブルを描くのだ。取り替えたと仮定した、差額のタイムテーブルなのだ。"],["めたん","投資する時点には、線の下に新C、上に旧Sと旧TAXが乗っているわね。"],["ずんだもん","そして、1年目から4年目の末まで、新R−旧Rの4,800,000を毎年並べるのだ。"],["めたん","4年目の最後に、設備を売ったお金は入らないの？"],["ずんだもん","問題文に、耐用年数に達したときには売却価値はない、とあるのだ。"],["ずんだもん","新しい設備も、古い設備も、4年後には0なのだ。だから最後は何も足さないのだ。"],["めたん","古い設備も、あと4年使える分が残っていたのね。"],["ずんだもん","そうなのだ。6年のうち2年使ったので、残りはちょうど4年なのだ。年数はそろえてくれるのだ。"],["めたん","Totalの段は、最初が△10,100,000、あとは4,800,000が4つね。"]],[["ずんだもん","次はコの、正味現在価値なのだ。NPVとも言うのだ。"],["めたん","将来のお金を今の値打ちに直して、最初に出したお金を引いたものよね。"],["ずんだもん","そうなのだ。現在価値に直すために、問題文の現価係数を使うのだ。"],["めたん","資本コストが5%だから、1年後の4,800,000は1.05で割り引くのね。"],["ずんだもん","その通りなのだ。資本コストは、会社が最低限稼がないといけない儲けの割合なのだ。"],["めたん","1年後の分は0.952381、2年後は0.907029を掛けるのね。"],["ずんだもん","そうなのだ。4年分を、それぞれの現価係数で割り引いて足すのだ。"],["めたん","そこから、最初の10,100,000を引くのを忘れないようにするわ。"],["ずんだもん","引くのを忘れたら、ただの現在価値なのだ。正味にするために、投資額を引くのだ。"],["ずんだもん","コは6,920,560なのだ。プラスなので、取り替えたほうが得なのだ。"],["めたん","4年分で17,020,560になって、10,100,000を引いたのね。"]],[["ずんだもん","ここから後半なのだ。正味現在価値法には、再投資の仮定がある、という話なのだ。"],["めたん","再投資の仮定って、何のこと？"],["ずんだもん","1年目に入ってきた4,800,000を、そのまま持っておくのではなく、もう1回どこかに投資して運用する、と考えることなのだ。"],["めたん","入ってきたお金を、財布にしまっておくわけじゃないのね。"],["ずんだもん","そうなのだ。それが本当かどうかを、2つの場合で確かめる、という問題なのだ。"],["めたん","1つ目が金庫に入れておく場合、2つ目が資本コストで再投資する場合ね。"],["ずんだもん","その通りなのだ。どちらも、一度4年後にお金を集めてから、今の値打ちに戻すのだ。"]],[["ずんだもん","まず金庫に入れておく場合なのだ。サ、シ、スが埋まるのだ。"],["めたん","金庫に入れたら、お金は増えも減りもしないわね。"],["ずんだもん","そうなのだ。1年目から3年目の4,800,000は、そのまま4年後まで持っていくのだ。"],["めたん","4年後の分と合わせて、4,800,000が4つで、19,200,000になるわ。"],["ずんだもん","サは19,200,000なのだ。これを今の値打ちに戻すのだ。"],["めたん","4年後のお金だから、4年の現価係数0.822702を掛けるのね。"],["ずんだもん","そうなのだ。15,795,878になるのだ。シは15,795,878なのだ。"],["めたん","スは、そこから最初の10,100,000を引いて、5,695,878ね。"],["ずんだもん","その通りなのだ。"],["めたん","さっきのコより、1,200,000くらい小さいわ。"],["ずんだもん","金庫に入れている間、お金が稼いでいない分だけ、小さくなったのだ。"]],[["ずんだもん","では、なぜ差が出たのかなのだ。bの空欄なのだ。"],["ずんだもん","正味現在価値法は、入ってきたお金を資本コスト率で再投資する、と暗に仮定しているのだ。"],["めたん","bは資本コストね。加重平均資本コストとも書いてあったわ。"],["ずんだもん","そうなのだ。加重平均資本コストを、略して単に資本コストと言うのだ。"],["めたん","どうして、割り引くだけで再投資したことになるの？"],["ずんだもん","5%で1回ふくらませて未来に持っていき、5%で2回割り引くのは、5%で1回割り引くのと同じなのだ。"],["めたん","掛けてから割るのが面倒だから、いつもは一気に割り引いているだけなのね。"],["ずんだもん","その通りなのだ。それを、明示的にやるのがセとソとタなのだ。"],["ずんだもん","1年目の4,800,000は、あと3年運用するので、終価係数の1.157625を掛けるのだ。"],["めたん","終価係数って、何？"],["ずんだもん","終わりの価値と書いて終価なのだ。現在価値の逆で、最後の年に値打ちをそろえる係数なのだ。"],["めたん","2年目の分は1.1025、3年目の分は1.05を掛けるのね。4年目の分はそのままだわ。"],["ずんだもん","そうなのだ。4つを足した終価の合計が、20,688,600なのだ。セは20,688,600なのだ。"],["めたん","これにも0.822702を掛けて、今の値打ちに戻すのね。"],["ずんだもん","17,020,553になるのだ。ソは17,020,553なのだ。"],["めたん","10,100,000を引くと、6,920,553ね。これがタだわ。"],["ずんだもん","その通りなのだ。最初のコの6,920,560と、ほぼ同じになったのだ。"],["めたん","7だけずれているのは、どうして？"],["ずんだもん","現価係数が近似値だからなのだ。問題文にも、現価係数の誤差によるものと書いてあるのだ。"]],[["ずんだもん","次はcなのだ。正味現在価値法以外で、時間価値を考える方法の1つなのだ。"],["めたん","cの率で再投資すると仮定されている、とあるわ。"],["ずんだもん","ここは「内部利益」なのだ。内部利益率法なのだ。"],["めたん","内部利益率って、何？"],["ずんだもん","正味現在価値がちょうど0になる割引率のことなのだ。IRRとも言うのだ。"],["ずんだもん","内部利益率法は、入ってきたお金を、その内部利益率で再投資すると仮定しているのだ。"],["めたん","内部利益率が20%なら、20%でまた運用できると考えるのね。"],["ずんだもん","そうなのだ。でも20%も儲かる案件が、毎年続くとは考えにくいのだ。"],["めたん","5%くらいの儲け話なら、いくらでもありそうだわ。"],["ずんだもん","そうなのだ。だから資本コストで再投資する正味現在価値法のほうが、仮定が現実的なのだ。"]],[["ずんだもん","最後は、時間価値を考えない方法なのだ。dとチが埋まるのだ。"],["めたん","初期投資額を何年で回収できるかで評価する方法、とあるわ。"],["ずんだもん","名前の通り、回収期間法なのだ。dは「回収期間」なのだ。"],["めたん","チの計算は、ここだけ問題文で別の数字が出されているのね。"],["ずんだもん","そうなのだ。最初に出ていくお金が20,000,000、毎年入ってくるお金が5,000,000なのだ。"],["めたん","20,000,000を5,000,000で割って、4年で回収できるのね。"],["ずんだもん","その通りなのだ。チは4なのだ。"],["めたん","欠点は、時間価値を考えないことと、回収した後のキャッシュ・フローを見ないことね。"],["ずんだもん","そうなのだ。回収した後に何年続いても、答えは変わらないのだ。安全性は分かっても、儲かるかは分からないのだ。"],["めたん","でも、早く回収できるほうがリスクは少ないものね。"],["ずんだもん","そうなのだ。先のキャッシュほど不確実なので、安全性を見られて、計算も簡単なので、実務では好まれるのだ。"]],[["ずんだもん","最後に、模範解答で全部の欄を確かめるのだ。"],["めたん","アからオが、投資する時点の箱だったわね。新C、旧S、売却損、その節税、合計の順だわ。"],["ずんだもん","カからケが、差額P/LのRを3つに分けたものなのだ。"],["めたん","コが正味現在価値で、サからタが、金庫と再投資の比べね。"],["ずんだもん","チが回収期間なのだ。言葉は、業務、資本コスト、内部利益、回収期間なのだ。"],["めたん","言葉の4つは、1つ2点で配点が大きいのね。"],["ずんだもん","その通りなのだ。計算を落としても、言葉は必ず取りたいのだ。"]],[["ずんだもん","まとめなのだ。取替投資は、取り替えたと仮定した差額で、一発で描くのだ。"],["めたん","売却損には税率を掛けて、指示どおり2023年度末に旧TAXを入れたわね。"],["ずんだもん","Rは差額P/Lの、減価償却費と営業利益の70%を合わせた、いびつな面積なのだ。"],["めたん","カ、キ、クに分けても、合計は4,800,000で同じになるのね。"]],[["ずんだもん","正味現在価値法は、資本コストで再投資する仮定なのだ。金庫に入れると、正味現在価値は小さくなるのだ。"],["めたん","内部利益率法は内部利益率で再投資、回収期間法は時間価値を考えない、ね。"],["ずんだもん","これで165回の原価計算は全部なのだ。お疲れさまなのだ。"]]],"shorts":[{"hl":"売却損は/[損×税率]で","at":146.55,"blob":"128def4d9b2eeb2b8d5e9d3de9da89d9"},{"hl":"Rは/[営業利益]ではない","at":312.48,"blob":"5e99b6b4342c6ce6950c0a0d3e062c12"},{"hl":"古い機械の/[盾]も消える","at":351.65,"blob":"9f6e3f2060991210a2c279eda2dbcaea"},{"hl":"NPV法は/[資本コストで再投資]","at":544.43,"blob":"afcff4f2abd274ad80b727e2ed01872a"},{"hl":"回収期間法は/[回収後]を見ない","at":696.34,"blob":"25740c0868836cde7f1722f36cbb219b"}]},{"kind":"exam","no":"167回","sub":"過去問","ch":167,"probs":[],"hl":"","acct":"過去問","id":"x167-bo","title":"商業簿記","sn":"商簿","w":0.0,"wt":[]},{"kind":"exam","no":"167回","sub":"過去問","ch":167,"probs":[],"hl":"","acct":"過去問","id":"x167-ka","title":"会計学","sn":"会計","w":0.0,"wt":[]},{"kind":"exam","no":"167回","sub":"過去問","ch":167,"probs":[],"hl":"","acct":"過去問","id":"x167-ko","title":"工業簿記","sn":"工簿","w":0.0,"wt":[]},{"kind":"exam","no":"167回","sub":"過去問","ch":167,"probs":[],"hl":"","acct":"過去問","id":"x167-ge","title":"原価計算","sn":"原計","w":0.0,"wt":[]},{"kind" let shortWatch = null;
function watchShorts() {
  if (shortWatch) { shortWatch.disconnect(); shortWatch = null; }
  const box = document.getElementById("shorts");
  if (!box || !("IntersectionObserver" in window)) return;
  shortWatch = new IntersectionObserver(es => es.forEach(e => {
    const vid = e.target.querySelector("video");
    if (!vid) return;
    if (e.isIntersecting && e.intersectionRatio >= .6) vid.play().catch(() => {}); else vid.pause();
  }), { root: box, threshold: [0, .6] });
  box.querySelectorAll(".short").forEach(a => {
    shortWatch.observe(a);
    const vid = a.querySelector("video"), bar = a.querySelector(".sline i");
    if (!vid) return;
    vid.addEventListener("timeupdate", () => { if (vid.duration) bar.style.width = (vid.currentTime / vid.duration * 100).toFixed(1) + "%"; });
    vid.addEventListener("click", () => { if (vid.paused) vid.play().catch(() => {}); else vid.pause(); });
  });
}

  if (v.drops && v.drops.length) {
    return `<section class="blk">${LBL(lb)}<ul class="kl">${v.drops.map(d => `<li><b>${KIND[d.kind] || ""}${d.pair ? `　「${esc(d.pair[0])}」を「${esc(d.pair[1])}」に` : ""}</b><br>${d.zwhat ? d.zwhat.map(t => `<span class="zp">${esc(t)}</span>`).join("") : esc(d.what)}
      <small>${[esc(d.prob), md(d.at), d.n ? "落とした欄 " + d.n : "", VS[d.vs] || ""].filter(Boolean).join("・")}</small>
      ${d.seek != null && v.video ? `<button class="seekb" data-seek="${d.seek}">この場面から再生　${mmss(d.seek)}</button>` : ""}</li>`).join("")}</ul>
      ${v.prev ? `<p>前の回から　直った ${v.prev.fixed}・残った ${v.prev.remain}</p>` : ""}</section>`;
  }
  if (v.wt && v.wt.length) return `<section class="blk">${LBL(lb)}<ul class="kl">${v.wt.map(t => `<li>${esc(t)}</li>`).join("")}</ul></section>`;
  return "";
}
function about(id) {
  const v = byId[id], vids = chVideos(v.sub, v.ch);
  const pct = Math.round(ratio(v.id) * 100);
  sheetKey = id;
  openSheet(`<div class="sheeth"><h2>概要</h2><button class="ico" data-back aria-label="閉じる">${I.close}</button></div>
    <div class="sbody">
      <h3>${name(v)}</h3>
      <div class="who"><span class="av" style="--h:${hue(v.sub, v.ch)}">${discTxt(v.sub, v.ch)}</span>${esc(place(v))}</div>
      <div class="stats"><div><b>${v.video ? mmss(v.video.secs) : "―"}</b><small>長さ</small></div><div><b>${pct}%</b><small>見たところ</small></div><div><b>${lvl(v) ? "●".repeat(lvl(v)) : "―"}</b><small>弱点</small></div></div>
      ${v.script ? `<button class="act scbtn" data-script="${v.id}">${I.doc}台本を読む</button>` : ""}
      ${isLec(v) ? `<section class="blk talk">${v.core ? coreHtml(v.core) : "<p>この講義の核はまだありません。</p>"}</section>` : ""}
      ${isProb(v) && v.zabout ? `<section class="blk talk">${v.zabout.map(t => `<p>${esc(t)}</p>`).join("")}</section>` : ""}
      ${dropsHtml(v)}
      ${isProb(v) && (v.lec || []).some(id => byId[id]) ? `<section class="blk">${LBL("この問題の講義")}<div class="links">${v.lec.filter(id => byId[id]).map(id => { const x = byId[id];
        return `<button data-open="${x.id}"><span class="no">${esc(x.no)}</span><span>${esc(x.title)}</span>${x.video ? "" : '<span class="now">動画は準備中</span>'}</button>`; }).join("")}</div></section>` : ""}
      ${v.scenes && v.video ? `<section class="blk">${LBL("場面の目次")}<div class="links">${v.scenes.map(([s, t]) => `<button data-seek="${s}"><span class="no">${mmss(s)}</span><span>${esc(t)}</span></button>`).join("")}</div></section>` : ""}
      ${v.probs && v.probs.length ? `<section class="blk">${LBL("この講義で解ける問題")}${(() => {
        // 解説動画のある問題は押せる行に、無い問題は文字だけ
        const pv = v.probs.map(no => V.find(x => isProb(x) && x.no === no)), has = pv.filter(Boolean);
        return (has.length ? `<div class="links">${has.map(x => `<button data-open="${x.id}"><span class="no">${esc(x.no.replace(/^\D+/, "問"))}</span><span>${esc(x.title)}</span></button>`).join("")}</div>` : "")
          + (has.length < pv.length ? `<p>${v.probs.filter((no, i) => !pv[i]).map(esc).join("、")}</p>` : ""); })()}</section>` : ""}
      <section class="blk">${LBL(isExam(v) ? "この回の科目" : "この章の講義と問題")}<div class="links">${vids.map(x => `<button data-open="${x.id}" ${x.id === v.id ? 'aria-current="true"' : ""}><span class="no">${esc(isExam(x) ? x.sn : isProb(x) ? x.no.replace(/^\D+/, "問") : x.no.replace(/^\D+/, ""))}</span><span>${esc(x.title)}</span>${x.id === playing ? '<span class="now">再生中</span>' : ratio(x.id) ? `<span class="now">${Math.round(ratio(x.id) * 100)}%</span>` : ""}</button>`).join("")}</div></section>
    </div>`);
}
const sceneAt = (v, t) => { let i = 0; v.scenes.forEach(([s], j) => { if (t >= s - .3) i = j; }); return i; };
function markScene() {
  const box = document.querySelector("#sheet .scr"), vid = document.getElementById("vid");
  if (!box || !vid || playing !== box.dataset.id) return;
  const i = sceneAt(byId[playing], vid.currentTime);
  box.querySelectorAll(".sc").forEach((x, j) => x.classList.toggle("now", j === i));
}
function scriptSheet(id) {
  const v = byId[id];
  sheetKey = id;
  openSheet(`<div class="sheeth"><h2>台本</h2><button class="ico" data-back aria-label="閉じる">${I.close}</button></div>
    <div class="sbody scr" data-id="${id}">${v.script.map((ls, i) => `<section class="sc">
      <button class="sch" data-sseek="${v.scenes[i][0]}"><span class="no">${mmss(v.scenes[i][0])}</span><b>${esc(v.scenes[i][1])}</b></button>
      ${ls.map(([w, t]) => `<p><i class="${w === "めたん" ? "m" : "z"}">${esc(w)}</i><span>${esc(t)}</span></p>`).join("")}</section>`).join("")}</div>`, false, playing === id);
  markScene();
}
function saveSheet(k) {
  sheetKey = k;
  openSheet(`<div class="sheeth"><h2>保存先</h2><button class="ico" data-back aria-label="閉じる">${I.close}</button></div>
    <div class="sbody">
      <div class="fold">${S.folders.map(f => `<label><input type="checkbox" data-fold="${f.id}" ${f.ids.includes(k) ? "checked" : ""}>${esc(f.name)}</label>`).join("")}</div>
      <form class="newf" data-newf><input id="newname" maxlength="20" placeholder="新しいフォルダ" aria-label="新しいフォルダの名前"><button>作る</button></form>
    </div>`, true);
}
function newFolderSheet() {
  sheetKey = null;
  openSheet(`<div class="sheeth"><h2>新しいフォルダ</h2><button class="ico" data-back aria-label="閉じる">${I.close}</button></div>
    <div class="sbody"><form class="newf" data-newf><input id="newname" maxlength="20" placeholder="フォルダの名前" aria-label="フォルダの名前"><button>作る</button></form></div>`, true);
}
function menuSheet(k, ctx) {
  sheetKey = k; sheetCtx = ctx || "";
  const v = byId[keyId(k)], s = isShort(k), f = sheetCtx.startsWith("folder:") ? folderOf(sheetCtx.slice(7)) : null;
  const it = (m, ic, t) => `<button data-m="${m}">${ic}<span>${t}</span></button>`;
  const later = folderOf(LATER);
  openSheet(`<div class="sheeth"><h2 class="sm">${s ? "ショート・" : ""}${name(v)}</h2><button class="ico" data-back aria-label="閉じる">${I.close}</button></div>
    <div class="menu">
      ${sheetCtx === "queue" ? it("unqueue", I.trash, "「次に再生」から外す") : ""}
      ${!s && v.video && sheetCtx !== "queue" && k !== playing ? it("next", I.qnext, "次に再生") + it("last", I.qlast, "最後に再生") : ""}
      ${later && !later.ids.includes(k) ? it("later", I.clock, "［後で見る］に保存") : ""}
      ${it("fav", I.mark(false), "お気に入りリストに保存")}
      ${f ? it("unfolder", I.trash, `［${esc(f.name)}］から削除`) : ""}
      ${s ? "" : it("done", I.check(false), finished(v.id) ? "未視聴に戻す" : seen(v.id) ? "見終わったにする／未視聴に戻す" : "見終わったにする")}
    </div>`, true);
}
function setDone(id, on) {
  if (on) S.prog[id] = Object.assign({ t: 0, d: 0 }, pg(id), { at: Date.now(), done: true });
  else S.prog[id] = { t: 0, d: 0, at: Date.now(), x: 1 };
  markProg(id); flush();
}
function doMenu(m) {
  const k = sheetKey, id = keyId(k), ctx = sheetCtx;
  if (m === "fav") return saveSheet(k);
  if (m === "done" && !finished(id) && seen(id)) {
    return openSheet(`<div class="sheeth"><h2 class="sm">${name(byId[id])}</h2><button class="ico" data-back aria-label="閉じる">${I.close}</button></div>
      <div class="menu"><button data-m="done1">${I.check(false)}<span>見終わったにする</span></button><button data-m="done0">${I.trash}<span>未視聴に戻す</span></button></div>`, true);
  }
  if (m === "next") { queue = [id].concat(queue.filter(x => x !== id)); toast("次に再生します"); }
  else if (m === "last") { queue = queue.filter(x => x !== id).concat(id); toast("最後に再生します"); }
  else if (m === "unqueue") { queue = queue.filter(x => x !== id); }
  else if (m === "later") { const f = folderOf(LATER); if (!f.ids.includes(k)) f.ids.push(k); markLib(); toast("［後で見る］に保存しました"); }
  else if (m === "unfolder") { const f = folderOf(ctx.slice(7)); if (f) { f.ids = f.ids.filter(x => x !== k); markLib(); toast(`［${f.name}］から削除しました`); } }
  else if (m === "done") setDone(id, !finished(id));
  else if (m === "done1") setDone(id, true);
  else if (m === "done0") setDone(id, false);
  back();
}
function playAll(fid) {
  const f = folderOf(fid); if (!f) return;
  const ids = folderItems(f).filter(k => !isShort(k) && byId[k].video);
  if (!ids.length) return;
  queue = ids.slice(1);
  leave(); openPlayer(ids[0], null, false, false);
  const vid = document.getElementById("vid"); if (vid) vid.play().catch(() => {});
}

// ---------- 操作 ----------
document.addEventListener("click", e => {
  if (e.target.id === "scrim") return back();
  const t = e.target.closest("button");
  if (!t) return;
  const d = t.dataset;
  if ("back" in d) back();
  else if ("search" in d) { leave(); searching = true; pushLayer(); render(); const i = document.getElementById("q"); if (i) i.focus(); }
  else if (d.tab) { leave(); tab = d.tab; showAll = false; meView = null; searching = false; render(); }
  else if (d.chip) { homeChip = d.chip; rerender(); }
  else if (d.fchip) { fChip = d.fchip; rerender(); }
  else if (d.ch) { leave(); pickCh = d.ch; if (showAll) back(); else render(); }
  else if ("all" in d) { leave(); showAll = true; pushLayer(); render(); }
  else if ("hist" in d) { leave(); meView = "hist"; pushLayer(); render(); }
  else if (d.folder) { leave(); meView = d.folder; fChip = "すべて"; pushLayer(); render(); }
  else if ("newfolder" in d) newFolderSheet();
  else if ("accts" in d) acctSheet();
  else if (d.acct) { flush(); try { localStorage.setItem(MOCK_ACCT, d.acct); } catch (e) {} location.reload(); }
  else if (d.playall) playAll(d.playall);
  else if (d.more) menuSheet(d.more, d.ctx);
  else if (d.m) doMenu(d.m);
  else if (d.short) {
    leave(); searching = false; meView = null; tab = "shorts";
    scrollMem.shorts = 0; render();
    const box = document.getElementById("shorts"), a = box && box.querySelector(`[data-sid="${d.short}"]`);
    if (a) box.scrollTop = a.offsetTop;
  }
  else if (d.open) {
    const vid = document.getElementById("vid"); if (vid) vid.pause();
    closeSheet(true);
    const inPlayer = !document.getElementById("player").hidden;
    if (!inPlayer) leave();
    openPlayer(d.open, d.at != null ? +d.at : null, d.fs === "1", inPlayer);
  }
  else if (d.seek) {
    const id = sheetKey, vid = document.getElementById("vid");
    closeSheet(true);
    if (playing === id && vid) { vid.currentTime = +d.seek; vid.play().catch(() => {}); }
    else { const inPlayer = !!playing; if (!inPlayer) leave(); openPlayer(id, +d.seek, tab === "shorts" && !inPlayer, inPlayer); }
  }
  else if ("full" in d) goFull();
  else if (d.script) scriptSheet(d.script);
  else if (d.sseek) {
    const vid = document.getElementById("vid");
    if (playing === sheetKey && vid) { vid.currentTime = +d.sseek; vid.play().catch(() => {}); markScene(); }
    else { const id = sheetKey, inPlayer = !!playing; closeSheet(true); if (!inPlayer) leave(); openPlayer(id, +d.sseek, tab === "shorts" && !inPlayer, inPlayer); }
  }
  else if (d.about) about(d.about);
  else if (d.save) saveSheet(d.save);
  else if (d.done) { setDone(d.done, !finished(d.done)); refreshPlayer(); }
  else if ("auto" in d) { S.set.auto = !S.set.auto; markSet(); flush(); refreshPlayer(); }
  else if (d.rate) {
    S.set.rate = +d.rate; markSet(); flush();
    const vid = document.getElementById("vid"); if (vid) vid.playbackRate = S.set.rate;
    document.querySelectorAll("[data-rate]").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.rate === S.set.rate)));
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "q") { q = e.target.value; document.getElementById("res").innerHTML = results(); }
});
document.addEventListener("change", e => {
  const d = e.target.dataset;
  if (d.fold != null && sheetKey) {
    const f = folderOf(d.fold);
    if (!f) return;
    if (e.target.checked) { if (!f.ids.includes(sheetKey)) f.ids.push(sheetKey); } else f.ids = f.ids.filter(x => x !== sheetKey);
    markLib();
  }
});
document.addEventListener("submit", e => {
  if (!e.target.matches("[data-newf]")) return;
  e.preventDefault();
  const n = document.getElementById("newname").value.trim();
  if (!n) return;
  S.folders.push({ id: "f" + Date.now().toString(36), name: n, ids: sheetKey ? [sheetKey] : [] }); markLib();
  if (sheetKey) saveSheet(sheetKey); else back();
});
render();
connect();
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));</script></body></html>
