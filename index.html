"資本金も資本剰余金も自己株式も、P社のX2年度の数字をそのまま書くのね。"],["ずんだもん","利益剰余金は、P社の300,000に、タイムテーブルの矢印の上を足すのだ。"],["めたん","前期の矢印の上の23,680を足すのね。"],["ずんだもん","そこから、前期ののれん償却1,400と、前期末の未実現利益2,000を引くのだ。"],["めたん","320,280になるわ。"],["ずんだもん","その他の包括利益累計額も同じなのだ。P社の20,000に、矢印の上の2,400を足すのだ。"],["めたん","22,400ね。"],["ずんだもん","非支配株主持分は、X2年度末の合計702,600に20%を掛けるだけなのだ。"],["めたん","140,520になるわ。評価差額の実現の分も、もう合計に入っているのね。"],["ずんだもん","その通りなのだ。だから電卓だけで出るのだ。"]],[["ずんだもん","次は、親会社株主に帰属する当期純利益なのだ。利益剰余金の列の当期変動額なのだ。"],["めたん","これも、P社の利益に、矢印の上を足すのね。"],["ずんだもん","そうなのだ。P社の120,000に、S社の当期の矢印の上20,480を足すのだ。"],["めたん","そこから、修正を足し引きするのね。"],["ずんだもん","1つ目は、当期ののれん償却1,400を引くのだ。"],["ずんだもん","2つ目は、S社から受け取った配当4,800を引くのだ。グループの中のお金の移動だったのだ。"],["めたん","3つ目は未実現利益ね。期首の2,000が実現して足して、期末の1,600を引くわ。"],["ずんだもん","4つ目が、個別の子会社株式売却益13,250を引くのだ。"],["めたん","全部で121,430になるわ。"],["ずんだもん","その通りなのだ。剰余金の配当は、P社の△20,000だけなのだ。S社の配当は、全部消えているのだ。"]],[["ずんだもん","最後に当期末残高と、残りの変動額なのだ。"],["めたん","資本剰余金は、P社の598,000に、一部売却の10,080を足すのね。"],["ずんだもん","その通りなのだ。608,080なのだ。"],["めたん","利益剰余金は、期首から配当を引いて、当期純利益を足して、421,710ね。"],["ずんだもん","その他の包括利益累計額は、P社の18,000に、矢印の上を足して、取り崩しを引くのだ。"],["めたん","矢印の上は、2,400と△1,600で800ね。100を引いて、18,700になるわ。"],["ずんだもん","変動額は、期末から期首を引いた△3,700なのだ。"],["めたん","非支配株主持分の期末は、X3年度末の合計720,200に、売った後の30%を掛けるのね。"],["ずんだもん","そうなのだ。216,060なのだ。"],["めたん","変動額は、矢印の下を足していけばいいのね。"],["ずんだもん","そこは必ず、期末から期首を引いた差額で取るのだ。"],["ずんだもん","配当の1,200や、一部売却の72,020があるので、矢印の下だけを足すと合わないのだ。"],["めたん","216,060から140,520を引いて、75,540ね。"],["ずんだもん","その通りなのだ。期首と期末を電卓だけで出して、差額を取る。こうすれば、配当や売却があっても間違えないのだ。"]],[["ずんだもん","最後に、模範解答で全部の欄を確かめるのだ。"],["めたん","当期首残高は、P社のみと、矢印の上の足し算だったわね。"],["ずんだもん","当期変動額は、株式の発行と自己株式の処分がP社の個別のまま、剰余金の配当もP社のみなのだ。"],["めたん","子会社株式の売却による持分の増減額が、資本剰余金の10,080ね。"],["ずんだもん","そうなのだ。株主資本以外の項目の当期変動額は、差額で△3,700と75,540なのだ。"],["めたん","最後に縦に足して、当期末残高が合うかを確かめるのね。"],["ずんだもん","その通りなのだ。"]],[["ずんだもん","まとめなのだ。問題1は文章と計算の8つだったのだ。"],["めたん","減価償却の限度超過は将来減算で、税金の前払いだからDTAだったわね。"],["ずんだもん","税率変更は、T勘定を2つ並べて、DTAの差が法人税等調整額なのだ。"],["めたん","キャッシュ・フロー見積法は、将来のキャッシュだけ変えて、割引率は当初のままね。"],["ずんだもん","見積りの開示のリスクは、有利な場合と不利な場合の両方を含むのだ。"]],[["ずんだもん","問題2は、タイムテーブルが全部の出発点だったのだ。"],["めたん","建物の評価差額は、売らなくても毎年400ずつ実現するのね。"],["ずんだもん","期首の欄は、P社の数字に、矢印の上を足すのだ。非支配株主持分は合計に比率を掛けるのだ。"],["めたん","非支配株主持分の変動額は、必ず差額で取るのね。"],["ずんだもん","一部売却の差は資本剰余金で、個別の売却益は消すのだ。"],["めたん","評価差額金の取り崩しも、忘れないようにするわ。"],["ずんだもん","これで165回の会計学は全部なのだ。お疲れさまなのだ。"]]],"shorts":[{"hl":"[税率変更]は/DTAの差で","at":102.04,"blob":"564896741b51cc9656a3399c3f32df57"},{"hl":"割引率は/[当初の3%]のまま","at":236.59,"blob":"d5087bb91bf7137627aa05d90ff66c04"},{"hl":"建物は/[売らなくても]実現","at":513.5,"blob":"e066a682e4b34928a57da3cc62312678"},{"hl":"一部売却の差は/[資本剰余金]","at":697.98,"blob":"43e2782eedf3caa0d0f97eda290a333e"},{"hl":"非支配株主持分は/[期末−期首]で","at":918.35,"blob":"6f4390dc789ad7dbbb4fc49453ad896e"}]},{"kind":"exam","no":"165回","sub":"過去問","ch":165,"probs":[],"hl":"","acct":"過去問","id":"x165-ko","title":"工業簿記","sn":"工簿","w":0.0,"wt":[]},{"kind":"exam","no":"165回","sub":"過去問","ch":165,"probs":[],"hl":"[取替投資]の差額と/[再投資の仮定]","acct":"過去問","id":"x165-ge","title":"原価計算","sn":"原計","w":0.0,"wt":[],"video":{"blob":"1c8414593f266ae731025b6e279cccbc","secs":795.62,"mb":10.2},"scenes":[[0,"原価計算の全体像"],[37.33,"意思決定の2つの種類"],[77.79,"取替投資は差額で考える"],[113.39,"新設備の購入と旧設備の売却"],[146.55,"売却損と、その節税"],[202.19,"旧TAXはいつ入れるか"],[234.2,"2023年度末の差額キャッシュ・フロー"],[259.46,"差額P/LでRを出す"],[312.48,"税金がある場合のR"],[351.65,"R を問題の3つに分ける"],[435.39,"差額タイムテーブル"],[472.94,"正味現在価値"],[514.87,"再投資の仮定とは"],[544.43,"金庫に入れておく場合"],[583.84,"資本コストで再投資する場合"],[659.11,"内部利益率法の再投資の仮定"],[696.34,"回収期間法"],[737.31,"模範解答"],[763.28,"まとめ：差額キャッシュ・フロー"],[781.37,"まとめ：再投資の仮定"]],"script":[[["ずんだもん","今回は、165回の原価計算を、最初から最後まで解くのだ。"],["めたん","原価計算は1問だけね。設備を新しいものに取り替えるかどうか、という話だわ。"],["ずんだもん","そうなのだ。設備投資の意思決定、その中でも取替投資なのだ。"],["めたん","文章の空欄に、アからチまでの金額と、aからdまでの言葉を入れるのね。"],["ずんだもん","金額は全部で17個あるのだ。でも、前の答えを使って次を出す形なので、下書きが一番大事なのだ。"],["めたん","1個つまずくと、後ろが全部ずれるってことね。"],["ずんだもん","その通りなのだ。だから、差額のP/Lとタイムテーブルを、最初にきちんと描くのだ。"],["めたん","下書きは差額P/Lとタイムテーブル、その2つで進めるのね。"],["ずんだもん","そうなのだ。最後に、再投資の仮定と回収期間法の話も出てくるのだ。順に見ていくのだ。"]],[["ずんだもん","最初の空欄はaなのだ。意思決定には、a的意思決定と設備投資の意思決定がある、とあるのだ。"],["めたん","設備投資のほうは、何年も先までお金が動く、大きな話よね。"],["ずんだもん","そうなのだ。何百億もかけて新しいエリアを作る、というような、トップが決める話なのだ。"],["めたん","じゃあ、もう一方は現場の細かい話ね。"],["ずんだもん","その通りなのだ。お土産をTシャツにするか風船にするか、というような、日々の業務の話なのだ。"],["ずんだもん","aは「業務」なのだ。模範解答では、業務執行的と書いても正解なのだ。"],["めたん","業務的意思決定では、差額原価と差額収益で比べるのよね。"],["ずんだもん","そうなのだ。でも設備投資は何年にもわたるので、お金の時間価値を考えるのだ。"],["めたん","今年の100と来年の100は、値打ちが違うってことね。"],["ずんだもん","そうなのだ。だから利益ではなく、いつ入っていつ出るか分かるキャッシュで考えるのだ。"]],[["ずんだもん","この問題は取替投資なのだ。もう古い設備があって、それを新しい設備に取り替えるか悩んでいるのだ。"],["めたん","新しい設備を買う案と、古い設備を使い続ける案を、それぞれ計算して比べるのね。"],["ずんだもん","それだと遅いのだ。この手の問題は、両方の案を丁寧には聞いてこないのだ。"],["ずんだもん","新しい案と古い案の差を、一発で聞いてくるのだ。だから下書きも、最初から差で描くのだ。"],["めたん","問題文にも、旧設備を使い続ける場合と比べて異なってくるキャッシュ・フローを考える、とあるわ。"],["ずんだもん","それが差額キャッシュ・フローなのだ。取り替えたと仮定して、取り替えなければ起きなかったお金の出入りだけを拾うのだ。"],["めたん","取り替えたことにして、増えたお金と減ったお金を数えるのね。"],["ずんだもん","その通りなのだ。コツは、本当に取り替えたと思うことなのだ。"]],[["ずんだもん","では、取り替えたと思って、投資する時点で起きることを並べるのだ。ここでアとイが埋まるのだ。"],["めたん","まず新しい設備を買うから、20,000,000が出ていくわ。"],["ずんだもん","そうなのだ。お金が出ていくので、△を付けるのだ。アは△20,000,000なのだ。"],["めたん","新しい設備を買ったら、古い設備はもういらないわね。"],["ずんだもん","設備が2台あっても仕方ないのだ。新しいのを買った瞬間に、古いのを9,000,000で売るのだ。"],["めたん","売ったお金は入ってくるから、イは9,000,000ね。"],["ずんだもん","その通りなのだ。タイムテーブルでは、線の上がプラス、線の下がマイナスなのだ。"],["ずんだもん","投資する時点の線の下に新C、線の上に旧Sを置くのだ。Cは設備に払うお金、Sは売ったお金のことなのだ。"]],[["ずんだもん","次はウとエなのだ。問題文でも、忘れてはいけない、と念を押しているところなのだ。"],["めたん","旧設備の簿価と売却価格の差が売却損になる、とあるわ。"],["ずんだもん","まず簿価を出すのだ。旧設備は18,000,000で買って、6年で償却しているのだ。"],["めたん","1年で3,000,000ずつ償却して、2年使ったのね。"],["ずんだもん","そうなのだ。2年分の6,000,000が減って、簿価は12,000,000なのだ。"],["めたん","それを9,000,000で売るから、3,000,000の損になるわ。"],["ずんだもん","その通りなのだ。ウは3,000,000なのだ。"],["めたん","でも、売却損はお金じゃないわよね。キャッシュで考えるなら、関係ないんじゃない？"],["ずんだもん","いいところに気づいたのだ。売却損そのものは、お金が出ていくわけではないのだ。"],["ずんだもん","でも売却損も費用なので、利益が減って、払う税金が安くなるのだ。"],["めたん","税金が浮いた分は、お金が残るのね。"],["ずんだもん","そうなのだ。税金が浮くのもキャッシュのプラスなのだ。3,000,000に税率30%を掛けるのだ。"],["めたん","900,000ね。これがエになるわ。"],["ずんだもん","その通りなのだ。売却の代金ではなく、売却損に税率を掛けるのが大事なのだ。"],["めたん","売った9,000,000に30%を掛けたくなるけど、それは違うのね。"],["ずんだもん","税金を動かすのは損益だけなのだ。売った代金は税金に関係ないのだ。"]],[["ずんだもん","この900,000を、タイムテーブルのどこに置くかが問題なのだ。"],["めたん","税金を払うのは、普通は1年後よね。"],["ずんだもん","よく出るのは、期首に取り替えを悩んでいて、1年後の期末に税金が出る形なのだ。"],["ずんだもん","でも一番大事なのは、問題に指示があれば指示に従うことなのだ。"],["めたん","この問題は、税金の支払いは次年度はじめ、つまりその年度末と同じだと書いてあるわ。"],["ずんだもん","そうなのだ。旧設備を売ったのは2023年度末なので、税金の効果も同じ2023年度末に入れるのだ。"],["めたん","売った日と、税金が浮く日が同じなのね。"],["ずんだもん","その通りなのだ。だから旧TAXは、旧Sの真上に積むのだ。TAXは税金のことなのだ。"]],[["ずんだもん","これで、投資する時点の箱がそろったのだ。オを出すのだ。"],["めたん","出ていくのが新しい設備の20,000,000ね。"],["ずんだもん","入ってくるのは、旧設備の売却9,000,000と、売却損の節税900,000なのだ。"],["めたん","20,000,000から、9,000,000と900,000を引くのね。"],["ずんだもん","そうなのだ。出ていく方が多いので、差し引き10,100,000の支出なのだ。"],["ずんだもん","オは△10,100,000なのだ。"],["めたん","新しい設備は20,000,000でも、実際の負担は半分くらいになるのね。"],["ずんだもん","古い設備を売ったお金と、浮いた税金が助けてくれるのだ。"]],[["ずんだもん","次は、毎年のキャッシュ・フローなのだ。ここからカ、キ、ク、ケが埋まるのだ。"],["ずんだもん","下書きは、差額のP/LをT勘定で描くのだ。新しい設備と古い設備の差だけを書くのだ。"],["めたん","新と旧でT勘定を2つ切るんじゃなくて、いきなり差を1つ書くのね。"],["ずんだもん","そうなのだ。右がキャッシュ・インフロー、左がキャッシュ・アウトフローなのだ。"],["めたん","キャッシュ・インフローは、毎年8,000,000増えるわ。"],["ずんだもん","取替投資は、普通は売上が変わらないのだ。古いエアコンでも新しいエアコンでも、お客さんは増えないのだ。"],["めたん","でもこの問題は、品質の高い製品が作れて、高い値段で売れるのね。"],["ずんだもん","その通りなのだ。だから右に8,000,000が入るのだ。左の現金支出原価は2,000,000増えるのだ。"],["めたん","減価償却費は、どう入れるの？"],["ずんだもん","減価償却費も、新と旧の差で入れるのだ。"],["めたん","新しい設備は取得原価を4年で割るから、古い設備の3,000,000より大きくなるわね。"],["ずんだもん","新しい設備は5,000,000なので、差は2,000,000なのだ。取り替えると、減価償却費がその分だけ増えるのだ。"],["めたん","残りが営業利益ね。8,000,000から、2,000,000と2,000,000を引いて、4,000,000になるわ。"],["ずんだもん","その通りなのだ。"]],[["ずんだもん","この差額P/Lから、毎年増えるお金を出すのだ。リターンのR、と呼ぶのだ。"],["めたん","Rは、営業利益の4,000,000でいいんじゃないの？"],["ずんだもん","そこが間違えやすいところなのだ。減価償却費は費用だけど、お金は出ていかないのだ。"],["めたん","だから、減価償却費の分は会社に残るのね。"],["ずんだもん","そうなのだ。ただ税金があるので、営業利益の30%は税金で取られるのだ。"],["ずんだもん","営業利益の4,000,000のうち、左下の30%が、虫食いのように税金で取られるのだ。"],["めたん","取られるのは1,200,000ね。"],["ずんだもん","残った形は、減価償却費と、営業利益の70%を合わせた、いびつな面積なのだ。"],["めたん","2,000,000と、4,000,000の70%の2,800,000を足して、4,800,000ね。"],["ずんだもん","その通りなのだ。これが毎年のR、4,800,000なのだ。"]],[["ずんだもん","この問題は、Rを3つに分けて聞いているのだ。カ、キ、クなのだ。"],["めたん","カは、減価償却費の節税を一切考えない、税引後の差額キャッシュ・フローね。"],["ずんだもん","もし減価償却費が無かったら、いくら残るか、と考えるのだ。"],["めたん","入ってくる8,000,000から、出ていく2,000,000を引くと6,000,000ね。"],["ずんだもん","そうなのだ。減価償却費が無ければ、その6,000,000の30%を丸ごと取られるのだ。"],["めたん","70%が残るから、4,200,000になるわ。"],["ずんだもん","カは4,200,000なのだ。"],["ずんだもん","次のキは、新設備の減価償却費による節税なのだ。タックス・シールドと言うのだ。"],["めたん","タックス・シールドって、どういう意味？"],["ずんだもん","減価償却費が損金になって、税金という攻撃から会社を守ってくれる、盾のことなのだ。"],["めたん","減価償却費があるおかげで、その税率分だけ税金を取られずに済むのね。"],["ずんだもん","そうなのだ。新しい設備の減価償却費5,000,000に、30%を掛けるのだ。"],["めたん","1,500,000ね。これがキだわ。"],["ずんだもん","最後のクは、旧設備の減価償却費の節税なのだ。"],["めたん","旧設備は売ってしまうから、その盾がなくなるのね。"],["ずんだもん","その通りなのだ。使い続けていれば、毎年3,000,000の30%で、900,000の税金が浮いていたのだ。"],["ずんだもん","取り替えると、それがなくなるのだ。だから差額では△900,000なのだ。クは900,000なのだ。"],["めたん","問題文に、すでに△が付いているから、答えは900,000だけ書けばいいのね。"],["ずんだもん","そうなのだ。3つを合わせると、4,200,000に1,500,000を足して、900,000を引くのだ。"],["めたん","4,800,000になって、差額P/Lで出したRと同じね。"],["ずんだもん","その通りなのだ。ケは4,800,000なのだ。"],["めたん","キとクをまとめると、減価償却費の差2,000,000の30%で、600,000になるわ。"],["ずんだもん","そうなのだ。差額P/Lでは、その600,000が、減価償却費の欄の小さい丸なのだ。"]],[["ずんだもん","Rが出たので、タイムテーブルを描くのだ。取り替えたと仮定した、差額のタイムテーブルなのだ。"],["めたん","投資する時点には、線の下に新C、上に旧Sと旧TAXが乗っているわね。"],["ずんだもん","そして、1年目から4年目の末まで、新R−旧Rの4,800,000を毎年並べるのだ。"],["めたん","4年目の最後に、設備を売ったお金は入らないの？"],["ずんだもん","問題文に、耐用年数に達したときには売却価値はない、とあるのだ。"],["ずんだもん","新しい設備も、古い設備も、4年後には0なのだ。だから最後は何も足さないのだ。"],["めたん","古い設備も、あと4年使える分が残っていたのね。"],["ずんだもん","そうなのだ。6年のうち2年使ったので、残りはちょうど4年なのだ。年数はそろえてくれるのだ。"],["めたん","Totalの段は、最初が△10,100,000、あとは4,800,000が4つね。"]],[["ずんだもん","次はコの、正味現在価値なのだ。NPVとも言うのだ。"],["めたん","将来のお金を今の値打ちに直して、最初に出したお金を引いたものよね。"],["ずんだもん","そうなのだ。現在価値に直すために、問題文の現価係数を使うのだ。"],["めたん","資本コストが5%だから、1年後の4,800,000は1.05で割り引くのね。"],["ずんだもん","その通りなのだ。資本コストは、会社が最低限稼がないといけない儲けの割合なのだ。"],["めたん","1年後の分は0.952381、2年後は0.907029を掛けるのね。"],["ずんだもん","そうなのだ。4年分を、それぞれの現価係数で割り引いて足すのだ。"],["めたん","そこから、最初の10,100,000を引くのを忘れないようにするわ。"],["ずんだもん","引くのを忘れたら、ただの現在価値なのだ。正味にするために、投資額を引くのだ。"],["ずんだもん","コは6,920,560なのだ。プラスなので、取り替えたほうが得なのだ。"],["めたん","4年分で17,020,560になって、10,100,000を引いたのね。"]],[["ずんだもん","ここから後半なのだ。正味現在価値法には、再投資の仮定がある、という話なのだ。"],["めたん","再投資の仮定って、何のこと？"],["ずんだもん","1年目に入ってきた4,800,000を、そのまま持っておくのではなく、もう1回どこかに投資して運用する、と考えることなのだ。"],["めたん","入ってきたお金を、財布にしまっておくわけじゃないのね。"],["ずんだもん","そうなのだ。それが本当かどうかを、2つの場合で確かめる、という問題なのだ。"],["めたん","1つ目が金庫に入れておく場合、2つ目が資本コストで再投資する場合ね。"],["ずんだもん","その通りなのだ。どちらも、一度4年後にお金を集めてから、今の値打ちに戻すのだ。"]],[["ずんだもん","まず金庫に入れておく場合なのだ。サ、シ、スが埋まるのだ。"],["めたん","金庫に入れたら、お金は増えも減りもしないわね。"],["ずんだもん","そうなのだ。1年目から3年目の4,800,000は、そのまま4年後まで持っていくのだ。"],["めたん","4年後の分と合わせて、4,800,000が4つで、19,200,000になるわ。"],["ずんだもん","サは19,200,000なのだ。これを今の値打ちに戻すのだ。"],["めたん","4年後のお金だから、4年の現価係数0.822702を掛けるのね。"],["ずんだもん","そうなのだ。15,795,878になるのだ。シは15,795,878なのだ。"],["めたん","スは、そこから最初の10,100,000を引いて、5,695,878ね。"],["ずんだもん","その通りなのだ。"],["めたん","さっきのコより、1,200,000くらい小さいわ。"],["ずんだもん","金庫に入れている間、お金が稼いでいない分だけ、小さくなったのだ。"]],[["ずんだもん","では、なぜ差が出たのかなのだ。bの空欄なのだ。"],["ずんだもん","正味現在価値法は、入ってきたお金を資本コスト率で再投資する、と暗に仮定しているのだ。"],["めたん","bは資本コストね。加重平均資本コストとも書いてあったわ。"],["ずんだもん","そうなのだ。加重平均資本コストを、略して単に資本コストと言うのだ。"],["めたん","どうして、割り引くだけで再投資したことになるの？"],["ずんだもん","5%で1回ふくらませて未来に持っていき、5%で2回割り引くのは、5%で1回割り引くのと同じなのだ。"],["めたん","掛けてから割るのが面倒だから、いつもは一気に割り引いているだけなのね。"],["ずんだもん","その通りなのだ。それを、明示的にやるのがセとソとタなのだ。"],["ずんだもん","1年目の4,800,000は、あと3年運用するので、終価係数の1.157625を掛けるのだ。"],["めたん","終価係数って、何？"],["ずんだもん","終わりの価値と書いて終価なのだ。現在価値の逆で、最後の年に値打ちをそろえる係数なのだ。"],["めたん","2年目の分は1.1025、3年目の分は1.05を掛けるのね。4年目の分はそのままだわ。"],["ずんだもん","そうなのだ。4つを足した終価の合計が、20,688,600なのだ。セは20,688,600なのだ。"],["めたん","これにも0.822702を掛けて、今の値打ちに戻すのね。"],["ずんだもん","17,020,553になるのだ。ソは17,020,553なのだ。"],["めたん","10,100,000を引くと、6,920,553ね。これがタだわ。"],["ずんだもん","その通りなのだ。最初のコの6,920,560と、ほぼ同じになったのだ。"],["めたん","7だけずれているのは、どうして？"],["ずんだもん","現価係数が近似値だからなのだ。問題文にも、現価係数の誤差によるものと書いてあるのだ。"]],[["ずんだもん","次はcなのだ。正味現在価値法以外で、時間価値を考える方法の1つなのだ。"],["めたん","cの率で再投資すると仮定されている、とあるわ。"],["ずんだもん","ここは「内部利益」なのだ。内部利益率法なのだ。"],["めたん","内部利益率って、何？"],["ずんだもん","正味現在価値がちょうど0になる割引率のことなのだ。IRRとも言うのだ。"],["ずんだもん","内部利益率法は、入ってきたお金を、その内部利益率で再投資すると仮定しているのだ。"],["めたん","内部利益率が20%なら、20%でまた運用できると考えるのね。"],["ずんだもん","そうなのだ。でも20%も儲かる案件が、毎年続くとは考えにくいのだ。"],["めたん","5%くらいの儲け話なら、いくらでもありそうだわ。"],["ずんだもん","そうなのだ。だから資本コストで再投資する正味現在価値法のほうが、仮定が現実的なのだ。"]],[["ずんだもん","最後は、時間価値を考えない方法なのだ。dとチが埋まるのだ。"],["めたん","初期投資額を何年で回収できるかで評価する方法、とあるわ。"],["ずんだもん","名前の通り、回収期間法なのだ。dは「回収期間」なのだ。"],["めたん","チの計算は、ここだけ問題文で別の数字が出されているのね。"],["ずんだもん","そうなのだ。最初に出ていくお金が20,000,000、毎年入ってくるお金が5,000,000なのだ。"],["めたん","20,000,000を5,000,000で割って、4年で回収できるのね。"],["ずんだもん","その通りなのだ。チは4なのだ。"],["めたん","欠点は、時間価値を考えないことと、回収した後のキャッシュ・フローを見ないことね。"],["ずんだもん","そうなのだ。回収した後に何年続いても、答えは変わらないのだ。安全性は分かっても、儲かるかは分からないのだ。"],["めたん","でも、早く回収できるほうがリスクは少ないものね。"],["ずんだもん","そうなのだ。先のキャッシュほど不確実なので、安全性を見られて、計算も簡単なので、実務では好まれるのだ。"]],[["ずんだもん","最後に、模範解答で全部の欄を確かめるのだ。"],["めたん","アからオが、投資する時点の箱だったわね。新C、旧S、売却損、その節税、合計の順だわ。"],["ずんだもん","カからケが、差額P/LのRを3つに分けたものなのだ。"],["めたん","コが正味現在価値で、サからタが、金庫と再投資の比べね。"],["ずんだもん","チが回収期間なのだ。言葉は、業務、資本コスト、内部利益、回収期間なのだ。"],["めたん","言葉の4つは、1つ2点で配点が大きいのね。"],["ずんだもん","その通りなのだ。計算を落としても、言葉は必ず取りたいのだ。"]],[["ずんだもん","まとめなのだ。取替投資は、取り替えたと仮定した差額で、一発で描くのだ。"],["めたん","売却損には税率を掛けて、指示どおり2023年度末に旧TAXを入れたわね。"],["ずんだもん","Rは差額P/Lの、減価償却費と営業利益の70%を合わせた、いびつな面積なのだ。"],["めたん","カ、キ、クに分けても、合計は4,800,000で同じになるのね。"]],[["ずんだもん","正味現在価値法は、資本コストで再投資する仮定なのだ。金庫に入れると、正味現在価値は小さくなるのだ。"],["めたん","内部利益率法は内部利益率で再投資、回収期間法は時間価値を考えない、ね。"],["ずんだもん","これで165回の原価計算は全部なのだ。お疲れさまなのだ。"]]],"shorts":[{"hl":"売却損は/[損×税率]で","at":146.55,"blob":"128def4d9b2eeb2b8d5e9d3de9da89d9"},{"hl":"Rは/[営業利益]ではない","at":312.48,"blob":"5e99b6b4342c6ce6950c0a0d3e062c12"},{"hl":"古い機械の/[盾]も消える","at":351.65,"blob":"9f6e3f2060991210a2c279eda2dbcaea"},{"hl":"NPV法は/[資本コストで再投資]","at":544.43,"blob":"afcff4f2abd274ad80b727e2ed01872a"},{"hl":"回収期間法は/[回収後]を見ない","at":696.34,"blob":"25740c0868836cde7f1722f36cbb219b"}]},{"kind":"exam","no":"167回","sub":"過去問","ch":167,"probs":[],"hl":"[ポイント]から/[連結]まで","acct":"過去問","id":"x167-bo","title":"商業簿記","sn":"商簿","w":0.0,"wt":[],"video":{"blob":"aed95d115427dfa7b5481a408dba3dae","secs":990.78,"mb":12.1},"scenes":[[0,"商業簿記の全体像"],[43.52,"ポイント：問題文を読む"],[72.21,"ポイント：ケとギの箱で配分する"],[137.54,"売価還元法：問題文を読む"],[166.38,"売価還元法：原価率と売上原価"],[241.38,"貸倒引当金"],[268.54,"減価償却"],[312.72,"減損：認識と測定"],[396.22,"減損：3つの資産に配る"],[425.43,"ソフトウェア"],[469.82,"投資有価証券"],[515.41,"退職給付"],[569.31,"ストック・オプション"],[614.94,"法人税等と自己株式"],[653.82,"模範解答：損益計算書"],[682.06,"連結：タイムテーブル"],[719.11,"連結：取得関連費用とのれん"],[765.97,"連結：アップストリーム"],[827.92,"連結：非支配株主持分と利益剰余金"],[874.29,"連結：その他の包括利益"],[921.57,"模範解答：問2と問3"],[941.01,"まとめ：個別の損益計算書"],[967.11,"まとめ：連結"]],"script":[[["ずんだもん","今回は、167回の商業簿記を、最初から最後まで解くのだ。"],["めたん","何を答える問題か、先に教えて。"],["ずんだもん","問は3つなのだ。問1はP社の個別の損益計算書、問2は資産グループの使用価値、問3は連結の9つの科目なのだ。"],["めたん","個別と連結が1つの問題に入ってるのね。"],["ずんだもん","そうなのだ。前半で個別を作って、その数字を連結で使うのだ。"],["ずんだもん","解答上の注意は、千円未満は四捨五入、消費税は無視、税効果は考えない、の3つなのだ。"],["めたん","試算表は［資料1］ね。決算の前の残高が並んでるわ。"],["ずんだもん","決算整理前残高試算表、前T/Bなのだ。これを［資料2］の10項目で直していくのだ。"],["めたん","答案用紙の損益計算書は、半分くらい金額が印刷済みね。"],["ずんだもん","販売費・給料手当・受取配当金・支払利息は、前T/Bのまま動かないのだ。残りの欄を順に埋めるのだ。"]],[["ずんだもん","最初は1番、カスタマー・ロイヤルティ・プログラムなのだ。"],["めたん","名前が長いわね。何のこと？"],["ずんだもん","かっこいい名前だけど、ポイント制度のことなのだ。お客さんに喜びを与えるプログラムなのだ。"],["ずんだもん","ここで埋まるのは、売上高と支払手数料の欄なのだ。"],["めたん","売った値段の10%をポイントで付けて、1ポイント1円ね。"],["ずんだもん","そうなのだ。ただ、付けたポイントが全部使われるとは限らないのだ。"],["めたん","使われる割合は75%と見込んでるわ。"],["ずんだもん","決算日に、クレジットカードで21,500の販売があって、まだ記帳していないのだ。"],["めたん","カード会社に払う手数料も2%あるのね。"]],[["ずんだもん","ケとギの箱で描くのだ。ケは契約の権利、ギは契約の義務なのだ。"],["ずんだもん","この会社が負っている義務は、何個あると思うのだ？"],["めたん","商品を渡す義務と、あとでポイント分の商品をただで渡す義務の2つね。"],["ずんだもん","その通りなのだ。だからギの箱を、商品とポイントに点線で割るのだ。"],["めたん","受け取る21,500を、2つに分け直すのね。"],["ずんだもん","物差しは独立販売価格なのだ。それぞれを別々に売ったら付く値段なのだ。"],["めたん","商品は21,500そのままね。ポイントは？"],["ずんだもん","21,500の10%に、使われる割合の75%を掛けて、1,613なのだ。"],["めたん","使われないと見込んだ分は、値打ちに入れないのね。"],["ずんだもん","そうなのだ。受け取る21,500を、商品とポイントの独立販売価格の比で按分するのだ。"],["めたん","商品に20,000、ポイントに1,500になるわ。"],["ずんだもん","商品はもう渡したから、20,000は売上なのだ。ポイントはまだ使われていないから、1,500は契約負債なのだ。"],["めたん","契約負債は、お金だけ先にもらって、仕事がまだの分よね。"],["ずんだもん","その通りなのだ。ポイントが使われたら、そのとき売上に変わるのだ。"],["ずんだもん","借方はクレジット売掛金21,070と支払手数料430なのだ。手数料は21,500の2%なのだ。"],["めたん","売上高の欄は、前T/Bに20,000を足して560,000ね。"],["ずんだもん","そうなのだ。支払手数料は、前T/Bに430と、あとで出てくる自己株式の30を足して、5,060なのだ。"]],[["ずんだもん","次は2番、売価還元法なのだ。"],["ずんだもん","ここで埋まるのは、売上原価の欄なのだ。"],["めたん","売価還元法って、どんなときに使うの？"],["ずんだもん","スーパーやコンビニのように、商品が何千種類もある店なのだ。1つずつ先入先出法で数えるのは無理なのだ。"],["ずんだもん","だから、期末の値札の合計に原価率を掛けて、原価を推定するのだ。"],["めたん","かっこの中に、収益性の低下を反映した原価率を適用する、ってあるわ。"],["ずんだもん","そこがこの問題の分かれ道なのだ。"],["めたん","それと、棚卸減耗損は売上原価に含める、とも書いてあるわね。"],["ずんだもん","その2つを覚えておいて、図を描くのだ。"]],[["ずんだもん","講師の神下書きは、中が原価、外が売価なのだ。"],["ずんだもん","左に売価を積むのだ。期首の売価、仕入原価、原始値入額、値上げの額、値下げの額の順なのだ。"],["めたん","原始値入額って何？"],["ずんだもん","仕入れた物に、最初に乗せたもうけなのだ。付加利益のことなのだ。"],["めたん","値上げと値下げは、売る前に値札を付け替えたのね。"],["ずんだもん","そうなのだ。値上げは強気、値下げは弱気、という販売前の試行錯誤なのだ。"],["めたん","全部足し引きして、売価合計は600,000になるわ。"],["ずんだもん","まん中の原価の箱は、期首と仕入を足して、原価合計は450,000なのだ。"],["めたん","じゃあ450,000を600,000で割って、原価率は75%ね。"],["ずんだもん","今回はそれを使わないのだ。"],["ずんだもん","強気も弱気も全部織り込んだのが75%なのだ。値下げという弱気が無かったとしたら、何%になると思うのだ？"],["めたん","分母から値下げの分を外すのね。600,000に25,000を戻して、625,000で割るわ。"],["ずんだもん","そうなのだ。原価率は72%なのだ。"],["ずんだもん","この低い原価率は、収益性の低下を織り込んだ率と考えるのだ。実地の売価に掛けると、実地の低価が出るのだ。"],["めたん","実地の売価58,000に72%を掛けて、41,760ね。"],["ずんだもん","その通りなのだ。これが期末の商品なのだ。"],["めたん","帳簿の売価は出さなくていいの？"],["ずんだもん","減耗も評価損も、どちらも売上原価に含めるのだ。だから実地の低価だけで、売上原価が差額で出るのだ。"],["めたん","原価合計450,000から41,760を引いて、408,240ね。"],["ずんだもん","売上原価の欄は408,240なのだ。評価損も減耗も、この中に入っているのだ。"]],[["ずんだもん","次は3番、貸倒引当金なのだ。"],["ずんだもん","埋まるのは、貸倒引当金繰入額の欄なのだ。"],["めたん","売掛金に1%、クレジット売掛金に0.5%ね。"],["ずんだもん","クレジット売掛金は、さっきの21,070を足した後の残高に掛けるのだ。"],["めたん","前T/Bの64,930に足して、86,000になるわ。"],["ずんだもん","そうなのだ。2つを合わせて、設定額は1,230なのだ。"],["めたん","前T/Bの貸倒引当金500を引くのを、忘れないのね。"],["ずんだもん","差額補充法なのだ。貸倒引当金繰入額の欄は730なのだ。"]],[["ずんだもん","次は4番、減価償却なのだ。"],["ずんだもん","埋まるのは、減価償却費の欄なのだ。4つを足すのだ。"],["めたん","残存価額はゼロで、月割りね。"],["ずんだもん","建物Bは20年の定額法で12,500、建物Cは12年で15,000、備品は10年で900なのだ。"],["めたん","車両運搬具だけ、定率法ね。当期の7月に買ってるわ。"],["ずんだもん","税法上の定率法は、200%定率法なのだ。定額法の償却率の2倍なのだ。"],["めたん","5年だから、1÷5年を2倍して0.4ね。"],["ずんだもん","そうなのだ。12,000に0.4を掛けて、7月から3月までの9ヵ月分なのだ。"],["めたん","12ヵ月のうち9ヵ月で、3,600になるわ。"],["ずんだもん","保証率で切り替えるか、確かめるのだ。取得原価に0.108を掛けた1,296を、1年分の4,800は下回らないから、0.4のままなのだ。"],["ずんだもん","4つを足して、減価償却費の欄は32,000なのだ。"]],[["ずんだもん","4番の後半は、減損なのだ。ここで問2と、減損損失の欄が埋まるのだ。"],["めたん","土地A、建物C、備品の3つで、1つの資産グループね。"],["ずんだもん","それぞれ別々にお金を生むのではなく、一体で稼いでいるから、まとめて1つにするのだ。"],["ずんだもん","兆候は、問題文が認められたと言っているのだ。次はステップ2、認識なのだ。"],["めたん","帳簿価額は、3つを足して157,200ね。"],["ずんだもん","建物Cと備品は、さっきの当期の償却まで済ませた後の額なのだ。"],["ずんだもん","これと、割引前の将来キャッシュ・フローの総額を比べるのだ。割引前、というところに注意なのだ。"],["めたん","毎年15,000が8年分と、最後の処分を足して、150,000ね。"],["ずんだもん","150,000が157,200を下回るから、アウトなのだ。減損損失を認識するのだ。"],["ずんだもん","次はステップ3、測定なのだ。回収可能価額を出すのだ。"],["めたん","回収可能価額って何？"],["ずんだもん","この資産から取り戻せる額なのだ。売るか、使うか、儲かる方を選ぶのだ。"],["ずんだもん","売る方が正味売却価額なのだ。処分価額140,000から処分費用を引いて、133,620なのだ。"],["めたん","使う方が使用価値ね。こっちは割り引くのよね。"],["ずんだもん","そうなのだ。毎年同じ15,000は、8年の年金現価係数を掛けて、まとめて今の価値にするのだ。"],["ずんだもん","最後の処分の30,000は、8年の現価係数を掛けるのだ。足して94,019なのだ。"],["めたん","使用価値が問2の答えね。94,019になるわ。"],["ずんだもん","その通りなのだ。問2の欄は94,019なのだ。"],["めたん","売れば133,620、使えば94,019だから、売った方が儲かるわね。"],["ずんだもん","大きい方が回収可能価額なのだ。133,620なのだ。"],["めたん","帳簿価額157,200から引いて、減損損失は23,580ね。"]],[["ずんだもん","23,580を、3つの資産にどう配るかは、問題文の指示なのだ。"],["めたん","減損処理前の帳簿価額に基づいて、ってあるわ。"],["ずんだもん","だから157,200のうちの割合で按分するのだ。"],["めたん","土地は帳簿価額の割合を掛けて4,500、建物Cは18,000ね。"],["ずんだもん","備品は1,080なのだ。3つ足すと、ちゃんと23,580に戻るのだ。"],["ずんだもん","損益計算書の減損損失の欄は23,580なのだ。特別損失なのだ。"],["めたん","土地が4,500減るのは、あとの連結でも使いそうね。"],["ずんだもん","よく気づいたのだ。P社の土地は495,500になるのだ。"]],[["ずんだもん","次は5番、ソフトウェアなのだ。"],["ずんだもん","埋まるのは、ソフトウェア償却費と一般管理費の欄なのだ。"],["めたん","前からある分は、当期首の1年半前の10月に買って、5年で償却してるのね。"],["ずんだもん","前T/Bの21,000は、もう償却した後の、まだ残っている額なのだ。"],["めたん","当期首から見ると、残りは何ヵ月なの？"],["ずんだもん","5年の60ヵ月から、もう過ぎた18ヵ月を引いて、42ヵ月なのだ。"],["ずんだもん","21,000を残りの42ヵ月で割って、当期の12ヵ月分で6,000なのだ。"],["めたん","もう1つ、一般管理費に4,800のソフトウェアが混ざってるわ。"],["ずんだもん","それは費用ではなく、資産なのだ。10月から使っているから、3年のうち6ヵ月分を償却するのだ。"],["めたん","4,800の36分の6で、800ね。"],["ずんだもん","ソフトウェア償却費の欄は、6,000と800で6,800なのだ。"],["めたん","一般管理費は、前T/Bから4,800を抜いて18,000ね。"],["ずんだもん","一般管理費の欄は18,000なのだ。"]],[["ずんだもん","次は6番、その他有価証券なのだ。"],["ずんだもん","埋まるのは、投資有価証券売却益の欄なのだ。それと、連結のその他の包括利益で、もう一度使うのだ。"],["めたん","1株22で1,000株買って、当期に300株を24で売ったのね。"],["ずんだもん","売った代金7,200が、仮受金のままなのだ。"],["めたん","売った分の帳簿価額は、前期末の時価の20で見るの？"],["ずんだもん","取得原価の22で見るのだ。その他有価証券は、翌期首に必ず洗替をするのだ。"],["ずんだもん","洗替をすると、帳簿は取得原価に戻っているのだ。だから売却原価は300株×22で6,600なのだ。"],["めたん","7,200から6,600を引いて、売却益は600ね。"],["ずんだもん","投資有価証券売却益の欄は600なのだ。特別利益なのだ。"],["めたん","残りの700株は、期末の時価25で評価するのね。"],["ずんだもん","取得原価22との差の3円に700株で、2,100なのだ。これはP/Lではなく、純資産のその他有価証券評価差額金なのだ。"]],[["ずんだもん","次は7番、退職給付なのだ。"],["ずんだもん","埋まるのは、退職給付費用の欄なのだ。"],["めたん","20人が全員、4年前の期首に入って、10年後に辞めるのね。"],["ずんだもん","辞めるときに払う退職金の見込みが100,000なのだ。期間定額基準だから、10年で単に割るのだ。"],["めたん","1年働くごとに、10,000ずつ退職金が積み上がるイメージね。"],["ずんだもん","その通りなのだ。時間の線を引いて、入社、当期首、当期末、退職を並べるのだ。"],["めたん","当期首までに4年働いたから、発生した分は40,000ね。"],["ずんだもん","それを退職の日から今に割り戻すのだ。当期首から退職までは6年だから、6年の現価係数を掛けるのだ。"],["めたん","期首の債務は35,519になるわ。前T/Bの引当金と同じね。"],["ずんだもん","よく確かめたのだ。当期末は5年分の50,000を、残り5年の係数で割り戻すのだ。"],["めたん","期末の債務は45,287ね。"],["ずんだもん","債務が増えた理由は2つなのだ。1年働いた分の勤務費用と、1年近づいた分の利息費用なのだ。"],["めたん","当期は支払いが無いから、期末から期首を引いた差が、その2つの合計になるのね。"],["ずんだもん","そうなのだ。退職給付費用の欄は9,768なのだ。"]],[["ずんだもん","次は8番、ストック・オプションなのだ。"],["ずんだもん","埋まるのは、株式報酬費用の欄なのだ。"],["めたん","ストック・オプションって何？"],["ずんだもん","決まった値段で自社の株を買える権利を、従業員に渡す仕組みなのだ。働いてもらう代わりの報酬なのだ。"],["ずんだもん","出たら、まず付与日と権利確定日をチェックするのだ。"],["めたん","付与日は前期の7月1日、権利確定日はその3年後の6月30日ね。36ヵ月あるわ。"],["ずんだもん","費用は、単価×個数×期間なのだ。"],["めたん","20人に100個ずつで、単価5.4ね。"],["ずんだもん","全部で10,800なのだ。これを36ヵ月にわたって、じわじわ費用にするのだ。"],["めたん","当期は12ヵ月分だから、10,800の36分の12ね。"],["ずんだもん","いきなり当期の12ヵ月分を出そうとしないのだ。"],["ずんだもん","当期末までの21ヵ月分の長い矢印を出して、前期までの短い矢印を引くのだ。"],["めたん","21ヵ月分は6,300で、前T/Bの新株予約権2,700を引くのね。"],["ずんだもん","株式報酬費用の欄は3,600なのだ。"]],[["ずんだもん","9番と10番は短いのだ。"],["めたん","法人税等は8,000で、中間納付の6,000は仮払法人税等に入ってるわ。"],["ずんだもん","差の2,000が未払法人税等なのだ。法人税、住民税及び事業税の欄は8,000なのだ。"],["ずんだもん","10番は自己株式の処分なのだ。"],["めたん","帳簿価額1,200の自己株式を1,600で売って、差は400ね。"],["ずんだもん","でも前T/Bの処分差益は370なのだ。"],["めたん","手数料の30を、処分差益から引いちゃってるのね。"],["ずんだもん","そうなのだ。自己株式の処分は、株主との資本取引なのだ。でも手数料は証券会社に払う、損益取引なのだ。"],["ずんだもん","だから、その他資本剰余金と相殺しないで、30は支払手数料にするのだ。"],["めたん","その他資本剰余金は400になるのね。"],["ずんだもん","その通りなのだ。さっきの支払手数料の5,060に、この30が入っているのだ。"]],[["ずんだもん","これで問1の損益計算書がそろったのだ。"],["めたん","営業利益は26,802、経常利益は28,802ね。"],["ずんだもん","そこに売却益600を足して、減損損失23,580を引くのだ。"],["めたん","税引前は5,822、法人税等8,000を引くと、当期純損失になるわ。"],["ずんだもん","当期純利益の欄は、△を付けて2,178なのだ。"],["めたん","マイナスのときは△を付けなさい、って注意書きがあったわね。"],["ずんだもん","繰越利益剰余金は、265,000から2,178を引いた262,822なのだ。これを連結で使うのだ。"]],[["ずんだもん","ここから問3、連結なのだ。子会社はS社だけなのだ。"],["めたん","前々期の末に、S社の株の80%を50,000で買ったのね。"],["ずんだもん","講師の神下書き、タイムテーブルを描くのだ。子会社の純資産の動きを横に並べるのだ。"],["ずんだもん","左が支配を取った前々期末、右が当期末なのだ。"],["めたん","まずは、支配を取った日の資本金・資本準備金・利益剰余金を書くのね。"],["ずんだもん","土地も時価に直すのだ。時価が帳簿より3,000高いから、評価差額は3,000なのだ。"],["めたん","合計53,000の80%で、P社持分は42,400ね。"],["ずんだもん","非支配株主持分は、残りの20%で10,600なのだ。"],["めたん","取得原価は、P社の帳簿に52,000ってあるわ。"],["ずんだもん","そこが引っかけなのだ。52,000には、買うときの手数料の2,000が入っているのだ。"]],[["めたん","個別では、株を買った手数料は取得原価に含めるのよね。"],["ずんだもん","そうなのだ。でも連結では、株を買うことはグループの中の資本取引と考えるのだ。"],["ずんだもん","手数料は証券会社という外の人に払ったから、損益取引なのだ。だから連結では費用にするのだ。"],["めたん","タイムテーブルの取得原価は、本体の50,000だけにするのね。"],["ずんだもん","その通りなのだ。50,000から42,400を引いて、のれんは7,600なのだ。"],["めたん","のれんは、翌年度から10年で償却ね。"],["ずんだもん","前期と当期の2年分で、1,520を償却するのだ。"],["めたん","のれんの欄は6,080になるわ。"],["ずんだもん","土地は、P社の495,500とS社の25,000に、評価差額の3,000を足すのだ。"],["めたん","土地の欄は523,500ね。減損の後のP社の額を使うのが大事ね。"],["ずんだもん","資本剰余金は、S社の分は投資と資本の相殺で消えるから、P社の分だけなのだ。"],["めたん","P社の資本準備金100,000と、その他資本剰余金400で、100,400ね。"],["ずんだもん","資本剰余金の欄は100,400なのだ。"]],[["ずんだもん","次は資料3の2番、S社からP社への売上なのだ。"],["めたん","子会社から親会社に売ってるから、アップストリームね。"],["ずんだもん","そうなのだ。下から上に売るから、アップなのだ。"],["ずんだもん","まず、85,000の売上と仕入を消すのだ。グループの中で場所を変えただけで、外には売っていないのだ。"],["めたん","売上高の欄は、P社560,000とS社180,000を足して、85,000を引いた655,000ね。"],["ずんだもん","その通りなのだ。次に、P社の期末の商品に残っている3,000の利益の分を消すのだ。"],["めたん","利益率は書いてないわ。"],["ずんだもん","S社の個別財務諸表から出すのだ。売上から売上原価を引いて、利益は54,000なのだ。"],["めたん","54,000を180,000で割って、30%ね。"],["ずんだもん","3,000の30%で、未実現利益は900なのだ。"],["ずんだもん","アップだと、誰の利益を消していると思うのだ？"],["めたん","売ったのはS社だから、S社の利益ね。"],["ずんだもん","そうなのだ。だから900はタイムテーブルに入れて、80%と20%に分けるのだ。"],["めたん","矢印の上がマイナス720、下がマイナス180になるわ。"],["ずんだもん","棚卸資産の欄は、P社41,760とS社28,000を足して、900を引いた68,860なのだ。"],["めたん","売上原価は、2社を足して85,000を引いて、900を足すのね。"],["ずんだもん","売上原価の欄は450,140なのだ。"]],[["ずんだもん","タイムテーブルの右側を完成させるのだ。"],["めたん","S社の利益剰余金は、10,000から12,400に増えたわ。"],["ずんだもん","増えた2,400が、支配を取った後の業績なのだ。矢印の上が80%の1,920、下が20%の480なのだ。"],["ずんだもん","当期末の合計は、資本の合計に評価差額を足して、未実現の900を引くのだ。"],["めたん","54,500になって、その20%が非支配株主持分ね。"],["ずんだもん","非支配株主持分の欄は10,900なのだ。電卓だけで出るのだ。"],["めたん","利益剰余金は、どこを取り込むの？"],["ずんだもん","P社の262,822に、矢印の上だけを足すのだ。矢印の上だけが、親の業績なのだ。"],["めたん","1,920を足して、未実現の720を引くのね。"],["ずんだもん","それと、のれんの償却1,520なのだ。もう1つ、忘れがちなものがあるのだ。"],["めたん","取得関連費用の2,000ね。連結では費用になったから。"],["ずんだもん","その通りなのだ。利益剰余金の欄は260,502なのだ。"]],[["ずんだもん","最後の欄は、その他の包括利益なのだ。"],["めたん","S社には評価差額金が無いから、P社のその他有価証券だけね。"],["ずんだもん","そうなのだ。講師は、その他有価証券評価差額金を、その評と縮めて呼ぶのだ。首、発生、組替、末の4列で考えるのだ。"],["めたん","首は前期末ね。時価20が取得原価22より低いから、1,000株でマイナス2,000になるわ。"],["ずんだもん","末は、残った700株の2,100なのだ。"],["ずんだもん","当期発生は、当期に時価が動いた分なのだ。売った300株は20から24、残りの700株は20から25なのだ。"],["めたん","売った分と残りの分を足して、発生は4,700ね。"],["ずんだもん","組替は、売った分の評価差額を、売却益に振り替えるのだ。売却益の600なのだ。"],["めたん","売却益の分は、もう当期純利益に入ってるから、二重に数えないように引くのね。"],["ずんだもん","その通りなのだ。首から発生を足して組替を引くと、ちゃんと末の2,100になるのだ。"],["ずんだもん","その他の包括利益の欄は、4,700から600を引いた4,100なのだ。"]],[["ずんだもん","問2は使用価値の94,019なのだ。"],["めたん","回収可能価額の133,620と間違えないようにするのね。"],["ずんだもん","問3は9つの欄なのだ。"],["めたん","棚卸資産・売上高・売上原価が、アップストリームの所ね。"],["ずんだもん","のれん・非支配株主持分・利益剰余金・その他の包括利益が、タイムテーブルから出る所なのだ。"],["めたん","配点が2点なのは、のれん・非支配株主持分・その他の包括利益ね。"]],[["ずんだもん","最後に、引っかけをまとめておくのだ。"],["ずんだもん","ポイントは、使われる見込みの75%まで掛けて、独立販売価格の比で分けるのだ。"],["めたん","売価還元は、値下げを分母から外した72%を、実地の売価に掛けるのね。"],["ずんだもん","減損は、割引前で認識して、売ると使うの大きい方が回収可能価額なのだ。"],["めたん","問2で聞かれたのは、回収可能価額じゃなくて使用価値ね。"],["ずんだもん","その他有価証券の売却原価は、洗替で取得原価に戻してから出すのだ。"],["めたん","自己株式の手数料は、処分差益から引かずに支払手数料にするのね。"]],[["ずんだもん","取得関連費用は、連結では取得原価から抜いて費用にするのだ。"],["めたん","利益剰余金からも2,000を引くのを忘れないのね。"],["ずんだもん","土地は、減損した後のP社の額に、S社と評価差額を足すのだ。"],["めたん","アップの未実現は、タイムテーブルで80対20に分けるわ。"],["ずんだもん","非支配株主持分は、期末の合計×20%で一発なのだ。"],["めたん","その他の包括利益は、発生から組替を引くのね。"],["ずんだもん","その通りなのだ。個別の数字が、そのまま連結に流れ込む問題だったのだ。"]]],"shorts":[{"hl":"収益性の低下は/[値下げを外す]","at":166.38,"blob":"7be210d516aceb1d466638a050f2f0a0"},{"hl":"問2は回収可能価額でなく/[使用価値]","at":312.72,"blob":"1f5f7d1bf55006fa1b219ba167afa6a4"},{"hl":"売却原価は/[取得原価]で","at":469.82,"blob":"c2f10a1be14235e72ae23b8dccfac24e"},{"hl":"取得関連費用は/連結で[費用]","at":719.11,"blob":"fff13a12eaca48607768d4d69f12392c"},{"hl":"アップの未実現は/[80%と20%]に","at":765.97,"blob":"0e78cf78312057998e91a45b405805f1"}]},{"kind":"exam","no":"167回","sub":"過去問","ch":167,"probs":[],"hl":"[分配可能額]から/[事業分離]まで","acct":"過去問","id":"x167-ka","title":"会計学","sn":"会計","w":0.0,"wt":[],"video":{"blob":"929b3525d81177ef76a42d1a6e929495","secs":885.26,"mb":10.7},"scenes":[[0,"会計学の全体像"],[28.05,"第1問⑴：割引手形と保証債務"],[75.19,"第1問⑵⑶：後発事象と契約資産"],[116.8,"第1問⑷⑸：セール・アンド・リースバックと総平均法"],[171.02,"第2問：資料と答える物"],[197.16,"問1：のれん等調整額"],[238.65,"問2：分配可能額"],[313.93,"問3：1株当たり当期純利益"],[362.98,"問4：潜在株式調整後1株当たり当期純利益"],[439.1,"第3問：資料と答える物"],[470.72,"2つの軸で考える"],[521.61,"A事業：日本商工社と甲社"],[582.04,"B事業：個別の処理"],[622.09,"B事業：神下書きの2つの箱"],[681.08,"等価交換とのれん"],[730.73,"資本剰余金と非支配株主持分"],[794.74,"連結の仕訳で確かめる"],[817.04,"模範解答"],[834.08,"まとめ：第1問・第2問"],[860.58,"まとめ：第3問"]],"script":[[["ずんだもん","今回は、167回の会計学を、最初から最後まで解くのだ。"],["めたん","会計学は3問あるわね。"],["ずんだもん","第1問は、文章の空欄に語句を入れる問題なのだ。アからオまで5つあるのだ。"],["ずんだもん","第2問は、分配可能額と1株当たり当期純利益の計算なのだ。"],["ずんだもん","第3問は、事業分離なのだ。1つの会社が、2つの事業を別々の会社に移す問題なのだ。"],["めたん","配点は第1問が5点、第2問が8点、第3問が12点になっているわ。"],["ずんだもん","第2問と第3問は、下書きを描けばほとんど迷わないのだ。では第1問から見ていくのだ。"]],[["ずんだもん","⑴で埋まるのは、アなのだ。"],["めたん","割引手形と裏書譲渡手形の二次的責任である遡求義務を、アという金融負債として時価で評価する、とあるわ。"],["ずんだもん","手形は、満期までじっと持っておく以外に、裏書と割引という2つの使い道があるのだ。"],["めたん","裏書は人に渡して支払いに使うこと、割引は銀行に持って行って先にお金にすることよね。"],["ずんだもん","その通りなのだ。でも、手形を振り出した人が満期に払えなかったら、どうなると思うのだ？"],["めたん","手形を受け取った人が怒って、渡した私のところに来そうね。"],["ずんだもん","そうなのだ。お前が代わりに払え、と言われるのだ。これが二次的責任、遡求義務なのだ。"],["ずんだもん","手形を手放したあとも、この代わりに払う義務だけは残っているのだ。"],["めたん","その残った義務を、負債として載せるわけね。"],["ずんだもん","その通りなのだ。人の借金を代わりに払う義務なので、保証債務と呼ぶのだ。アは「保証債務」なのだ。"],["ずんだもん","割引で入ったお金から、保証債務の時価を引いた分が、手形を売った金額になるのだ。"],["めたん","その金額と帳簿価額の差が、手形売却損益になるのね。"]],[["ずんだもん","⑵のイは、決算日の後に起きて、会社の財政状態や経営成績に影響する出来事の名前なのだ。"],["めたん","決算日より後に発生した事象だから、後発事象ね。"],["ずんだもん","その通りなのだ。イは「後発事象」なのだ。"],["ずんだもん","⑶のウは、収益認識の言葉なのだ。"],["めたん","顧客に渡した物と引き換えにもらえる権利のうち、債権を除いたものね。"],["ずんだもん","債権というのは、売掛金や受取手形のことなのだ。時間が経てば、催促しなくても勝手に入ってくる権利なのだ。"],["めたん","売掛金の一歩手前、まだ確定していない権利があるってこと？"],["ずんだもん","そうなのだ。たとえば2つの製品を売る約束で、まだ片方しか渡していないときなのだ。"],["ずんだもん","もう片方を渡すまでは、代金をもらう権利が確定しないのだ。この確定前の権利を、契約資産と呼ぶのだ。"],["めたん","全部渡して確定したら、売掛金にランクアップするのね。"],["ずんだもん","その通りなのだ。ウは「契約資産」なのだ。"]],[["ずんだもん","⑷のエは、セール・アンド・リースバックなのだ。"],["めたん","セール・アンド・リースバックって、どういう取引なの？"],["ずんだもん","自分の建物などを売って、すぐにリースで借り戻す取引なのだ。手元のお金を作りたい会社が使うのだ。"],["めたん","売っても、次の日からその建物を使い続けるのね。"],["ずんだもん","そうなのだ。だから売った時の利益は、固定資産売却益にはしないのだ。長期前受収益という負債にして、繰り延べるのだ。"],["めたん","何も変わっていないのに、利益だけ出るのはおかしいものね。"],["ずんだもん","その通りなのだ。売った値段で借り戻すので、リース資産の価値が上がって、その分だけ償却費が大きくなりすぎるのだ。"],["ずんだもん","だから繰り延べた利益を、減価償却費の割合で取り崩して、減価償却費から引くのだ。"],["めたん","エには、両方とも「減価償却費」が入るのね。"],["ずんだもん","そうなのだ。⑸のオは、払出単価の決め方なのだ。"],["めたん","期首の分と期間中の仕入を全部足して、数量の合計で割るとあるわ。"],["ずんだもん","商品の箱の左側、借方の合計を、全部の数量でまとめて1回だけ割るのだ。"],["めたん","仕入のたびに割り直すのは、移動平均法のほうだったわね。"],["ずんだもん","その通りなのだ。期間でまとめて割るので、オは「総平均」なのだ。これで第1問は全部埋まったのだ。"]],[["ずんだもん","次は第2問なのだ。北海商工の、当期末の純資産の資料なのだ。"],["めたん","求めるのは、のれん等調整額、分配可能額、1株当たり当期純利益、潜在株式調整後1株当たり当期純利益の4つね。"],["ずんだもん","前の2つは会社法の配当の話、後ろの2つは株主の取り分の話なのだ。"],["めたん","資料1が純資産の内訳、資料2が株式数と転換社債型新株予約権付社債になっているわ。"],["ずんだもん","それと、問題文の最初の文に、のれん3,000,000と繰延資産61,000が書いてあるのだ。ここを見落とさないのだ。"]],[["ずんだもん","まず、分配可能額は何のための数字か、から考えるのだ。"],["めたん","配当していい上限よね。"],["ずんだもん","そうなのだ。配当で会社のお金が出ていきすぎないように、分配可能額は、なるべく減らす方向で決めてあるのだ。"],["めたん","計算式も、剰余金からマイナスばかりしているものね。"],["ずんだもん","その通りなのだ。そのマイナスの1つが、のれん等調整額なのだ。"],["めたん","のれん等調整額って、何なの？"],["ずんだもん","資産の中にあるけど、売ってもお金にならない、資産の価値が怪しい物のことなのだ。"],["ずんだもん","のれんは、価値があるかどうか予想も入るので、半分だけ価値がないとみなすのだ。"],["ずんだもん","繰延資産は、買ってくれる人がいないので、全部価値がないのだ。"],["めたん","だから、のれんは2で割って、繰延資産はそのまま足すのね。"],["ずんだもん","その通りなのだ。のれん3,000,000の半分の1,500,000に、繰延資産61,000を足すのだ。"],["めたん","1,561,000になるわ。問1の答えね。"]],[["ずんだもん","ここから下書きを描くのだ。大きな箱を横に広げるのだ。"],["ずんだもん","箱の上の段には、分配できない元本や積み立てた物を書くのだ。資本金、資本準備金、利益準備金なのだ。"],["めたん","合わせて1,520,000ね。これが資本等金額ね。"],["ずんだもん","そうなのだ。上の段と下の段の境に、点線を横に引いておくのだ。"],["ずんだもん","下の段は、分配できる剰余金なのだ。その他資本剰余金、任意積立金、繰越利益剰余金なのだ。"],["めたん","足して393,500ね。ここがステップ1の剰余金の額ね。"],["ずんだもん","その通りなのだ。ステップ2で、自己株式の110,250を引くのだ。自己株式を買ったときに、もう株主にお金を返しているからなのだ。"],["ずんだもん","最後がステップ3なのだ。右の列に、天井から、のれん÷2と繰延資産の箱を垂れ下がらせるのだ。"],["めたん","のれん÷2の1,500,000は、資本等金額の点線の手前で止まるわ。"],["ずんだもん","でも繰延資産の61,000を足すと、1,561,000で点線を越えるのだ。"],["めたん","越えたのは、1,561,000−1,520,000で、41,000ね。"],["ずんだもん","分配できない元本の範囲に、価値のない物が収まらず、分配できる側に侵入してきたのだ。"],["ずんだもん","侵入してきた41,000だけ、分配可能額を減らすのだ。"],["めたん","393,500から110,250と41,000を引いて、242,250になるわ。"],["ずんだもん","その通りなのだ。問2の答えは242,250なのだ。"],["めたん","のれん÷2だけで、もっと下まで来ていたら、どうなるの？"],["ずんだもん","その他資本剰余金の下まで来たら、もっと危ない別の計算になるのだ。今回はのれん÷2が1,500,000で、そこまでは届いていないのだ。"]],[["ずんだもん","次は1株当たり当期純利益なのだ。EPSとも言うのだ。"],["めたん","当期純利益を、株の数で割った1株の取り分ね。"],["ずんだもん","そうなのだ。誕生日のケーキを、兄弟の数で割るのと同じなのだ。"],["めたん","割る株の数は、期末の840,000株でいいの？"],["ずんだもん","そこが引っかけなのだ。当期純利益は1年間で稼いだ流れの数字、フローなのだ。"],["ずんだもん","だから割る株の数も、1年間をならした期中平均株式数にするのだ。期中に増えた株を、平らにならすイメージなのだ。"],["めたん","株が増えた日付が書いていないから、期首と期末の株数を足して2で割るのね。"],["ずんだもん","そうなのだ。発行済株式の平均は820,000株なのだ。"],["ずんだもん","その通りなのだ。それと、自己株式は世の中に出回っていない株なので、引くのだ。"],["めたん","自己株式も期首5,100株と期末4,900株の平均で、5,000株を引くのね。"],["ずんだもん","そうなのだ。分母は815,000株なのだ。"],["めたん","当期純利益の146,700を815,000株で割って、180円ね。"],["ずんだもん","その通りなのだ。問3は180円なのだ。"]],[["ずんだもん","最後は、潜在株式調整後の1株当たり当期純利益なのだ。"],["めたん","潜在株式って何？"],["ずんだもん","今はまだ株ではないけど、将来株になるかもしれない物なのだ。今回は転換社債型新株予約権付社債なのだ。"],["ずんだもん","社債だけど、株に換えてくれと言われたら株を渡す約束が付いているのだ。お母さんのおなかにいる赤ちゃんのような物なのだ。"],["めたん","まだ生まれてないけど、生まれたら株主が増えるのね。"],["ずんだもん","そうなのだ。下書きでは、さっきの帯の下に青い線を引くのだ。この線が水面なのだ。"],["ずんだもん","水面の上が、もう生まれた株なのだ。水面の下に、点線で赤ちゃんの帯を描くのだ。"],["めたん","全部株に換えたら、50,000株増えるとあるわ。"],["ずんだもん","この社債は期首に発行したので、赤ちゃんは1年分そのまま足すのだ。分母は815,000株＋50,000株で865,000株なのだ。"],["めたん","分子の当期純利益は、146,700のままでいいの？"],["ずんだもん","期首から株主だったら、社債利息は払わなかったはずなのだ。代わりに配当を払うのだ。"],["ずんだもん","配当は損益計算書を通らないので、社債利息の分だけ当期純利益が増えるのだ。"],["めたん","社債利息は資料では500,000円で書いてあるわ。ほかの金額にそろえると、500ね。"],["ずんだもん","そうなのだ。でも社債利息がなくなると、その分の税金が増えるのだ。"],["めたん","実効税率30%の分が増えるから、増える利益は、500に70%を掛けた350ね。"],["ずんだもん","その通りなのだ。146,700に350を足して、865,000株で割るのだ。"],["めたん","170円になるわ。"],["ずんだもん","180円から170円に、1株の取り分が減ったのだ。これを希薄化と言うのだ。問4は170円なのだ。"]],[["ずんだもん","いよいよ第3問の事業分離なのだ。"],["めたん","事業分離って、何をすることなの？"],["ずんだもん","会社が持っている事業を、ほかの会社に移すことなのだ。移した会社を分離元、受け取った会社を分離先と言うのだ。"],["めたん","日本商工社が、A事業を甲社へ、B事業を乙社へ移しているわ。"],["ずんだもん","どちらも、対価は現金ではなく、相手の会社の新しい株なのだ。"],["めたん","A事業でもらった甲社株は2%で、子会社でも関連会社でもないのね。その他有価証券にしているわ。"],["ずんだもん","B事業でもらった乙社株は、乙社の60%なのだ。乙社は子会社になるのだ。"],["ずんだもん","答えるのは、問1が個別の6つ、問2が連結の3つなのだ。"]],[["ずんだもん","事業分離は、2つの軸だけで考えるのだ。"],["ずんだもん","1つ目は、事業を渡す側が、移転損益を出すかなのだ。投資の清算か、投資の継続かで決めるのだ。"],["めたん","投資の清算って、どういうこと？"],["ずんだもん","事業を売り払って、もう口出ししない状態なのだ。現金をもらったときがそうなのだ。"],["ずんだもん","株をもらっても、ほんの少しなら、現金をもらったのと同じなのだ。"],["めたん","逆に、相手の子会社や関連会社になるくらい株をもらったら、口出しする気満々ね。"],["ずんだもん","その通りなのだ。それが投資の継続で、移転損益は出さないのだ。"],["ずんだもん","2つ目の軸は、受け取る側が取得したと言えるかなのだ。"],["めたん","受け取ったんだから、取得じゃないの？"],["ずんだもん","見た目は受け取った会社の物なのだ。でも渡した側が過半数の株を持って子会社にしたら、事業の影の支配者は渡した側なのだ。"],["ずんだもん","形式と実質が逆なので、これを逆取得と言うのだ。逆取得なら、受け取った資産は簿価のまま、のれんも出ないのだ。"],["めたん","境目は、継続かどうかが関連会社になる20%、逆取得かどうかが子会社になる50%超で、違うのね。"],["ずんだもん","そうなのだ。ここがごっちゃになりやすいのだ。"]],[["ずんだもん","A事業から見るのだ。下書きは、A事業の貸借対照表の箱なのだ。"],["めたん","資産の簿価から負債を引くと、純資産の簿価は8,000ね。"],["ずんだもん","資産の時価は11,000なので、簿価との差の評価差額が1,000なのだ。"],["めたん","対価は、甲社株20,000株で、1株550円だから11,000ね。"],["ずんだもん","その11,000が、A事業の事業の時価なのだ。"],["ずんだもん","時価の純資産より多い分は、のれんなのだ。ここでは2,000なのだ。"],["ずんだもん","日本商工社は、甲社株を2%しかもらっていないのだ。だから投資の清算なのだ。"],["めたん","清算なら、もらった甲社株は時価の11,000で載せるのね。"],["ずんだもん","その通りなのだ。⑴のその他有価証券は11,000なのだ。"],["めたん","渡したA事業は簿価の8,000だから、もらった株との差が利益ね。"],["ずんだもん","そうなのだ。⑵の事業移転損益は、利益の3,000なのだ。"],["ずんだもん","甲社のほうは、日本商工社の子会社にならないので、普通の取得なのだ。"],["めたん","取得なら、もらった資産と負債は時価ね。"],["ずんだもん","そうなのだ。時価の資産から負債を引いて、時価の純資産は9,000なのだ。"],["ずんだもん","それに11,000の株を払ったので、多めに払った2,000が、⑶ののれんなのだ。"],["めたん","増えた資本は株の時価の11,000で、半分の5,500が資本剰余金ね。"],["ずんだもん","元の60,000に足して、⑷の甲社の資本剰余金は65,500なのだ。"]],[["ずんだもん","次はB事業なのだ。まず個別の処理なのだ。"],["めたん","乙社株をもらって、乙社が子会社になるから、投資の継続ね。"],["ずんだもん","その通りなのだ。移転損益は出さないのだ。"],["めたん","じゃあ乙社株は、株の時価で載せるの？"],["ずんだもん","そこが引っかけなのだ。損益を出さないので、渡したB事業の簿価で載せるのだ。"],["ずんだもん","B事業の資産500,000から負債150,000を引いた、株主資本相当額なのだ。"],["めたん","350,000になるわね。⑸の乙社株式は350,000ね。"],["ずんだもん","乙社のほうは、日本商工社の子会社になるので、逆取得なのだ。"],["めたん","逆取得なら、もらった資産と負債は簿価のまま、増える資本も簿価の350,000ね。"],["ずんだもん","そうなのだ。その半分の175,000が資本剰余金なのだ。"],["めたん","元の20,000に足して、⑹の乙社の資本剰余金は195,000ね。"],["ずんだもん","その通りなのだ。これで問1の6つが全部埋まったのだ。"]],[["ずんだもん","ここから問2の連結なのだ。下書きは、さっきの箱を横に2つ並べるのだ。"],["ずんだもん","左が、渡したB事業の箱なのだ。右が、受け取った先の乙社の箱なのだ。"],["めたん","まず、乙社の株をどれだけの割合もらったのか、確かめたいわ。"],["ずんだもん","新しく発行した656,250株を、元の437,500株と足した全部の株で割るのだ。"],["めたん","ちょうど60%になるわ。問題文の60%と合っているわね。"],["ずんだもん","左のB事業の箱は、さっきの個別と同じで、純資産の簿価が350,000なのだ。"],["ずんだもん","資産の時価と簿価の差の、評価差額も書いておくのだ。"],["めたん","B事業の時価は、もらった乙社株の値打ちで考えるのね。"],["ずんだもん","そうなのだ。656,250株に640円を掛けて、420,000なのだ。"],["めたん","純資産の時価360,000との差の60,000が、B事業ののれんになるわ。"],["ずんだもん","右の乙社の箱も同じ形なのだ。資料2の乙社の資本を全部足して、純資産の簿価は230,000なのだ。"],["めたん","乙社の資産は、時価が簿価より30,000高いわね。"],["ずんだもん","それが乙社の評価差額なのだ。これを足した時価の純資産は260,000なのだ。"],["めたん","乙社の時価は、元の437,500株に640円を掛けて、280,000ね。"],["ずんだもん","その通りなのだ。時価の純資産との差の20,000が、乙社ののれんなのだ。"]],[["ずんだもん","この事業分離で起きたことは、2つなのだ。"],["ずんだもん","B事業は、100%持っていたうち40%が人の物になったのだ。右の乙社は、60%を新しくもらったのだ。"],["めたん","自分の体を40%差し出して、代わりに相手の体を60%もらったのね。"],["ずんだもん","そうなのだ。差し出したのは、B事業の420,000の40%なのだ。"],["めたん","168,000ね。"],["ずんだもん","もらったのは、乙社の280,000の60%なのだ。"],["めたん","こっちも168,000になるわ。ぴったり同じね。"],["ずんだもん","これが等価交換なのだ。偶然ではなく、必ず一致するように作られているのだ。一致しなければ、自分の数字を疑うのだ。"],["ずんだもん","乙社の60%を、168,000で買ったと考えるのだ。"],["めたん","乙社の時価の純資産は260,000だから、60%で156,000ね。"],["ずんだもん","その156,000の物に168,000を払ったのだ。多めに払った分がのれんなのだ。"],["めたん","差は12,000ね。乙社ののれん20,000の60%と考えても、同じになるわ。"],["ずんだもん","その通りなのだ。問2の⑴、のれんは12,000なのだ。"]],[["ずんだもん","次は左のB事業なのだ。40%を手放した分の、簿価はいくらなのだ？"],["めたん","純資産の簿価350,000の40%で、140,000ね。"],["ずんだもん","その140,000の物を、168,000の値打ちで相手に渡したのだ。"],["めたん","差の28,000は、売却益っぽいわね。"],["ずんだもん","性質は売却益なのだ。でも子会社の株の持ち分が変わるだけの取引なので、資本取引なのだ。だから損益にせず、資本剰余金にするのだ。"],["めたん","下書きだと、B事業の評価差額とのれんの段の40%が、ちょうど28,000ね。"],["ずんだもん","その通りなのだ。連結の資本剰余金は、日本商工社の300,000に28,000を足して、328,000なのだ。"],["めたん","乙社の資本剰余金195,000は、連結では足さないのね。"],["ずんだもん","子会社の資本は、投資と資本の相殺で消えるのだ。資本金と利益剰余金も親会社のまま動かないのだ。"],["ずんだもん","最後は非支配株主持分なのだ。他人の持ち分の40%なのだ。"],["めたん","どちらの箱も40%を掛けるのね。"],["ずんだもん","そうなのだ。でも、自分の体は簿価、相手の体は時価なのだ。"],["めたん","B事業は自分の事業だから、簿価の350,000に40%で140,000ね。"],["ずんだもん","乙社は新しく取った子会社なので、時価の純資産260,000に40%で104,000なのだ。"],["めたん","合わせて244,000になるわ。"],["ずんだもん","その通りなのだ。問2の⑶、非支配株主持分は244,000なのだ。"]],[["ずんだもん","解説では、連結の仕訳を3本に分けて書いているのだ。"],["めたん","乙社の資産の時価評価、投資と資本の相殺、分離した事業の一部売却ね。"],["ずんだもん","投資と資本の相殺は、乙社の60%を168,000で買った普通の連結の仕訳なのだ。ここでのれん12,000が出ているのだ。"],["めたん","3本目は、B事業の40%を手放した仕訳ね。資本剰余金28,000が出ているわ。"],["ずんだもん","仕訳を切らなくても、2つの箱で同じ数字が全部取れるのだ。"]],[["ずんだもん","模範解答で、全部の欄を確かめるのだ。"],["めたん","第1問の5つの語句は、どれも基準の言葉そのままね。"],["ずんだもん","第2問は、垂れ下がりの箱と、水面の面積図から出した4つなのだ。"],["めたん","第3問の問1は、清算のA事業が時価、継続のB事業が簿価になっているわ。"],["ずんだもん","問2の3つは、神下書きの2つの箱から全部取れたのだ。"]],[["ずんだもん","まとめなのだ。第1問は5つの語句だったのだ。"],["めたん","手形を手放しても残る遡求義務は保証債務、確定前の権利は契約資産だったわね。"],["ずんだもん","リースバックの売却益は繰り延べて、減価償却費で取り崩すのだ。"],["めたん","第2問ののれん等調整額は、のれんの半分と繰延資産を、天井から垂れ下がらせるのね。"],["ずんだもん","資本等金額の線を越えた分だけ、分配可能額から引くのだ。"],["めたん","1株当たり当期純利益は、期中平均で、自己株式を引くのね。"],["ずんだもん","潜在株式は水面の下の赤ちゃんで、分子には社債利息の税引後を足すのだ。"]],[["ずんだもん","第3問は、2つの軸だったのだ。"],["めたん","渡す側は、清算なら時価で損益を出して、継続なら簿価で損益なしね。"],["ずんだもん","受け取る側は、取得なら時価でのれん、逆取得なら簿価なのだ。"],["めたん","連結は箱を2つ並べて、40%と60%が等価交換になるのね。"],["ずんだもん","自分の体は簿価、相手の体は時価で、40%が非支配株主持分なのだ。"],["めたん","手放した分の差は、売却益ではなく資本剰余金ね。"],["ずんだもん","これで167回の会計学は全部なのだ。お疲れさまなのだ。"]]],"shorts":[{"hl":"越えた分だけ/[配当を減らす]","at":238.65,"blob":"54b3b1ea19f4e6a0f796e75238853f31"},{"hl":"EPSは/[期中平均]で割る","at":313.93,"blob":"ff22ad71ad12ab5a95fedce8bf15bcae"},{"hl":"分子に/[社債利息の税引後]","at":362.98,"blob":"c29d5ed2137776a9214741c728c56a32"},{"hl":"口出ししないなら/[移転損益を出す]","at":470.72,"blob":"c8731d5382fa94c235195ca569064381"},{"hl":"40%と60%は/[等価交換]","at":681.08,"blob":"6e004dc28f291bfe64eb820cd3b414d7"}]},{"kind":"exam","no":"167回","sub":"過去問","ch":167,"probs":[],"hl":"[費目別・部門別]から/[工程別組別]まで","acct":"過去問","id":"x167-ko","title":"工業簿記","sn":"工簿","w":0.0,"wt":[],"video":{"blob":"1ab20aea6884247c9c77680499bc4893","secs":975.09,"mb":11.9},"scenes":[[0,"工業簿記の全体像"],[48.76,"計算条件の整理"],[107.3,"問1：総平均法の消費単価"],[160.68,"問1：出庫票を組ごとに足す"],[206.11,"問2：作業日報と手待時間"],[273.43,"問3：逆からたどる"],[329.14,"問3：部門共通費の配賦"],[386.65,"問3：補助部門費の配賦"],[489.12,"問3：補助材料費の推定"],[535.53,"問4：工程間仕掛品を見つける"],[596.58,"問4：組ごとの労務費と製造間接費"],[638.29,"問4：倉庫に残った20個"],[696.96,"問5：統制勘定としての材料勘定"],[770.39,"問5：材料勘定の別解"],[817.66,"問5：第2工程の完成品"],[862.41,"問5：仕掛品勘定"],[910.31,"模範解答"],[941.38,"まとめ"]],"script":[[["ずんだもん","今回は、167回の工業簿記を、最初から最後まで解くのだ。"],["めたん","問題は1問だけね。工程別組別総合原価計算って書いてあるわ。"],["ずんだもん","名前は長いけど、聞かれているのは材料、労務費、製造間接費、そして仕掛品の順なのだ。"],["めたん","問1から問5まで、5つの問いが並んでいるのね。"],["ずんだもん","この下書きは、講義で何度も出てきた勘定連絡図なのだ。"],["ずんだもん","左が費目別計算で、材料、労務費、経費の3つの箱なのだ。"],["ずんだもん","真ん中が部門別計算で、製造間接費をまとめる所なのだ。"],["ずんだもん","右が製品別計算で、仕掛品はベルトコンベアなのだ。"],["めたん","問1と問2は左の箱、問3は真ん中、問4と問5は右の箱の話になるわけね。"],["ずんだもん","そうなのだ。この地図を頭に置いて、左から順に解いていくのだ。"],["めたん","青い矢印と赤い矢印があるわね。"],["ずんだもん","青は、どの製品の分か分かる物を、そのまま仕掛品へ入れる賦課なのだ。"],["ずんだもん","赤は、工場全体でしか分からない物を、製造間接費にまとめてから配る配賦なのだ。"]],[["ずんだもん","まず計算条件を読むのだ。ここを整理すると、全部の問いの道具がそろうのだ。"],["めたん","組が4つあって、F01組からF04組まで並んでいるわ。"],["ずんだもん","組別というのは、違う種類の製品を、それぞれ別のベルトコンベアで作る形なのだ。"],["めたん","食パンとカレーパンを、別々のラインで作るようなものね。"],["ずんだもん","その通りなのだ。そして工程が2つあるのだ。"],["ずんだもん","品番の1けた目が工程なのだ。F011は第1工程の完了品、F012は第2工程の完了品なのだ。"],["めたん","末尾が1なら第1工程、2なら第2工程を終えた物ってことね。"],["ずんだもん","次は賃率と配賦率なのだ。第1製造部門の消費賃率は2,000、第2製造部門は2,500なのだ。"],["めたん","製造間接費の配賦率は、第1製造部門が15,000、第2製造部門が10,000ね。"],["ずんだもん","どちらも、直接作業時間1時間あたりの金額なのだ。"],["ずんだもん","第1工程は第1製造部門、第2工程は第2製造部門で作業するのだ。"],["めたん","工程と部門がそのまま対応しているから、迷わずに済むわ。"],["ずんだもん","材料は総平均法、補助部門は他の補助部門へのサービスも無視しない方法なのだ。"],["ずんだもん","最後に、月初仕掛品はF031が20個で、原価は270,000なのだ。これは問5で使うのだ。"]],[["ずんだもん","問1は、F02組への材料の出庫額なのだ。"],["めたん","材料は4種類あって、M01からM04まで並んでいるわね。"],["ずんだもん","払出単価は総平均法なのだ。"],["めたん","総平均法って、どういう平均なの？"],["ずんだもん","月初の在庫と、1か月で受け入れた分を、全部まとめて1つの単価にする方法なのだ。"],["ずんだもん","月の途中で受け入れるたびに計算し直す移動平均法とは違って、月末に1回だけ割るのだ。"],["めたん","じゃあ、月初の金額と受け入れた金額を足して、個数の合計で割ればいいのね。"],["ずんだもん","その通りなのだ。M02で見るのだ。月初は20個で単価が658なのだ。"],["めたん","受け入れたのは140個で、単価が610ね。"],["ずんだもん","月初の金額13,160と、受け入れた金額85,400を足すのだ。"],["めたん","それを個数の合計160個で割ると、616になるわ。"],["ずんだもん","その通りなのだ。M02の消費単価は616なのだ。"],["めたん","ほかの材料も同じやり方で出すのね。"],["ずんだもん","そうなのだ。M01が940、M03が400、M04が1,200なのだ。"],["めたん","M03は月初も受け入れも400だから、計算するまでもないわね。"]],[["ずんだもん","次は出庫票なのだ。どの材料を、どの品番にいくつ出したかが、日付順に並んでいるのだ。"],["めたん","1回の出庫は、どれも20個ずつね。"],["ずんだもん","よく見ると、M02はいつもF021に出ているのだ。"],["めたん","材料と組が1対1なのね。M01はF011、M03はF031、M04はF041だわ。"],["ずんだもん","そうなのだ。だから材料費は、組ごとに最初から分かるのだ。"],["ずんだもん","組ごとに分かる直接材料費は、配る必要が無いので、そのまま賦課するのだ。"],["めたん","M02が出てくる所を数えればいいのね。"],["ずんだもん","M02の出庫は7回なので、20個×7回で140個なのだ。"],["めたん","140個に単価の616を掛けて、86,240ね。"],["ずんだもん","その通りなのだ。問1の答えは86,240なのだ。"],["めたん","4つの組を全部足すと、直接材料費の合計になるのよね。"],["ずんだもん","そうなのだ。合計は292,240で、これは問5の仕掛品勘定でも使うのだ。"]],[["ずんだもん","問2は、間接作業賃金と手待賃金の総額なのだ。"],["めたん","作業日報要約表には、直接と間接の時間が並んでいるわ。"],["ずんだもん","注に、直接は直接工の直接作業時間、間接は直接工の間接作業時間と手待時間とあるのだ。"],["めたん","手待時間って何？"],["ずんだもん","工場には来ていて、ベルトコンベアの横にもいるのに、材料が流れてこなくて待っていた時間なのだ。"],["めたん","待っているだけでも、時給は出るのね。"],["ずんだもん","そうなのだ。手待ちまでは時給が出るのだ。不在や休憩は出ないのだ。"],["ずんだもん","パンをこねていた時間だけが直接労務費で、運んでいた時間や待っていた時間は間接労務費なのだ。"],["めたん","どの製品のためか分からないから、製造間接費の方に入るわけね。"],["ずんだもん","その通りなのだ。では時間を数えるのだ。日報には20日の記録があるのだ。"],["めたん","第1工程の間接は毎日4時間だから、20日で80時間ね。"],["ずんだもん","第1製造部門の賃率2,000を掛けると、160,000なのだ。"],["めたん","第2工程の間接は毎日2時間で、20日で40時間になるわ。"],["ずんだもん","こちらは賃率2,500を掛けて、100,000なのだ。"],["めたん","足して260,000ね。"],["ずんだもん","その通りなのだ。問2の答えは260,000なのだ。"],["ずんだもん","ついでに直接の方も出しておくのだ。第1工程は240時間、第2工程は280時間なのだ。"],["めたん","賃率を掛けて足すと、直接労務費は1,180,000になるわね。"],["ずんだもん","そうなのだ。この240時間と280時間は、問3でも主役になるのだ。"]],[["ずんだもん","問3は、第1製造部門と第2製造部門の補助材料費なのだ。"],["めたん","問題文には、逆算により推定しなさい、とあるわ。"],["ずんだもん","製造間接費の表を見ると、補助材料費の欄だけが各自推定になっているのだ。"],["めたん","分からない物を、どこから出すの？"],["ずんだもん","計算条件の2に、部門別の実際配賦率が書いてあったのだ。"],["ずんだもん","実際配賦率は、その部門に集まった製造間接費を、実際の直接作業時間で割った数字なのだ。"],["めたん","じゃあ逆に、配賦率に時間を掛ければ、部門に集まった金額に戻るのね。"],["ずんだもん","その通りなのだ。それが第2次集計額なのだ。"],["めたん","第2次集計って何？"],["ずんだもん","補助部門の費用まで配り終えた後の、製造部門の合計なのだ。最初に部門ごとに集めた額が、第1次集計額なのだ。"],["めたん","第1製造部門は、240時間に15,000を掛けて3,600,000ね。"],["ずんだもん","第2製造部門は、280時間に10,000を掛けて2,800,000なのだ。"],["ずんだもん","ここから、補助部門から来た分を引くと第1次集計額、さらに分かっている費目を引くと補助材料費なのだ。"],["めたん","表の下から上へ、順に引いていくわけね。"],["ずんだもん","そうなのだ。まず第1次集計額を作るところから始めるのだ。"]],[["ずんだもん","製造間接費の表に、共通費という列があるのだ。"],["めたん","福利施設負担額、建物減価償却費、建物保険料の3つね。"],["ずんだもん","部門共通費は、どの部門のための費用か、すぐには分からない費用なのだ。"],["ずんだもん","なにかしらの基準で、4つの部門に配る必要があるのだ。簡単で合理的な数字を使えばいいのだ。"],["めたん","問題には、適切な基準を選べとしか書いていないわ。"],["ずんだもん","基準の資料は、従業員数と面積の2つなのだ。"],["めたん","福利施設は人のための物だから、従業員数で配るのね。"],["ずんだもん","その通りなのだ。2人、2人、1人、1人で、合計6人なのだ。"],["ずんだもん","300,000を6人で割ると1人50,000なので、100,000、100,000、50,000、50,000なのだ。"],["めたん","建物の減価償却費と保険料は、建物を使う広さで配るのが自然ね。"],["ずんだもん","そうなのだ。面積の合計は1,000平方メートルなのだ。"],["めたん","減価償却費の1,000,000なら、500平方メートルの第1製造部門に500,000になるわ。"],["ずんだもん","保険料も同じ比率で、第1製造部門が75,000、第2製造部門が45,000なのだ。"],["めたん","これで補助部門は、全部の費目がそろうのね。"],["ずんだもん","縦に足すと、動力部門は2,022,500、工場事務部門は1,117,500なのだ。"]],[["ずんだもん","次は、補助部門の費用を、製造部門に配るのだ。"],["めたん","補助部門は、動力部門と工場事務部門ね。"],["ずんだもん","製造部門が表の2人なら、補助部門は裏方なのだ。自分では製品に携わらない、縁の下の力持ちなのだ。"],["めたん","指示は、他の補助部門へのサービス提供を無視しない方法ね。"],["ずんだもん","相互配賦法なのだ。裏方どうしのやりとりも考える方法なのだ。"],["めたん","でも、サービスの提供割合の表を見ると、動力部は工場事務部にサービスしていないわ。"],["ずんだもん","そこがこの問題のありがたい所なのだ。"],["ずんだもん","工場事務部門から動力部門への一方通行なので、工場事務部門から先に配れば、1回で済むのだ。"],["めたん","講義の階梯式の表と同じで、先に配る方を一番右に書くのね。"],["ずんだもん","そうなのだ。工場事務部門の1,117,500を、40%、40%、20%で配るのだ。"],["めたん","第1製造部門と第2製造部門に447,000ずつ、動力部門に223,500ね。"],["ずんだもん","動力部門は、もとの2,022,500に、受け取った223,500を足してから配るのだ。"],["めたん","合わせて2,246,000になるわ。"],["ずんだもん","それを60%と40%で、第1製造部門に1,347,600、第2製造部門に898,400なのだ。"],["めたん","第1製造部門が受け取った補助部門費は、447,000と1,347,600を足して、1,794,600ね。"],["ずんだもん","第2製造部門は、447,000と898,400を足して、1,345,400なのだ。"],["めたん","でも第1次集計の欄が、まだはてなのままよ。"],["ずんだもん","そこで、さっきの第2次集計額を一番下に置くのだ。"],["ずんだもん","3,600,000から1,794,600を引いて、第1製造部門の第1次集計額は1,805,400なのだ。"],["めたん","第2製造部門は、2,800,000から1,345,400を引いて、1,454,600ね。"],["ずんだもん","4つの部門の第1次集計額を足すと、6,400,000になるのだ。"],["めたん","第2次集計の3,600,000と2,800,000を足しても、6,400,000ね。"],["ずんだもん","裏から表へしわ寄せしているだけなので、合計は変わらないのだ。合わなければ、どこかで計算を間違えているのだ。"]],[["ずんだもん","いよいよ補助材料費なのだ。"],["めたん","第1次集計額から、補助材料費以外の費目を全部引けばいいのよね。"],["ずんだもん","その通りなのだ。ここで、問2の間接作業賃金と手待賃金が要るのだ。"],["めたん","表の中にも各自計算ってあったわね。第1製造部門に160,000、第2製造部門に100,000が入るわ。"],["ずんだもん","問2を落とすと、問3も一緒に落ちる作りなのだ。"],["めたん","第1製造部門で、補助材料費以外を足すといくらになるの？"],["ずんだもん","部門共通費の配賦額まで入れて、1,710,200なのだ。"],["めたん","1,805,400から1,710,200を引いて、95,200ね。"],["ずんだもん","第2製造部門は、1,454,600から1,356,600を引いて、98,000なのだ。"],["ずんだもん","問3の答えは、第1製造部門が95,200、第2製造部門が98,000なのだ。"],["めたん","下書きの表を下から埋めていくなんて、ふだんと逆の順番ね。"],["ずんだもん","ふだんは上から足して配賦率を出すのだ。この問題は、配賦率の方が先に分かっているのだ。"]],[["ずんだもん","問4は、F02組の月末仕掛品原価なのだ。"],["めたん","計算条件の1に、工程内の仕掛品は無くて、工程間の仕掛品がある、とあったわね。"],["ずんだもん","工程の途中で作りかけの物は無いのだ。第1工程を終えた物が、第2工程に入る前に置いてあるだけなのだ。"],["めたん","それが工程間仕掛品なのね。"],["ずんだもん","そうなのだ。工程完了品は品番が打たれて、在庫管理の対象になる、と書いてあったのだ。"],["ずんだもん","講義でいう工程完了入庫品なのだ。第1工程と第2工程の間に、倉庫があるイメージなのだ。"],["めたん","じゃあ、第1工程で作った数と、第2工程に入れた数の差が、倉庫に残るのね。"],["ずんだもん","その通りなのだ。製造実績の表から、組ごとに数えるのだ。"],["めたん","F021は第1工程の製造が7回で、140個ね。"],["ずんだもん","F022は第2工程の製造が6回なので、120個なのだ。"],["めたん","差の20個が、倉庫に残ったF021ってわけね。"],["ずんだもん","そうなのだ。表の一番下にも、月末仕掛品F021が20個と書いてあるのだ。"],["めたん","F03組は、第1工程が100個なのに、第2工程は120個よ。多すぎない？"],["ずんだもん","月初の倉庫に、F031が20個あったのだ。それを足して120個なのだ。"],["めたん","月初の20個と当月の100個を、全部第2工程に入れたから、残りはゼロね。"]],[["ずんだもん","次は、F021の原価を出すのだ。材料費はもう問1で出しているのだ。"],["めたん","F021の材料費は86,240だったわね。"],["ずんだもん","残りは、直接労務費と製造間接費なのだ。どちらも直接作業時間に掛けるのだ。"],["めたん","F021の作業は、日報に7日分あるわ。"],["ずんだもん","1日12時間なので、7日で84時間なのだ。"],["めたん","直接労務費は、84時間に賃率の2,000を掛けて168,000ね。"],["ずんだもん","製造間接費は、84時間に第1製造部門の配賦率15,000を掛けて、1,260,000なのだ。"],["めたん","製造間接費の方が、労務費よりずっと大きいのね。"],["ずんだもん","配賦率が15,000もあるので、1日分の時間を数え間違えるだけで180,000ずれるのだ。日報は丁寧に数えるのだ。"],["めたん","ほかの組も、時間さえ数えれば同じように出るわね。"],["ずんだもん","そうなのだ。表のとおり、第2工程も同じ形で出るのだ。"]],[["ずんだもん","F021の原価を足すのだ。"],["めたん","86,240と168,000と1,260,000を足して、1,514,240ね。"],["ずんだもん","これを140個で割ると、1個10,816なのだ。"],["ずんだもん","講師の下書きの形で、第一工程、倉庫、第二工程の箱を3つ並べるのだ。"],["めたん","第一工程の完了品140個が、そのまま倉庫の当月入庫になるのね。"],["ずんだもん","そうなのだ。倉庫から第二工程に出したのは120個、残ったのは20個なのだ。"],["めたん","月初の在庫が無いから、どちらも単価は10,816のままね。"],["ずんだもん","その通りなのだ。20個に10,816を掛けて、216,320なのだ。"],["ずんだもん","問4の答えは216,320なのだ。"],["めたん","出した120個の分は、第二工程の前工程費になるのね。"],["ずんだもん","前工程費は、前の工程から引き継いだ原価のことなのだ。第二工程から見ると、始点で入れた材料と同じ扱いなのだ。"],["ずんだもん","120個に10,816を掛けた1,297,920が、雪だるまのように転がって第二工程に入るのだ。"],["めたん","第一工程の完了品の原価と、第二工程の前工程費が、倉庫があるとずれるのね。"],["ずんだもん","そうなのだ。その差が、倉庫に残った216,320なのだ。"]],[["ずんだもん","問5は、統制勘定としての材料勘定と、仕掛品勘定なのだ。"],["めたん","統制勘定って何？"],["ずんだもん","材料1つ1つの細かい記録は材料元帳に付けて、その合計だけを載せる勘定なのだ。材料元帳と材料勘定はリンクしているのだ。"],["めたん","じゃあ、材料元帳があるM01からM04だけを載せればいいのね。"],["ずんだもん","そこがいちばん迷う所なのだ。模範解答は、材料費に分類される費目を全部、材料勘定に入れているのだ。"],["ずんだもん","補助材料費、燃料費、工場消耗品費、消耗工具器具備品費なのだ。"],["めたん","燃料費も材料なの？"],["ずんだもん","燃料費は、ベルトコンベアを動かす石炭や重油なのだ。補助材料費と同じ扱いで、材料費に入るのだ。"],["めたん","事務用消耗品費まで入っているわ。"],["ずんだもん","事務用でも、製造間接費として集計されているので、工場消耗品費と同じ物と考えているのだ。"],["めたん","当月受入は、M01からM04の293,600に、その5つを足すのね。"],["ずんだもん","そうなのだ。合わせて2,383,600なのだ。"],["ずんだもん","右側の消費は、最初の勘定連絡図の青と赤なのだ。青の直接材料費292,240は仕掛品へ行くのだ。"],["ずんだもん","赤の間接材料費2,090,000は、製造間接費へ行くのだ。"],["めたん","足して、当月消費は2,382,240ね。"],["ずんだもん","月初有高は63,760、月末有高は65,120なのだ。"],["めたん","月末は、総平均法の単価に、残った個数を掛けて出すのね。"],["ずんだもん","その通りなのだ。貸借の合計は、どちらも2,447,360なのだ。"]],[["ずんだもん","この材料勘定には、別の考え方もあるのだ。"],["めたん","さっき言った、M01からM04だけを載せる形ね。"],["ずんだもん","直接材料費のみを統制する材料勘定】そうなのだ。確実に材料元帳があるのは、その4つだけなのだ。"],["めたん","それなら、受入293,600、消費292,240になるわ。"],["ずんだもん","】もう1つは、出入記録をしない物を外す形なのだ。"],["めたん","出入記録って何？"],["ずんだもん","いくつ入って、いくつ使ったかを帳簿に付けることなのだ。"],["ずんだもん","工場消耗品費と消耗工具器具備品費は、重要性が低いので出入記録をせず、買った額を使った額とみなすのだ。"],["めたん","スパナを10本買って8本しか使っていなくても、10本の値段を全部費用にしちゃうのね。"],["ずんだもん","そうなのだ。そこまで数えるのはバカバカしいからなのだ。"],["ずんだもん","模範解答は全部入れる形で、別解も2つ示されているのだ。本番では問題の指示から、どこまで入れるかを決めるのだ。"],["めたん","月初有高と月末有高は、どの形でも同じなのね。"],["ずんだもん","そうなのだ。変わるのは受入と消費だけなのだ。"]],[["ずんだもん","次は仕掛品勘定なのだ。その前に、製品になった金額を出すのだ。"],["めたん","製品は、第2工程を終えたF012からF042のことね。"],["ずんだもん","そうなのだ。第2工程の原価は、前工程費と、第2工程の労務費と製造間接費なのだ。"],["めたん","F022なら、前工程費が倉庫から出した1,297,920ね。"],["ずんだもん","第2工程で84時間かかったので、労務費は2,500を掛けて210,000、製造間接費は10,000を掛けて840,000なのだ。"],["めたん","足して2,347,920になるわ。"],["ずんだもん","気をつけるのはF032なのだ。"],["めたん","F03組は、月初に倉庫にあった20個も、第2工程に入れたのよね。"],["ずんだもん","その通りなのだ。前工程費は、当月のF031の1,060,000に、月初の270,000を足すのだ。"],["めたん","1,330,000ね。月初の分を忘れると、ここが足りなくなるわ。"],["ずんだもん","4つの組の完成品を足すと、7,925,920なのだ。"]],[["ずんだもん","仕掛品勘定を埋めるのだ。"],["ずんだもん","仕掛品勘定はベルトコンベアなのだ。左から入ってきて、右に出していくのだ。"],["めたん","左は、月初仕掛品と当月製造費用ね。"],["ずんだもん","月初仕掛品は、F031の270,000なのだ。"],["めたん","当月製造費用は、直接材料費、直接労務費、製造間接費の3つを足すのね。"],["ずんだもん","直接材料費は問1で出した292,240なのだ。"],["ずんだもん","直接労務費は問2で出した1,180,000なのだ。"],["ずんだもん","製造間接費は、問3の第2次集計の合計6,400,000なのだ。"],["めたん","足して、7,872,240ね。"],["ずんだもん","右は、製品の7,925,920と、問4の月末仕掛品216,320なのだ。"],["めたん","左も右も、合計は8,142,240になるわ。"],["ずんだもん","その通りなのだ。工程間の受け渡しは、仕掛品勘定の中で行ったり来たりするだけなので、勘定には出てこないのだ。"],["めたん","1つの仕掛品勘定に、第1工程も第2工程も入っているってことね。"]],[["ずんだもん","最後に、模範解答で全部の欄を確かめるのだ。"],["めたん","問1のF02組への出庫額は、組と材料が1対1だったわね。"],["ずんだもん","問2は、日報の間接の時間に、部門の賃率を掛けたのだ。"],["めたん","問3は、配賦率に時間を掛けた所から、下へ下へと引いていったわ。"],["ずんだもん","問4は、倉庫に残った20個に、第1工程の単価を掛けたのだ。"],["めたん","問5の材料勘定は、材料費を全部入れて、別解も2つあったわね。"],["ずんだもん","配点は、問5の材料勘定と仕掛品勘定で15点もあるのだ。"],["めたん","問1から問4の答えを、全部使って埋める欄なのね。"],["ずんだもん","そうなのだ。前の問いが1つずれると、問5も一緒にずれるのだ。"]],[["ずんだもん","まとめなのだ。167回の工業簿記は、費目別、部門別、工程別組別を1本でたどる問題だったのだ。"],["めたん","材料は総平均法で、出庫票を組ごとに足せばよかったわね。"],["ずんだもん","直接工の間接作業と手待ちは、間接労務費なのだ。"],["めたん","補助材料費は、配賦率に時間を掛けた第2次集計から、逆にたどって出したわ。"],["ずんだもん","相互配賦は、一方通行なので、工場事務部門から先に配れば1回で済んだのだ。"],["めたん","工程完了品は倉庫に入って、残った20個が月末仕掛品だったわね。"],["ずんだもん","材料勘定は材料費を全部入れて、F032には月初の270,000を忘れないのだ。"],["ずんだもん","これで167回の工業簿記は全部なのだ。お疲れさまなのだ。"]]],"shorts":[{"hl":"待っていた時間も/[間接労務費]","at":206.11,"blob":"7ff4be1c4d6da53905db3b16bf87118c"},{"hl":"補助材料費は/[逆からたどる]","at":273.43,"blob":"16fb667cd278af92afb09fcd4785e543"},{"hl":"一方通行なら/[1回で済む]","at":386.65,"blob":"edbba08f22a7600ee895fed15e0df9fa"},{"hl":"倉庫に残った/[20個]が月末","at":638.29,"blob":"84b1d1aa885f7ae090f234ff27ad3aa4"},{"hl":"統制勘定の材料は/[材料費ぜんぶ]","at":696.96,"blob":"8cb75dd4b5ae5c89467a8dca2ad11565"}]},{"kind":"exam","no":"167回","sub":"過去問","ch":167,"probs":[],"hl":"[市場占有率差異]と/[線形計画法]","acct":"過去問","id":"x167-ge","title":"原価計算","sn":"原計","w":0.0,"wt":[],"video":{"blob":"c0fcbf15fd055e61fc6fff812128cae7","secs":886.97,"mb":11.1},"scenes":[[0,"原価計算の全体像"],[33.39,"会話文を読む"],[63.39,"予算と実績のP/L"],[106.13,"要因別分析と変動予算"],[143.96,"予算の販売量"],[170.5,"実際の販売量"],[218.74,"変動予算の箱"],[265.69,"販売価格差異"],[294.8,"変動費変動予算差異"],[329.99,"販売数量差異"],[368.96,"値上げが効いた"],[397.92,"売上原価部分と販売費部分"],[438.27,"市場占有率と総需要量"],[475.35,"占有率の箱を描く"],[544.54,"第1問の模範解答"],[567.75,"第2問の全体像"],[595.15,"どちらを優先するか"],[640.75,"LP法の式"],[673.02,"グラフを描く"],[708.86,"角の点を全部計算する"],[755.68,"設備Yの制約が外れる"],[796.52,"変動費がいくらで変わるか"],[838.08,"第2問の模範解答"],[850.68,"まとめ：予算実績差異分析"],[869.61,"まとめ：最適セールス・ミックス"]],"script":[[["ずんだもん","今回は、167回の原価計算を、最初から最後まで解くのだ。"],["めたん","大問が2つあるわね。第1問が業績の差異の分析、第2問が製品の組み合わせの話だわ。"],["ずんだもん","そうなのだ。第1問は予算実績差異分析、第2問は最適セールス・ミックスなのだ。"],["めたん","配点は第1問が17点、第2問が8点ね。第1問のほうがずっと重いのね。"],["ずんだもん","その通りなのだ。第1問は、会話文の空欄に金額と言葉を入れる形なのだ。"],["ずんだもん","第2問は、設備が2つあって、どちらの製品を何個作るかを決めるのだ。"],["めたん","どっちも、講義の下書きの形がそのまま使えそうね。"],["ずんだもん","そうなのだ。箱の図とグラフを描けば、迷わず解けるのだ。順に見ていくのだ。"]],[["ずんだもん","第1問は、経理部門のAさんとBさんの会話なのだ。"],["めたん","売上高は178,000の有利差異なのに、営業利益は予算を49,000下回っている、と言っているわ。"],["ずんだもん","売上は増えたのに、儲けは減ったのだ。その理由を、差異に分けて説明する話なのだ。"],["めたん","予算実績差異分析って、そもそも何をするものなの？"],["ずんだもん","1年たったあとで、予算の営業利益と実際の営業利益の差を、原因ごとに分ける分析なのだ。"],["めたん","売値のせいなのか、売れた数のせいなのか、コストのせいなのか、を分けるのね。"],["ずんだもん","そうなのだ。会話文の空欄は、全部で12個なのだ。金額が7個、言葉が5個なのだ。"]],[["ずんだもん","まず、資料1の業績報告書を見るのだ。予算と実績のP/Lが並んでいるのだ。"],["めたん","直接標準原価計算だから、変動費と固定費に分かれているわね。"],["ずんだもん","そうなのだ。この差異分析は、直接原価計算が前提なのだ。貢献利益の差を分けていくのだ。"],["ずんだもん","最初の空欄①は、固定費の差異なのだ。"],["めたん","固定費は、固定製造原価と固定販売費と一般管理費の3つね。予算の合計が3,470,000、実績の合計が3,435,000だわ。"],["ずんだもん","固定費の差異は、予算から実際を引くだけなのだ。差は35,000なのだ。"],["めたん","コストが予算より少なく済んだから、有利差異になるのね。"],["ずんだもん","その通りなのだ。①は35,000なのだ。"],["めたん","Bさんも、固定費は有利だから、説明の中心は貢献利益差異になる、と言っているわ。"],["ずんだもん","貢献利益は予算より実績のほうが小さいのだ。差は84,000の不利なのだ。これを3つに分けるのだ。"]],[["ずんだもん","貢献利益の差の分け方には、項目別分析と要因別分析があるのだ。"],["めたん","項目別って、P/Lの項目ごとに差を出すやり方のことよね。"],["ずんだもん","そうなのだ。売上高の差、売上原価の差、という分け方なのだ。総額法とも言うのだ。"],["ずんだもん","要因別は、利益の差を、売値・売れた数・コストという原因に分けるのだ。純額法とも言うのだ。"],["めたん","この問題は、どっちでやるの？"],["ずんだもん","Aさんが貢献利益差異でいくと、と言っているので、要因別、つまり純額法なのだ。指示が無いときも純額法でやるのだ。"],["めたん","売れた数の差を、売上ではなく利益で測るってことね。"],["ずんだもん","その通りなのだ。予算実績差異分析では、作った数と売れた数は同じと考えるのだ。"],["ずんだもん","たくさん売れたら、その分たくさん作るので、コストも増えるのだ。だからインパクトは利益なのだ。"]],[["ずんだもん","差異を出すには、予算と実績の販売量が要るのだ。でも、問題文には書いていないのだ。"],["めたん","数量がないなら、原価標準の150円で割り戻すのね。"],["ずんだもん","そうなのだ。資料2に、変動売上原価の予算は原価標準で編成している、とあるのだ。"],["めたん","予算の変動売上原価5,130,000を150で割って、34,200個ね。"],["ずんだもん","その通りなのだ。これが予算の販売量、BQなのだ。"],["めたん","BQって、何の略なの？"],["ずんだもん","バジェット・クオンティティ、予算の数量なのだ。実際の数量はアクチュアルでAQなのだ。"]],[["ずんだもん","次はAQなのだ。ここが一番の引っかけなのだ。"],["めたん","実績の変動売上原価5,303,000を、150で割ればいいのよね。"],["ずんだもん","それだと割り切れないのだ。実績の売上原価には、標準原価差異が乗っているのだ。"],["めたん","標準変動製造原価差異を、全額、変動売上原価に賦課している、とあるわね。"],["ずんだもん","そうなのだ。標準原価計算では、まず標準でP/Lに入れて、あとから差異を売上原価に足すのだ。"],["ずんだもん","だから、足された差異を抜けば、標準の売上原価に戻るのだ。"],["めたん","差異はどうやって出すの？"],["ずんだもん","実際の生産量34,100個に150を掛けた標準の製造原価が、5,115,000なのだ。"],["めたん","実際の変動製造原価は5,393,000だから、278,000の不利差異ね。"],["ずんだもん","そうなのだ。実績の売上原価からこの差異を引くと、5,025,000なのだ。"],["めたん","それを150で割ると33,500個になるわ。これがAQね。"],["ずんだもん","その通りなのだ。生産量の34,100個と、販売量の33,500個は別なので、混ぜないのだ。"]],[["ずんだもん","これで、講義の神下書き、変動予算の箱が描けるのだ。"],["めたん","横軸が個数で、右にBQの34,200個、左にAQの33,500個ね。"],["ずんだもん","そうなのだ。縦軸は単価で、上からBP、AP、AV、BVなのだ。"],["めたん","BPは予算の売値で、10,944,000を34,200個で割って320円になるわ。"],["ずんだもん","APは実際の売値で、11,122,000を33,500個で割って332円なのだ。"],["めたん","BVは予算の変動費の単価ね。売上原価の150と、販売費の40で、190になるわ。"],["ずんだもん","その通りなのだ。AVは、実際の変動費6,760,000を33,500個で割るのだ。割り切れないけど、使わないので大丈夫なのだ。"],["めたん","変動予算って、そもそも何？"],["ずんだもん","実際に売れた数で、予算どおりの単価だったら、いくらになるはずか、という予算なのだ。"],["ずんだもん","当初の予算と変動予算の差は予測のズレ、変動予算と実績の差は結果のズレなのだ。"]],[["ずんだもん","では空欄②と③なのだ。②は有利差異で、③がその金額なのだ。"],["めたん","売上高の差異のうち、売値が変わった分ね。"],["ずんだもん","そうなのだ。販売価格差異なのだ。②は語群のエなのだ。"],["めたん","売値の差に、何を掛けるの？"],["ずんだもん","実際に売った33,500個を掛けるのだ。予算の売値で売っていたら、という変動予算との差だからなのだ。"],["めたん","中から外を引くのよね。332円から320円を引いて、12円の値上がりだわ。"],["ずんだもん","その通りなのだ。12円に33,500個を掛けて、402,000の有利差異なのだ。③は402,000なのだ。"]],[["ずんだもん","次は空欄⑤なのだ。変動費変動予算差異なのだ。"],["めたん","変動費の単価が予算からずれた分よね。"],["ずんだもん","そうなのだ。講義の箱では、左下の単位原価差異と呼んでいるところなのだ。"],["めたん","ここも、実際の33,500個で比べるのね。"],["ずんだもん","そうなのだ。予算の単価190円で33,500個なら、6,365,000で済んだはずなのだ。"],["めたん","実際は6,760,000かかったから、395,000の不利差異になるわ。"],["ずんだもん","その通りなのだ。⑤は395,000なのだ。AVの単価は割り切れないので、金額どうしで引くのが楽なのだ。"],["めたん","コストだから、予算より多くかかったら不利なのね。"],["ずんだもん","そうなのだ。ここだけはコストの分析なので、BVが内側、AVが外側に来るのだ。"]],[["ずんだもん","次は空欄④なのだ。④は91,000の不利差異と書いてあるのだ。"],["めたん","売れた数が予算より減った分ね。販売数量差異、語群のクだわ。"],["ずんだもん","その通りなのだ。計算も確かめておくのだ。"],["めたん","33,500個から34,200個を引いて、700個足りなかったのね。"],["ずんだもん","そうなのだ。その700個に、予算の貢献利益の単価を掛けるのだ。"],["めたん","予算の売値の320円を掛けるんじゃないのね。"],["ずんだもん","純額法なので、縦は利益なのだ。売値320円から変動費190円を引いた、130円なのだ。"],["めたん","130円×700個で91,000の不利になるわ。問題文と合ったわ。"],["ずんだもん","3つを足すと、402,000の有利、395,000の不利、91,000の不利で、84,000の不利なのだ。"],["めたん","さっきの貢献利益の差84,000と、ぴったり合うわね。"]],[["ずんだもん","空欄⑥なのだ。Bさんは、②は期中に実施した⑥が効いている、と言っているのだ。"],["めたん","販売価格差異が有利ってことは、予算より高く売れたのよね。"],["ずんだもん","そうなのだ。予算320円のところを332円で売ったのだ。⑥は値上げ、語群のオなのだ。"],["めたん","Aさんの、④も不利で⑥もあって販売不振、というのもつながるわね。"],["ずんだもん","値段を上げたぶん、売れた数が予算より700個少なかったのだ。"],["めたん","値上げで1個あたりは儲かったけど、数で少し取り返された、という形ね。"],["ずんだもん","その通りなのだ。この表の右の2列が、予測のズレと結果のズレなのだ。"]],[["ずんだもん","空欄⑦と⑧なのだ。変動費変動予算差異を、売上原価と販売費に分けるのだ。"],["めたん","売上原価のほうは、予算の単価150円で33,500個なら5,025,000ね。"],["ずんだもん","そうなのだ。実績はそれより多くかかっているので、不利差異なのだ。⑦は278,000なのだ。"],["めたん","あれ、さっきの標準原価差異と同じ数字だわ。"],["ずんだもん","いいところに気づいたのだ。売上原価は標準で入れて差異を足しただけなので、差は賦課した差異そのものなのだ。"],["めたん","販売費のほうは、予算の40円で33,500個なら1,340,000ね。"],["ずんだもん","実績から引くと、こちらも不利差異なのだ。⑧は117,000なのだ。"],["めたん","278,000と117,000を足して、⑤の395,000に戻るわね。"],["ずんだもん","その通りなのだ。売上原価の分は製造部門、販売費の分は販売部門に説明してもらうのだ。"]],[["ずんだもん","最後のBさんの台詞なのだ。④を⑨と⑩に分ける話なのだ。"],["めたん","一概に販売不振と言い切れない、と言っているわね。"],["ずんだもん","業績報告書の一番下に、市場占有率が予算12.0%、実績13.4%とあるのだ。"],["めたん","シェアは上がっているのに、売れた数は減っているのね。"],["ずんだもん","そうなのだ。だから市場全体の大きさが、予想より縮んだと分かるのだ。"],["めたん","市場占有率差異と、市場総需要量差異に分けるのね。⑨と⑩は、どっちがどっち？"],["ずんだもん","⑨が不利で、⑩が有利なのだ。シェアが上がったほうが有利なので、⑩が市場占有率差異のコなのだ。"],["めたん","⑨は市場総需要量差異、サになるわ。"],["ずんだもん","その通りなのだ。市場総需要量差異は、市場全体の需要が予想とずれた分なのだ。"]],[["ずんだもん","金額を出すために、販売数量差異の面積を2つに割るのだ。"],["めたん","真ん中に、もう1本、縦の線を引くのね。"],["ずんだもん","そうなのだ。真ん中はB'Q、実際の総需要量に、予算のシェアを掛けた数量なのだ。"],["めたん","実際の総需要量は、問題文に書いてないわよ。"],["ずんだもん","AQの33,500個を、実際のシェア13.4%で割り戻すのだ。250,000個なのだ。"],["めたん","それに予算のシェア12%を掛けて、B'Qは30,000個ね。"],["ずんだもん","その通りなのだ。市場が250,000個に縮んでも、予定どおりのシェアなら30,000個は売れたはずなのだ。"],["ずんだもん","AQとB'Qの差が市場占有率差異、B'QとBQの差が市場総需要量差異なのだ。"],["めたん","占有率差異は、33,500個から30,000個を引いて、3,500個多く売れた分ね。"],["ずんだもん","そうなのだ。縦は同じ予算の貢献利益130円なのだ。455,000の有利差異なのだ。⑫は455,000なのだ。"],["めたん","総需要量差異は、30,000個から34,200個を引いて、4,200個足りない分だわ。"],["ずんだもん","130円を掛けて、546,000の不利差異なのだ。⑪は546,000なのだ。"],["めたん","有利と不利を足し引きすると、④の91,000の不利に戻るわね。"],["ずんだもん","その通りなのだ。占有率差異は営業の頑張りで変えられる、管理可能な差異なのだ。"],["ずんだもん","総需要量差異は、景気や世の中全体の話なので、管理不能なのだ。"],["めたん","だから、シェアは取れているので、一概に販売不振とは言えないのね。"]],[["ずんだもん","第1問の模範解答で、全部の欄を確かめるのだ。"],["めたん","①が固定費差異、②③が販売価格差異、④が販売数量差異、⑤が変動費変動予算差異ね。"],["ずんだもん","⑥が値上げ、⑦⑧が⑤を売上原価と販売費に分けた数字なのだ。"],["めたん","⑨から⑫が、総需要量と占有率の分け方だったわ。"],["ずんだもん","金額の欄は、AQの33,500個が出せるかどうかで、ほとんど決まるのだ。"],["めたん","賦課された差異を抜くのを忘れたら、全部ずれるのね。"]],[["ずんだもん","ここから第2問なのだ。製品Aと製品Bを、設備Xと設備Yで作るのだ。"],["めたん","設備Xは16,000時間、設備Yは15,000時間まで、と月の能力が決まっているわ。"],["ずんだもん","そうなのだ。こういう上限のことを、制約条件と言うのだ。"],["めたん","上限の中で、AとBを何個ずつ作ると、一番儲かるか、という話ね。"],["ずんだもん","その通りなのだ。それが最適セールス・ミックスなのだ。"],["めたん","最大需要量も、Aは4,600個、Bは3,500個とあるわ。"],["ずんだもん","それ以上作っても売れない、という上限なのだ。これも制約条件の1つなのだ。"]],[["ずんだもん","まず、1個あたりの貢献利益を出すのだ。"],["めたん","Aは1,100円から515円を引いて585円、Bは900円から380円を引いて520円ね。"],["ずんだもん","そうなのだ。じゃあ、利益の大きいAから作ればいいかというと、違うのだ。"],["めたん","設備の時間が限られているから、1時間あたりで比べるのね。"],["ずんだもん","その通りなのだ。制約条件の単位あたりの貢献利益で比べるのが、ポイントなのだ。"],["ずんだもん","受験勉強で、1時間あたり何点伸びるかで、どの科目からやるか決めるのと同じなのだ。"],["めたん","設備Xでは、Aは1時間あたり234円、Bは130円になるわ。Aのほうがいいわね。"],["ずんだもん","設備Yでは、Aが3時間で195円、Bが2時間で260円なのだ。"],["めたん","今度はBのほうがいいわ。順番があべこべね。"],["ずんだもん","そうなのだ。あべこべだと、Aから作って残りでBを作る、という解き方ができないのだ。"],["ずんだもん","そこで使うのが、線形計画法、LP法なのだ。"]],[["めたん","線形計画法って、どういう解き方なの？"],["ずんだもん","制約条件を式にして、グラフに描いて、一番儲かる点を探す解き方なのだ。"],["めたん","設備Xの式は、Aを1個作るのに2.5時間、Bは4時間だから、2.5A＋4Bが16,000以下ね。"],["ずんだもん","その通りなのだ。設備Yは、3A＋2Bが15,000以下なのだ。"],["めたん","それに、Aは4,600個まで、Bは3,500個までの2本ね。"],["ずんだもん","そうなのだ。儲けの式は585A＋520Bで、これを一番大きくするのだ。"],["めたん","固定費の10,900,000は、どこで使うの？"],["ずんだもん","どの組み合わせでも同じ額かかるので、比べるときには使わないのだ。比べるのは貢献利益なのだ。"]],[["ずんだもん","グラフは、横軸がA、縦軸がBなのだ。"],["ずんだもん","式の片方に0を入れると、線の端が出るのだ。そこを結ぶのだ。"],["めたん","設備Xの式でAを0にすると、Bは4,000になるわ。Bを0にすると、Aは6,400ね。"],["ずんだもん","そうなのだ。設備Yは、Bが7,500、Aが5,000なのだ。"],["めたん","Aの需要は4,600の縦線、Bの需要は3,500の横線ね。"],["ずんだもん","全部の線より左下の、斜線のところだけが作れる範囲なのだ。生産可能領域と言うのだ。"],["めたん","この中で、右上に行くほど儲かるのね。"],["ずんだもん","その通りなのだ。だから答えは、生産可能領域の角のどれかになるのだ。"],["ずんだもん","縮尺は目分量でいいので、ちゃんと描くのが大事なのだ。角の並び順を間違えにくくなるのだ。"]],[["ずんだもん","角の候補は、ア、イ、ウの3つなのだ。"],["めたん","アは、Bの需要3,500の線と、設備Xの線が交わる所ね。"],["ずんだもん","設備Xの式のBに3,500を入れるのだ。Aは800個なのだ。"],["めたん","イは、設備Xと設備Yの線が交わる所ね。"],["ずんだもん","連立方程式なのだ。Yの式を2倍すると、6A＋4Bが30,000になるのだ。"],["めたん","そこからXの式を引くと、Bが消えて、3.5Aが14,000になるわ。Aは4,000個ね。"],["ずんだもん","その通りなのだ。代入すると、Bは1,500個なのだ。"],["めたん","ウは、Aの需要4,600の線と、設備Yの線の交点ね。"],["ずんだもん","設備Yの式のAに4,600を入れて、Bは600個なのだ。"],["ずんだもん","3つとも貢献利益を計算するのだ。本命はイでも、全部比べておくのが安全なのだ。"],["めたん","イの貢献利益は3,120,000で、3つの中で一番大きいわ。"],["ずんだもん","問1の答えは、製品Aが4,000個、製品Bが1,500個なのだ。"]],[["ずんだもん","問2は、設備Yを18,500時間に増やしたらどうなるか、なのだ。"],["めたん","設備Yの線が、右上に平行に動くのね。Bが9,250、Aが6,166の所を通るわ。"],["ずんだもん","そうなのだ。すると、設備Yの線が、生産可能領域にかからなくなるのだ。"],["めたん","設備Yの時間は余っていて、もう上限にならないってことね。"],["ずんだもん","その通りなのだ。制約になるのは、設備Xと、AとBの需要だけなのだ。"],["めたん","角の候補は、さっきのアと、Aの需要4,600と設備Xの交点ね。"],["ずんだもん","設備Xの式のAに4,600を入れると、Bは1,125個なのだ。"],["めたん","貢献利益は3,276,000で、アの2,288,000より大きいわ。"],["ずんだもん","問2の答えは、製品Aが4,600個、製品Bが1,125個なのだ。"],["めたん","Aは需要いっぱいまで作れるようになったのね。"]],[["ずんだもん","問3は、製品Aの変動費がいくらを超えると、問1の答えが変わるか、なのだ。"],["めたん","Aの変動費が上がると、Aの儲けが減るのね。"],["ずんだもん","そうなのだ。どこかで、Bを多く作るアの点のほうが得になるのだ。"],["めたん","アとイの貢献利益が、ちょうど同じになる所を探せばいいのね。"],["ずんだもん","その通りなのだ。イの貢献利益からアの貢献利益を引くと、832,000なのだ。"],["めたん","イのほうが、Aを3,200個多く作っているわ。"],["ずんだもん","Aの変動費が1個上がるたびに、その3,200個分だけイの儲けが減るのだ。"],["めたん","832,000を3,200個で割って、1個あたり260円ね。"],["ずんだもん","そうなのだ。今の変動費515円に260円を足して、775円なのだ。"],["ずんだもん","Aの変動費が775円を超えると、アの点が最適になるのだ。"],["めたん","問題文の、問2の条件は考えない、というのも忘れないようにするわ。"]],[["ずんだもん","第2問の模範解答なのだ。"],["めたん","グラフの角で出した数と、変動費の境目が、そのまま答えになっているわね。"],["ずんだもん","問1と問2は、完答で点がもらえるのだ。AとBの両方を合わせるのだ。"],["めたん","グラフが描ければ、問2はほぼ線を動かすだけね。"]],[["ずんだもん","まとめなのだ。販売量は、原価標準で割り戻すのだ。実際のほうは、賦課した差異を抜いてから割るのだ。"],["めたん","販売価格差異と変動費の差異は実際の数量、販売数量差異は予算の貢献利益で測るのね。"],["ずんだもん","販売数量差異は、真ん中のB'Qで、占有率差異と総需要量差異に割るのだ。"],["めたん","占有率差異は管理可能、総需要量差異は管理不能、だったわね。"]],[["ずんだもん","制約条件が2つで順番があべこべなら、線形計画法なのだ。"],["めたん","片方に0を入れて線を引いて、生産可能領域の角を全部計算する、ね。"],["ずんだもん","制約が外れたら、その線は無視するのだ。変動費の境目は、2つの角の利益の差を数量の差で割るのだ。"],["ずんだもん","これで167回の原価計算は全部なのだ。お疲れさまなのだ。"]]],"shorts":[{"hl":"売れた数は/[差異を抜いて]から割る","at":170.5,"blob":"f67b877973ca04ddc162fd7a42c776e5"},{"hl":"売れなかった数は/[貢献利益]で測る","at":329.99,"blob":"e134cce32c0053b4b62ba1c701edb1ba"},{"hl":"数が減っても/[シェア]は上がっていた","at":475.35,"blob":"50bb787e44abe9a3806a224518daa81a"},{"hl":"順位が/[あべこべ]なら線形計画法","at":595.15,"blob":"38ca022da9c789dcad66c75a5681774a"},{"hl":"Aの変動費が/[775円]を超えたら","at":796.52,"blob":"20f4197a80323f8f6b2d5a8bd099a274"}]},{"kind":"exam","no":"168回","sub":"過去問","ch":168,"probs":[],"hl":"","acct":"過去問","id":"x168-bo","title":"商業簿記","sn":"商簿","w":0.0,"wt":[]},{"kind":"exam","no":"168回","sub":"過去問","ch":168,"probs":[],"hl":"[持分法]から/[段階取得・一部売却]まで","acct":"過去問","id":"x168-ka","title":"会計学","sn":"会計","w":0.0,"wt":[],"video":{"blob":"24781e8d18b99d60c4d6ae9f32264f69","secs":949.45,"mb":11.9},"scenes":[[0,"会計学の全体像"],[26.32,"第1問の1：原価回収基準と履行義務"],[90.62,"第1問の1：見積りの変更と契約資産"],[129.71,"第1問の2：回収可能価額と減損の兆候"],[186.33,"第1問の2：開発費と株式交付費"],[233.81,"第1問の3：繰延ヘッジと評価差額金の表示"],[274.35,"第1問の3：圧縮積立金と資本準備金"],[307.97,"第1問の4：事業分離と持分プーリング法"],[345.84,"第1問の4：仕掛研究開発と取得関連費用"],[382.21,"第2問：資料と答案の形"],[422.87,"S社：支配獲得のとき"],[474.23,"T社：持分法のはじまり"],[518.37,"X1年度の連結BS"],[550.13,"S社：X2年度の利益とのれん"],[580.13,"T社：持分法の1年と段階取得"],[644.77,"T社：支配獲得とのれん"],[686.71,"X2年度の連結BS"],[730.47,"X3年度の利益の按分"],[751.43,"S社の一部売却：タイムテーブル"],[800.04,"S社の一部売却：王冠の絵"],[833.02,"X3年度の連結BS"],[878.47,"模範解答"],[904.46,"まとめ：第1問"],[924.61,"まとめ：第2問"]],"script":[[["ずんだもん","今回は、168回の会計学を、最初から最後まで解くのだ。"],["めたん","会計学は2問ね。"],["ずんだもん","第1問は、正しい文章を1つ選ぶ問題が4つあるのだ。"],["ずんだもん","第2問は、3年分の連結貸借対照表を作る問題なのだ。"],["めたん","配点は第1問が8点、第2問が17点の予想になっているわ。"],["ずんだもん","第1問は、間違いの選択肢に1語だけ入れ替えた所があるのだ。そこを見つけるのがコツなのだ。"],["めたん","どの語が入れ替わっているかを探せばいいのね。"],["ずんだもん","そうなのだ。では、1の収益認識から見ていくのだ。"]],[["ずんだもん","1で埋まるのは、答案の1の欄なのだ。収益認識の4つの文章から、正しいものを選ぶのだ。"],["めたん","アは、進捗度を見積もれず、費用を回収することが見込まれない場合は、原価回収基準、とあるわ。"],["ずんだもん","工事で考えるのだ。進み具合のパーセントが分かれば、原価比例法で売上を出すのだ。"],["ずんだもん","パーセントが分からなくても、途中でやめたとき費用分はもらえる契約なら、原価回収基準なのだ。"],["めたん","原価回収基準って何？"],["ずんだもん","かかった原価と同じ額だけ、売上に上げる方法なのだ。利益はゼロでも、売上と契約資産は載せられるのだ。"],["めたん","じゃあ費用分ももらえない契約なら？"],["ずんだもん","そのときは工事完成基準まで行くのだ。完成するまで売上はゼロなのだ。"],["めたん","つまり原価回収基準は、費用を回収することが見込まれる場合ね。アは見込まれないと書いてあるから、誤りだわ。"],["ずんだもん","その通りなのだ。たった1語、まれるとまれないが入れ替わっているのだ。"],["めたん","イは、1個の契約に1個の履行義務を識別する、とあるわ。"],["ずんだもん","履行義務は、お客さんに約束した、物やサービスを渡す義務のことなのだ。"],["ずんだもん","パソコン本体と、サポートサービスをセットで売ったら、契約は1つでも、渡す義務は2つなのだ。"],["めたん","契約の中を、2つに分けて考えるのね。"],["ずんだもん","そうなのだ。収益の認識を緻密にするために、契約の中を分けるのだ。だから1個の契約に1個とは限らないのだ。イも誤りなのだ。"]],[["めたん","ウは、進捗度は各決算日に見直して、変えるときは会計上の見積りの変更として処理する、とあるわ。"],["ずんだもん","見積りの変更は、将来にわたって直すものなのだ。過去にさかのぼって直さないのだ。"],["めたん","減価償却の耐用年数を変えたときと同じね。"],["ずんだもん","その通りなのだ。工事の総原価の見積りが変わっても、変わった後の数字で今年から計算するのだ。ウは正しいのだ。"],["めたん","エは、契約資産には、債権と違って貸倒引当金を設定しない、とあるわ。"],["ずんだもん","契約資産は、売掛金の一歩手前なのだ。工事の途中で、まだ請求できる段階になっていないものなのだ。"],["めたん","売掛金と同じで、将来お金をもらう権利なのね。"],["ずんだもん","そうなのだ。だから基準では、契約資産も債権と同じように貸倒引当金を設定するのだ。エは誤りなのだ。"],["ずんだもん","答案の1の欄は「ウ」なのだ。"]],[["ずんだもん","2で埋まるのは、答案の2の欄なのだ。減損と繰延資産の4つなのだ。"],["めたん","アは、回収可能価額は、使用価値と正味売却価額のいずれか低い方、とあるわ。"],["ずんだもん","回収可能価額は、その資産から回収できる金額のことなのだ。"],["ずんだもん","正味売却価額は売った場合の金額、使用価値は我慢して使い続けた場合の金額なのだ。"],["めたん","経営者なら、売るか使うか、得な方を選ぶわよね。"],["ずんだもん","その通りなのだ。だから回収可能価額は高い方なのだ。アは低い方と書いてあるので誤りなのだ。"],["めたん","リースは低い方だったわよね。"],["ずんだもん","リースは安い方で買うので低い方、減損は得な方で回収するので高い方なのだ。理由で覚えれば混ざらないのだ。"],["めたん","イは、市場価格が著しく下落したら、その市場価格まで帳簿価額を減らす、とあるわ。"],["ずんだもん","減損は3つのステップなのだ。兆候、認識、測定なのだ。"],["ずんだもん","市場価格の著しい低下は、1つ目の兆候なのだ。雰囲気がやばそう、という段階にすぎないのだ。"],["めたん","兆候があっても、すぐ減らすわけじゃないのね。"],["ずんだもん","そうなのだ。次に割引前の将来キャッシュ・フローと簿価を比べて、本当にやばいか判定するのだ。減らすのも、市場価格ではなく回収可能価額までなのだ。イも誤りなのだ。"]],[["めたん","ウは、研究開発費の基準で、開発費はすべて繰延資産にできない、とあるわ。"],["ずんだもん","研究開発費は、発生したときに一発で費用なのだ。将来の売上と結び付くか分からないからなのだ。"],["ずんだもん","でも繰延資産の開発費は別物なのだ。新しい市場を開拓するための、特別に支出した費用なのだ。"],["めたん","プロジェクトがあって、将来の売上が見えている支出ね。"],["ずんだもん","そうなのだ。だから原則は費用だけど、繰延資産にすることも認められるのだ。すべてダメ、ではないのでウは誤りなのだ。"],["めたん","エは、自己株式の処分の費用は、株式交付費として繰延資産にできる、とあるわ。"],["ずんだもん","自己株式の処分は、新株の発行と同じなのだ。会社にお金が入ってくるのだ。"],["めたん","そのお金で設備を買って、将来の売上につながるのね。"],["ずんだもん","その通りなのだ。だから株式交付費として繰延資産にできるのだ。エは正しいのだ。"],["めたん","消却の手数料は？"],["ずんだもん","消却は株を破って捨てるだけで、お金は入ってこないのだ。だから繰延資産にはできないのだ。"],["ずんだもん","答案の2の欄は「エ」なのだ。"]],[["ずんだもん","3で埋まるのは、答案の3の欄なのだ。金融商品と純資産の4つなのだ。"],["めたん","アは、繰延ヘッジ利益は純資産、でもヘッジ損失は損益計算書の営業外費用か特別損失、とあるわ。"],["ずんだもん","繰延ヘッジは、ヘッジ手段の損益をBSの純資産に置いておいて、ヘッジ対象と同じ時期に損益にする方法なのだ。"],["めたん","利益だけ純資産で、損失はすぐ費用、なんて都合がよすぎるわね。"],["ずんだもん","その通りなのだ。損失も、純資産のマイナスとして繰り延べるのだ。アは誤りなのだ。"],["めたん","イは、その他有価証券評価差額金は、個別では評価・換算差額等、連結ではその他の包括利益累計額に表示する、とあるわ。"],["ずんだもん","包括利益は、いまの日本では連結だけの考え方なのだ。"],["ずんだもん","だから個別では評価・換算差額等、連結になって初めてその他の包括利益累計額と呼ぶのだ。イは正しいのだ。"]],[["めたん","ウは、圧縮積立金は資本剰余金として表示する、とあるわ。"],["ずんだもん","圧縮積立金は、繰越利益剰余金を取り崩して積み立てる、任意積立金の一種なのだ。"],["めたん","利益から積むんだから、利益剰余金ね。ウは誤りだわ。"],["ずんだもん","その通りなのだ。"],["めたん","エは、資本準備金が資本金を超えることは、会社法上認められない、とあるわ。"],["ずんだもん","会社法では、資本準備金が資本金より大きくなってもかまわないのだ。"],["めたん","新株の発行なら、最低でも半分は資本金に入れるから、超えにくいわよね。"],["ずんだもん","そうなのだ。でも資本金を減らしたときなどに、準備金のほうが大きくなることはあるのだ。それは禁止されていないので、エも誤りなのだ。"],["ずんだもん","答案の3の欄は「イ」なのだ。"]],[["ずんだもん","4で埋まるのは、答案の4の欄なのだ。企業結合の4つなのだ。"],["めたん","アは、親会社が子会社に事業を分離して、対価が現金なら、個別で移転損益を出して、連結では消す、とあるわ。"],["ずんだもん","グループの中で事業を移すのは、共通支配下の取引なのだ。名義が変わっただけなのだ。"],["めたん","個別ではお金をもらっているから、差額が移転損益として出ちゃうのね。"],["ずんだもん","そうなのだ。でも連結で見ると、その移転損益は100%グループの中の利益なのだ。親戚に売った利益なので、全部消すのだ。アは正しいのだ。"],["めたん","イは、持分の結合には、持分プーリング法を使う、とあるわ。"],["ずんだもん","持分プーリング法は、企業結合の基準からなくなったのだ。"],["ずんだもん","いまは、共同支配企業の形成と、共通支配下の取引に整理されているのだ。イは誤りなのだ。"]],[["めたん","ウは、企業結合で取った仕掛研究開発は、その期の費用にする、とあるわ。"],["ずんだもん","相手の会社では、研究開発費は費用にしているので、BSには何も載っていないのだ。"],["ずんだもん","でも買った側は、その研究が成功すると思って買収したのだ。"],["めたん","だから、時価で資産に載せるのね。"],["ずんだもん","その通りなのだ。目に見えない資産も引き継ぐのだ。ウは誤りなのだ。"],["めたん","エは、取得関連費用は、連結で取得原価に含める、とあるわ。"],["ずんだもん","個別では、株を買うときの手数料は取得原価に含めるのだ。"],["ずんだもん","でも連結では、手数料は証券会社という他人に払ったお金なのだ。取得原価に入れず、費用にするのだ。"],["めたん","入れたら、その分のれんが大きくなっちゃうわね。"],["ずんだもん","そうなのだ。エも誤りなのだ。答案の4の欄は「ア」なのだ。"]],[["ずんだもん","次は第2問なのだ。P社が作る連結貸借対照表を、X1年度からX3年度まで3年分作るのだ。"],["めたん","子会社や関連会社になる相手は2社ね。S社とT社だわ。"],["ずんだもん","そうなのだ。のれんは翌年度から10年で償却、税効果は考えなくていいのだ。"],["めたん","答案の表は、諸資産、関連会社株式、のれん、それと負債と純資産の欄が3年分並んでいるわ。"],["ずんだもん","資料の1と4がS社、2と3がT社の話なのだ。"],["めたん","S社はX1年度末に80%を取って子会社、X3年度末に20%を売るのね。"],["ずんだもん","T社はX1年度末に20%を取って関連会社、X2年度末に60%を買い足して子会社になるのだ。"],["めたん","T社は途中で持分法から連結に変わるのね。ややこしそうだわ。"],["ずんだもん","会社ごとにタイムテーブルを1枚ずつ描けば、全部の欄が出るのだ。"]],[["ずんだもん","まずS社なのだ。下書きはタイムテーブルを描くのだ。"],["めたん","タイムテーブルって何？"],["ずんだもん","子会社の純資産の動きを、時間の順に書いた下書きなのだ。慣れたら、仕訳を切らずにこれだけで連結の数字が出るのだ。"],["ずんだもん","横にX1年度末、X2年度末、X3年度末を並べて、X1年度末の上に＋80%を書くのだ。"],["めたん","縦は資本金、利益剰余金、評価差額ね。"],["ずんだもん","評価差額は、資料5の諸資産の時価と簿価の差なのだ。自分の体の中は簿価、相手の体は時価で受け入れるのだ。"],["めたん","時価から簿価を引いて、10,000ね。原因は土地だわ。"],["ずんだもん","土地は減価償却しないし、売ってもいないのだ。だから評価差額は3年間ずっと10,000のままなのだ。"],["ずんだもん","X1年度末の合計は140,000なのだ。これに80%を掛けたのがP社持分なのだ。"],["めたん","112,000になるわ。"],["ずんだもん","P社はそれを120,000で買ったのだ。"],["めたん","払いすぎた8,000が、のれんね。翌年度から10年だから、毎年800ずつ償却するのね。"],["ずんだもん","そうなのだ。残りの20%の28,000が非支配株主持分なのだ。"]],[["ずんだもん","次はT社なのだ。X1年度末は20%なので、関連会社として持分法を使うのだ。"],["めたん","持分法って、連結と何が違うの？"],["ずんだもん","持分法は、簡便版の連結なのだ。相手の資産と負債を合算しないのだ。"],["めたん","合算しないなら、消すものもないわね。"],["ずんだもん","その通りなのだ。だから投資と資本の相殺はいらないのだ。T社株式の金額を、要る所だけつまみ食いして直すのだ。"],["ずんだもん","それでも、のれんの金額だけは出しておくのだ。"],["めたん","T社の資本金と利益剰余金で40,000、20%を掛けて8,000ね。"],["ずんだもん","評価差額は、持分の20%の分だけ時価にするのだ。時価と簿価の差の8,000に20%を掛けて、1,600なのだ。"],["めたん","足してP社持分は9,600ね。取得原価の12,000との差の2,400が、のれんになるわ。"],["ずんだもん","この2,400は概念だけなのだ。BSにのれんとしては出てこないで、T社株式の12,000の中に入ったままなのだ。"]],[["ずんだもん","材料がそろったので、X1年度の欄を埋めるのだ。"],["めたん","諸資産は、P社とS社を足して、評価差額の10,000を足すのね。"],["ずんだもん","そうなのだ。518,000なのだ。T社は持分法なので、T社の諸資産は足さないのだ。"],["めたん","関連会社株式は、取ったばかりだから取得原価の12,000のままね。"],["ずんだもん","のれんはS社の8,000だけなのだ。"],["めたん","利益剰余金はどうなるの？"],["ずんだもん","X1年度末に取ったばかりなので、S社の利益で増えた分はまだ無いのだ。P社の100,000のままなのだ。"],["ずんだもん","非支配株主持分は、S社の合計140,000に20%を掛けた28,000なのだ。"],["めたん","資本金と資本剰余金はP社のみだから、これでX1年度は全部ね。"]],[["ずんだもん","次はX2年度なのだ。S社の利益剰余金は、80,000から90,000に増えているのだ。"],["めたん","この10,000を、80%と20%に分けるのね。"],["ずんだもん","そうなのだ。矢印の上にP社の8,000、矢印の下に非支配株主の2,000を書くのだ。"],["めたん","どうして上と下に分けて書くの？"],["ずんだもん","集計のミスがなくなるからなのだ。グループの業績になるのは、支配した後に増えた矢印の上だけなのだ。"],["ずんだもん","のれんは800償却して、7,200になるのだ。のれんは、タイムテーブルの右の数字がそのまま答えなのだ。"],["めたん","X2年度末の合計は150,000ね。非支配株主持分は、合計の20%で30,000になるわ。"]],[["ずんだもん","T社のX2年度なのだ。まず持分法のまま1年過ごすのだ。"],["めたん","T社の利益剰余金は5,000増えているわ。P社の分は20%で1,000ね。"],["ずんだもん","そうなのだ。持分法では、この1,000だけT社株式を増やすのだ。相手は持分法による投資損益なのだ。"],["ずんだもん","それから、のれん2,400の10分の1、240を償却して、T社株式を減らすのだ。"],["めたん","12,000に1,000を足して、240を引くと、12,760ね。これが持分法の金額だわ。"],["ずんだもん","そしてX2年度末に、60%を42,000で買い足すのだ。合わせて80%で、子会社になるのだ。"],["めたん","元の20%は、12,760のまま連結すればいいの？"],["ずんだもん","そこが引っかけなのだ。支配の壁を突っ切ったので、元の20%もオール時価に変えるのだ。"],["めたん","時価って、どうやって出すの？"],["ずんだもん","同じ日に60%を42,000で買っているのだ。60分の20を掛けて、元の20%の時価は14,000なのだ。"],["めたん","時価から持分法の金額を引いた1,240は、どうなるの？"],["ずんだもん","持分法の金額の紙切れを、時価で売っ払って、すぐ同じ時価で買い戻したと考えるのだ。買い戻した株は、支配の力を持つゴールデンチケットなのだ。"],["めたん","売ったと考えるなら、差の1,240は売却益ね。"],["ずんだもん","その通りなのだ。これが段階取得に係る差益なのだ。正体は売却益なので、利益になるのだ。"]],[["ずんだもん","ここから連結のやり直しなのだ。支配獲得のときの投資は、2つを足すのだ。"],["めたん","元の分の時価と追加の42,000を足して、56,000ね。"],["ずんだもん","その通りなのだ。T社の評価差額も、連結なので100%分を新しく出すのだ。"],["めたん","X2年度末の時価から簿価を引いて、評価差額は7,000ね。"],["ずんだもん","そうなのだ。持分法のときの20%分の評価差額は使わないのだ。"],["ずんだもん","資本金と利益剰余金と評価差額を足して、合計52,000なのだ。"],["めたん","80%を掛けて、P社持分は41,600になるわ。"],["ずんだもん","56,000から41,600を引いて、のれんは14,400なのだ。"],["めたん","持分法のときののれん2,160は、どうするの？"],["ずんだもん","投資の性質が変わったので、引き継がないのだ。ペケして、新しいのれん14,400だけにするのだ。"],["ずんだもん","非支配株主持分は、合計52,000の20%で10,400なのだ。"]],[["ずんだもん","X2年度の欄を埋めるのだ。今度はT社もBSに合算するのだ。"],["めたん","T社の今年の利益の5,000は、合算しないの？"],["ずんだもん","X2年度の間は、まだ関連会社だったのだ。だから損益は持分法の分だけで、BSは期末に子会社なので合算するのだ。"],["めたん","諸資産は3社を足して、評価差額のS社10,000とT社7,000を足すのね。618,000になるわ。"],["ずんだもん","関連会社株式は、T社が子会社になったので0なのだ。"],["めたん","のれんは、S社とT社の分を足して、21,600ね。"],["ずんだもん","利益剰余金は、P社の110,000に、S社の矢印の上の8,000を足して、のれん償却の800を引くのだ。"],["ずんだもん","さらに、T社の持分法の1,000と△240、それと段階取得に係る差益の1,240を足すのだ。"],["めたん","119,200になるわ。差益を足し忘れたら、ここがずれるのね。"],["ずんだもん","その通りなのだ。非支配株主持分は、S社とT社の分を足して40,400なのだ。"]],[["ずんだもん","X3年度なのだ。まず2社の利益を分けるのだ。"],["めたん","S社の利益剰余金は20,000増えているわ。80%を掛けた16,000が上、残りの4,000が下ね。"],["ずんだもん","T社は3,000増えているのだ。今度は80%なので、上が2,400、下が600なのだ。"],["めたん","のれんは、S社が800、T社が1,440の償却になるのね。"],["ずんだもん","そうなのだ。T社ののれんは、14,400の10分の1なのだ。"]],[["ずんだもん","いよいよ資料4、S社株の20%の売却なのだ。"],["めたん","80%が60%になるのね。まだ子会社のままだわ。"],["ずんだもん","支配は続いているので、売った相手は非支配株主なのだ。P社と非支配株主は、親戚のように考えるのだ。"],["めたん","親戚との取引だから、資本取引になるのね。"],["ずんだもん","その通りなのだ。資本取引からは損益が出ないのだ。差が出たら資本剰余金にするのだ。"],["ずんだもん","まず個別の仕訳なのだ。P社は80%を120,000で買ったのだ。"],["めたん","売った20%の原価は、120,000に80分の20を掛けて、30,000ね。"],["ずんだもん","これが個別上の簿価、個ボカなのだ。36,000で売ったので、個別の売却益は6,000なのだ。"],["めたん","連結のほうは？"],["ずんだもん","連結で手放したのは、子会社株式ではなく、S社の純資産の20%なのだ。X3年度末の合計170,000に20%を掛けるのだ。"],["めたん","34,000になるわ。これが連結上の簿価、連ボカね。"],["ずんだもん","取得原価で考えるのが個ボカ、純資産と連動させるのが連ボカなのだ。"]],[["ずんだもん","王冠の絵を描くのだ。左に売価、まん中に個ボカ、右に連ボカなのだ。"],["ずんだもん","個別の仕訳は、売価と個ボカの差で、売却益6,000を出しているのだ。"],["ずんだもん","連結では、売価と連ボカの差を資本剰余金にするのだ。個別の売却益はペケして、丸の資本剰余金に直すのだ。"],["めたん","36,000から34,000を引いて、資本剰余金は2,000増えるのね。"],["ずんだもん","そうなのだ。非支配株主持分は、連ボカの34,000だけ増えるのだ。連結損益計算書の売却益は、必ずゼロなのだ。"],["めたん","じゃあ個別の売却益6,000は、連結の利益剰余金から消すのね。"],["ずんだもん","ここを引き忘れる人が多いのだ。P社の利益剰余金140,000には、この6,000が入っているのだ。"]],[["ずんだもん","最後にX3年度の欄なのだ。"],["めたん","諸資産は3社を足して、評価差額の17,000を足すのね。716,000になるわ。"],["ずんだもん","のれんは、S社とT社の残りを足して19,360なのだ。"],["めたん","資本剰余金は、P社の50,000に、一部売却の2,000を足して52,000ね。"],["ずんだもん","符号をマイナスにしないように気をつけるのだ。売価のほうが大きいので、プラスなのだ。"],["ずんだもん","利益剰余金は、P社の140,000に、S社の矢印の上を2年分の24,000足して、のれん2年分の1,600を引くのだ。"],["ずんだもん","T社の分は、X2年度と同じ2,000に、当期の上の2,400を足して、のれんの1,440を引くのだ。"],["めたん","そこから個別の売却益6,000を引いて、159,360になるわ。"],["ずんだもん","非支配株主持分は、S社の合計170,000に、売った後の40%を掛けるのだ。"],["めたん","68,000ね。T社は合計に20%を掛けて11,000だから、足して79,000になるわ。"],["ずんだもん","その通りなのだ。"]],[["ずんだもん","模範解答で全部の欄を確かめるのだ。"],["めたん","第1問は、ウ、エ、イ、アの順ね。"],["ずんだもん","第2問は、X1年度に関連会社株式12,000があって、X2年度から0になっているのだ。"],["めたん","のれんは、T社が連結に入ったX2年度に大きく増えているわ。"],["ずんだもん","資本剰余金はX3年度だけ52,000なのだ。一部売却の分なのだ。"],["めたん","最後に、資産の合計と、負債と純資産の合計が合うかを確かめるのね。"],["ずんだもん","そうなのだ。3年とも合っているのだ。"]],[["ずんだもん","まとめなのだ。第1問は、正しいものを1つ選ぶ問題が4つだったのだ。"],["めたん","間違いの選択肢は、1語だけ入れ替えてあったわね。低い方、すべて、損失、資本剰余金のような所よ。"],["ずんだもん","原価回収基準は、費用を回収することが見込まれるときなのだ。"],["めたん","回収可能価額は、使用価値と正味売却価額の高い方ね。"],["ずんだもん","親会社と子会社の事業分離で出た移転損益は、連結で消すのだ。"]],[["ずんだもん","第2問は、会社ごとのタイムテーブルが全部の出発点だったのだ。"],["めたん","持分法の間は、のれんがT社株式の中に入ったままなのね。"],["ずんだもん","段階取得は、元の20%をオール時価に直して、差を利益にするのだ。"],["めたん","のれんは、元の分の時価と追加分を足した56,000から出すのね。"],["ずんだもん","一部売却の差は資本剰余金で、個別の売却益は消すのだ。"],["めたん","非支配株主持分は、売った後の比率で掛けるのも忘れないようにするわ。"],["ずんだもん","これで168回の会計学は全部なのだ。お疲れさまなのだ。"]]],"shorts":[{"hl":"原価回収基準は/[回収が見込まれる]とき","at":26.32,"blob":"5c564d77f3cb62d4e9c42886992e175a"},{"hl":"回収可能価額は/[高い方]","at":129.71,"blob":"98f60c47c9f847218b6931288c6c2a50"},{"hl":"持分法ののれんは/[株式の中]","at":474.23,"blob":"644d2a4e01eef0c8e72819448f388cc6"},{"hl":"元の20%は/[時価で買い直す]","at":580.13,"blob":"93cac63f414493768a83e362a0895896"},{"hl":"親戚への売却は/[資本剰余金]","at":800.04,"blob":"39ef025dc7ba7029e1881bd08dc86b13"}]},{"kind":"exam","no":"168回","sub":"過去問","ch":168,"probs":[],"hl":"[材料副費]から/[操業度差異]まで","acct":"過去問","id":"x168-ko","title":"工業簿記","sn":"工簿","w":0.0,"wt":[],"video":{"blob":"62464eb6bb179505787566c62b8e278a","secs":1181.46,"mb":14.1},"scenes":[[0,"工業簿記の全体像"],[42.56,"問1①：材料の購入原価と外部副費"],[143.5,"問1③：材料副費差異"],[208.08,"原料Aの払出し：先入先出法"],[293.49,"補助材料BとC：継続記録法と棚卸計算法"],[361.22,"問1②④：予定価格での消費と消費価格差異"],[454.75,"問1⑤：棚卸減耗損と材料の勘定連絡図"],[519.62,"問1の答え：5つの仕訳"],[553.34,"問2：直接工の支払賃金と割増賃金"],[620.8,"当月末未払と要支払額"],[678.45,"勤務時間の内訳"],[725.33,"予定賃率での消費と賃率差異"],[776.41,"間接工と事務員の給料"],[816.13,"問2の答え：賃金・給料勘定"],[857.55,"外注加工賃は直接経費"],[909.89,"製造間接費の実際発生額"],[941.76,"予定配賦率と予定配賦額"],[987.11,"問3：予算差異と操業度差異"],[1072.89,"問4：製品ごとの当月製造費用"],[1118.5,"まとめ：材料"],[1147.14,"まとめ：労務費と製造間接費"]],"script":[[["ずんだもん","今回は、168回の工業簿記を、最初から最後まで解くのだ。"],["めたん","工業簿記は、大きな問題が1つだけね。"],["ずんだもん","ニッショウ製作所の福井工場で、製品Xと製品Yを作っているのだ。"],["ずんだもん","テーマは費目別原価計算なのだ。材料費、労務費、経費を、それぞれ集めていく問題なのだ。"],["めたん","費目別、部門別、製品別と進むうちの、最初の段階よね。"],["ずんだもん","そうなのだ。問1は材料の仕訳が5つ、問2は賃金・給料勘定、問3は製造間接費の差異分析、問4は製品ごとの当月製造費用なのだ。"],["めたん","問1の仕訳だけで、10点もあるわ。"],["ずんだもん","材料が一番重いのだ。そして問4は、問1から問3の結果を全部使って足し上げるのだ。"],["めたん","前の問題を間違えると、問4まで崩れるのね。"],["ずんだもん","だから1つずつ、下書きで確かめながら進むのだ。まずは材料の買い入れからなのだ。"]],[["ずんだもん","問1の①は、材料の購入の仕訳なのだ。"],["めたん","資料1の⑴に、購入原価は購入代価に引取費用のみを加算する、とあるわ。"],["ずんだもん","材料を買うときは、本体の代金のほかに、運賃や手数料のような付随費用がかかるのだ。"],["ずんだもん","この付随費用を、材料副費と言うのだ。"],["めたん","材料副費にも、種類があるのよね。"],["ずんだもん","そうなのだ。会社の外に払う外部副費と、社内でかかる内部副費の2つなのだ。"],["ずんだもん","外部副費は、別名を引取費用と言うのだ。必ず足すのは5つしかないのだ。"],["めたん","5つも覚えるのは大変そうね。"],["ずんだもん","「買入の他に引取」という語呂で覚えるのだ。"],["ずんだもん","買入が買入手数料、ほが保険料、かが関税、にが荷役費、引取が引取運賃なのだ。"],["めたん","どれも、この材料を買ったから払った、と言えるものばかりね。"],["ずんだもん","その通りなのだ。材料との対応関係が明確だから、必ず購入原価に足すのだ。"],["めたん","じゃあ、この問題の外部副費は、引取運賃と買入手数料と保険料の3つになるわ。"],["ずんだもん","そうなのだ。それ以外の、購入事務費と保管費と検収費は内部副費なのだ。"],["ずんだもん","⑵に、購入原価に加算しない材料副費は間接経費とする、とあるのだ。内部副費は、製造間接費へ行くのだ。"],["めたん","次は購入代価ね。4日、10日、16日に買っているわ。"],["ずんだもん","4回の買い入れを、それぞれ数量×単価にして全部足すのだ。"],["ずんだもん","購入代価の合計は、5,640,600なのだ。"],["めたん","引取費用は、実際の額を足すんじゃないのね。購入代価の15%を予定配賦する、とあるわ。"],["ずんだもん","予定配賦は、あらかじめ決めた率で、先に足しておくやり方なのだ。"],["めたん","なんで実際の額を使わないの？"],["ずんだもん","細かい付随費用を、届くたびに集めて足すのは面倒なのだ。だから、ざっと15%と予定して先に入れるのだ。"],["ずんだもん","5,640,600の15%で、846,090なのだ。"],["めたん","購入代価に足すと、6,486,690になるわ。"],["ずんだもん","その通りなのだ。仕訳は、借方が材料、貸方が買掛金と材料副費なのだ。"],["めたん","貸方の材料副費846,090は、予定で入れた分ね。"],["ずんだもん","そうなのだ。これで①の欄が埋まったのだ。"]],[["ずんだもん","次は③の、材料副費差異なのだ。①の続きなので、先に片付けるのだ。"],["めたん","予定で入れたなら、実際の額とずれるわよね。"],["ずんだもん","そうなのだ。先に予定で入れて、後から実際とぶつけて、差を差異にするのだ。"],["ずんだもん","材料勘定の1つ手前に、材料副費勘定を書くのだ。"],["めたん","右に予定の846,090、左に実際の額を書くのね。"],["ずんだもん","外部副費の実際は、引取運賃と買入手数料と保険料を足した額なのだ。"],["めたん","足すと830,920になるわ。"],["ずんだもん","予定の846,090より、実際が15,170少ないのだ。"],["めたん","思ったより安く済んだのね。"],["ずんだもん","その通りなのだ。コストが浮いたので、有利差異なのだ。答案の言い方では貸方差異なのだ。"],["めたん","仕訳は、どっちの向きになるの？"],["ずんだもん","材料副費勘定の借方が、15,170足りないのだ。だから借方に材料副費、貸方に材料副費差異なのだ。"],["めたん","差異が貸方に出るから、貸方差異ね。"],["ずんだもん","そうなのだ。借方・貸方は、差異の勘定のどちら側に出るかで言うのだ。"],["めたん","内部副費の590,690はどうなるの？"],["ずんだもん","内部副費は予定配賦していないので、実際の額のまま、製造間接費の間接経費に入るのだ。"],["めたん","材料副費勘定は、出てきてすぐ消える勘定なのね。"],["ずんだもん","一瞬光ってすぐ消える、線香花火みたいな勘定なのだ。これで③が埋まったのだ。"]],[["ずんだもん","次は②の、材料の消費なのだ。まず原料Aの、払い出した量と実際の単価を確かめるのだ。"],["めたん","資料1の⑷が、出入記録ね。"],["ずんだもん","材料のT勘定を書くのだ。中にkg、外に金額を書くのだ。右肩には、先入先出法を表すFIFOと書くのだ。"],["めたん","先入先出法は、先に買った物から先に払い出す、と考えるのよね。"],["ずんだもん","そうなのだ。左には、月初の在庫と、4日と16日に買った分を、古い順に上から並べるのだ。"],["めたん","4日の単価は、440円に15%の引取費用を足して、506円ね。"],["ずんだもん","その通りなのだ。購入原価の単価には、予定配賦した引取費用も入るのだ。"],["めたん","16日の分は、430円の1.15倍で、494.5円になるわ。"],["ずんだもん","右には払い出した量を書くのだ。"],["めたん","製品Xに7日と24日、製品Yに11日、払い出しているわ。"],["ずんだもん","XとYの分を足して、払出は10,600kgなのだ。"],["めたん","帳簿の上では、いくら残っているはずかしら。"],["ずんだもん","受け入れた11,900kgから10,600kgを引いて、1,300kgなのだ。"],["めたん","でも、実地棚卸は1,240kgしかないわ。"],["ずんだもん","差の60kgが棚卸減耗なのだ。継続記録法だから、減耗が差額で出てくるのだ。"],["めたん","残っている1,300kgは、全部16日に買った物ね。"],["ずんだもん","そうなのだ。先入先出法だと、最後まで残るのは一番新しい16日の分なのだ。"],["ずんだもん","だから棚卸減耗も月末の在庫も、494.5円で測るのだ。"],["めたん","左の合計から棚減と月末を引けば、払い出した分の実際の額になるわね。"],["ずんだもん","その通りなのだ。払出の実際の額は、5,300,350なのだ。"],["めたん","左右の合計は、どっちも5,943,200になるわ。"],["ずんだもん","検算もぴったりなのだ。"]],[["ずんだもん","補助材料のBとCも、払い出した量を出すのだ。"],["めたん","⑷に、原料Aと補助材料Bは継続記録法、補助材料Cは棚卸計算法、とあるわ。"],["ずんだもん","継続記録法は、几帳面な人のやり方なのだ。払い出すたびに、何に何本使ったかを記録するのだ。"],["ずんだもん","棚卸計算法は、ざっくりした人のやり方なのだ。払出は記録せず、月末に残りを数えて、差額で使った量を出すのだ。"],["めたん","違いは、差額で何が出るかね。"],["ずんだもん","そうなのだ。継続記録法では差額で棚卸減耗が出て、棚卸計算法では差額で消費量が出るのだ。"],["めたん","Bは、月初と購入で830本あって、払い出したのが770本ね。"],["ずんだもん","帳簿の残りは60本なのだ。実地も60本なので、Bには減耗が無いのだ。"],["めたん","Cは9,150個あって、残りが850個ね。"],["ずんだもん","差額の8,300個を、使った量とみなすのだ。"],["めたん","でもそれだと、本当に減耗が無かったのか分からないわ。"],["ずんだもん","その通りなのだ。棚卸計算法は楽な代わりに、減耗が消費量にまぎれてしまうのだ。"],["ずんだもん","量が出たら、予定価格を掛けるのだ。Bは860円×770本で、662,200なのだ。"],["めたん","Cは65円×8,300個で、539,500ね。"],["ずんだもん","BもCも補助材料なので、製品には直接つかないのだ。"],["めたん","間接材料費として、製造間接費へ行くのね。"],["ずんだもん","そうなのだ。2つ合わせて1,201,700なのだ。"]],[["ずんだもん","いよいよ②の消費と、④の消費価格差異なのだ。"],["めたん","資料1の⑹に、消費価格は予定価格で計算する、とあるわ。原料Aは480円ね。"],["ずんだもん","予定価格は、あらかじめ決めておいた、1kgあたりの値段なのだ。"],["めたん","なんで実際の単価を使わないの？"],["ずんだもん","先入先出法で実際の単価を出すのは、手間も時間もかかるのだ。予定なら、払い出した時点ですぐ計算できるのだ。"],["ずんだもん","もう1つ、単価のぶれが製品の原価に入らないので、月ごとに比べやすくなるのだ。"],["めたん","計算の迅速化と、比較可能性のことね。"],["ずんだもん","そうなのだ。原料Aは480円×10,600kgで、5,088,000なのだ。全部が製品のための直接材料費なので、仕掛品へ行くのだ。"],["めたん","補助材料の1,201,700は、製造間接費ね。"],["ずんだもん","その通りなのだ。②の仕訳は、借方に仕掛品と製造間接費、貸方に材料なのだ。"],["めたん","貸方の材料は、2つを足して6,289,700になるわ。"],["ずんだもん","次は④なのだ。先に予定で出しておいて、後から実際を集めて、差を差異にするのだ。"],["めたん","原料Aは、予定が5,088,000で、実際が5,300,350だったわね。"],["ずんだもん","実際の方が、212,350多いのだ。"],["めたん","BとCも、同じように予定と実際を比べるのね。"],["ずんだもん","Bは24,810、Cは16,295、どちらも実際の方が多いのだ。"],["めたん","Cの実際の額は、記録が無いのにどうやって出したのかしら。"],["ずんだもん","月末の850個を、10日に買った単価で測るのだ。代価58円に15%を足した、66.7円なのだ。"],["ずんだもん","月初と購入の合計から月末を引いて、Cの実際の消費額は555,795なのだ。"],["めたん","3つ合わせると、実際の方が253,455多くなるわ。"],["ずんだもん","その通りなのだ。思ったよりコストがかかったので、不利差異、借方差異なのだ。"],["ずんだもん","④の仕訳は、借方が消費価格差異、貸方が材料で、253,455なのだ。"]],[["ずんだもん","最後は⑤の、棚卸減耗損なのだ。"],["めたん","原料Aの60kgね。⑸に、棚卸減耗はすべて正常な理由とあるわ。"],["ずんだもん","正常な棚卸減耗は、製造間接費の間接経費になるのだ。"],["めたん","材料がなくなったんだから、間接材料費になりそうだけど。"],["ずんだもん","そこはよく間違えるのだ。物を使えば材料費、人を使えば労務費なのだ。"],["ずんだもん","減耗した材料は、ベルトコンベアに入っていないのだ。物でも人でもないので、消去法で経費なのだ。"],["めたん","しかも、どの製品のために減ったのかも分からないから、間接経費ね。"],["ずんだもん","その通りなのだ。"],["めたん","金額は、60kgに予定の480円を掛ければいいのかしら。"],["ずんだもん","ここが要注意なのだ！予定価格で測るのは、払い出した分だけなのだ。"],["ずんだもん","減耗と月末の在庫は、実際の単価で測るのだ。16日の494.5円を掛けて、29,670なのだ。"],["めたん","⑤の仕訳は、借方が製造間接費、貸方が材料で、29,670ね。"],["ずんだもん","そうなのだ。これで、材料勘定の全体が書けるのだ。"],["めたん","左は、前月繰越も当月購入も、実際の額ね。"],["ずんだもん","右は、上の直接材料費と補助材料の所だけが予定なのだ。その下に、消費価格差異と棚卸減耗損と月末が並ぶのだ。"],["めたん","予定の部分のほかは、全部実際で測っているのね。"],["ずんだもん","だから実際と予定の差が、消費価格差異として、貸借差額で出てくるのだ。"]],[["ずんだもん","問1の5つの仕訳を、模範解答で確かめるのだ。"],["めたん","①の購入は、材料の借方に、予定配賦した引取費用まで入っているわ。"],["ずんだもん","②の消費は、直接材料が仕掛品、補助材料が製造間接費なのだ。"],["めたん","③の材料副費差異は、借方が材料副費ね。"],["ずんだもん","そうなのだ。予定より実際が少なかったので、貸方差異なのだ。"],["めたん","④の消費価格差異は、逆に借方に出ているわ。"],["ずんだもん","予定より実際が多かったからなのだ。⑤の棚卸減耗損は、製造間接費へ行くのだ。"],["めたん","材料だけで、差異が2か所から出てくるのね。"],["ずんだもん","その通りなのだ。買うときの材料副費差異と、使うときの消費価格差異なのだ。混ぜないように、下書きで場所を分けておくのだ。"]],[["ずんだもん","次は問2の、賃金・給料勘定なのだ。まず直接工の賃金から作るのだ。"],["めたん","資料2の⑴に、毎月20日に給与計算を締め切る、とあるわ。"],["ずんだもん","給料日に払うのは、前月21日から当月20日までの分なのだ。月の1日から末日とは、ずれているのだ。"],["めたん","⑵の支払賃率は、1,400円ね。"],["ずんだもん","支払賃率は、簡単に言えば時給のことなのだ。"],["めたん","前月21日から当月20日の勤務時間は、1,290時間ね。"],["ずんだもん","でも、その中には休憩時間の150時間が入っているのだ。休憩には時給が出ないのだ。"],["めたん","時給が出るのは、休憩を引いた1,140時間になるわ。"],["ずんだもん","そうなのだ。この時給が出る時間を、就業時間と言うのだ。"],["ずんだもん","基本給は、1,400円×1,140時間で、1,596,000なのだ。"],["めたん","時間外作業手当もあるわ。支払賃率の25%で、1時間350円ね。"],["ずんだもん","残業手当は、作業に関係する手当なので、加給金として支払賃金に入れるのだ。"],["めたん","家族手当や通勤手当とは、扱いが違うのね。"],["ずんだもん","そうなのだ。そういう諸手当は作業と関係ないので、賃金には入れないのだ。"],["ずんだもん","時間外は110時間なので、割増は350円×110時間で、38,500なのだ。"],["めたん","基本給と割増を足して、支払賃金は1,634,500になるわ。"],["ずんだもん","その通りなのだ。これが、直接工の当月の支払額なのだ。"]],[["ずんだもん","次は、給与計算期間と原価計算期間のずれを直すのだ。"],["めたん","支払った1,634,500は、前月21日から当月20日の分だったわね。"
