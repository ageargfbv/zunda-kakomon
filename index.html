@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0f130d;
    --surface: #171c14;
    --chip: #232a1f;
    --chip-on: #eef3e8;
    --chip-on-ink: #0f130d;
    --ink: #eef3e8;
    --muted: #9aa692;
    --line: #283024;
    --accent: #8fd17a;
    --accent-soft: #1f2c1a;
    --stage: #000000;
    --sheet: #1b2118;
    --scrim: rgba(0, 0, 0, .6);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f130d;
  --surface: #171c14;
  --chip: #232a1f;
  --chip-on: #eef3e8;
  --chip-on-ink: #0f130d;
  --ink: #eef3e8;
  --muted: #9aa692;
  --line: #283024;
  --accent: #8fd17a;
  --accent-soft: #1f2c1a;
  --stage: #000000;
  --sheet: #1b2118;
  --scrim: rgba(0, 0, 0, .6);
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "M PLUS 1p", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
  font-size: 15px;
  line-height: 1.5;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
input { font-size: 16px; font-family: inherit; }
.app { max-width: 520px; margin-inline: auto; min-height: 100%; padding-bottom: calc(var(--navh) + 6px + var(--navpad)); }

/* 上の帯 */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg);
  display: flex; align-items: center; gap: 10px;
  padding: 10px 16px 8px;
}
.logo { display: flex; align-items: center; gap: 8px; font-family: "Dela Gothic One", "M PLUS 1p", sans-serif; font-size: 21px; letter-spacing: .02em; }
.logo i { width: 34px; height: 24px; border-radius: 7px; background: var(--accent); display: grid; place-items: center; }
.logo i::after { content: ""; border-left: 10px solid #fff; border-top: 6px solid transparent; border-bottom: 6px solid transparent; margin-left: 3px; }
.top h1 { font-size: 22px; font-weight: 800; margin: 0; }

/* チップ */
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 4px 16px 12px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; background: var(--chip); border-radius: 9px; padding: 6px 14px; font-weight: 500; font-size: 14px; white-space: nowrap; }
.chip[aria-pressed="true"] { background: var(--chip-on); color: var(--chip-on-ink); }
.chip .n { font-variant-numeric: tabular-nums; opacity: .7; margin-left: 4px; font-size: 12px; }

/* サムネイル */
.th {
  position: relative; container-type: inline-size;
  aspect-ratio: 16 / 9; width: 100%; max-width: 100%; overflow: hidden;
  color: #fff; display: flex; flex-direction: column; justify-content: center;
  padding: 7cqw 6cqw 8cqw;
}

10.17,"返品権付き販売：売上高を減らす"],[139.37,"返品権付き販売：原価率を出す"],[224.63,"返品権付き販売：返品資産と売上原価"],[265.77,"ソフトウェア開発：問題文を読む"],[327.94,"ソフトウェア開発：Y社"],[402.81,"ソフトウェア開発：Z社"],[446.55,"ソフトウェア開発：受注損失引当金"],[511.74,"ソフトウェア開発：契約資産・契約負債と答え"]],"shorts":[{"hl":"[返品資産]は/売値ではなく原価で","at":53.83,"blob":"f5d7e893320d1f520013e90cebb68d21"},{"hl":"引当金は/[来期以降]の損失だけ","at":446.55,"blob":"95ca884c2ee4281df51429124bd338fd"},{"hl":"お金が先か/[作業]が先か","at":511.74,"blob":"bb4723ea072a0de849dd6a6a82bd9e3b"}],"script":[[["ずんだもん","今回は、164回の商業簿記を、最初から最後まで解くのだ。"],["めたん","まずは、何を答える問題かしら。"],["ずんだもん","問1は、損益計算書を作ることなのだ。"],["ずんだもん","問2は、貸借対照表の5つの科目の金額を答えるのだ。"],["めたん","材料は資料1と資料2ね。2は未処理事項と決算整理事項。"],["ずんだもん","そうなのだ。資料1は、決算整理前残高試算表なのだ。"],["めたん","決算整理前残高試算表って、ずいぶん長い名前ね。"],["ずんだもん","決算の修正をする前の、各科目の残高の一覧なのだ。前T/Bと呼ぶのだ。"],["めたん","じゃあ、資料2の順に前T/Bを直していけばいいのね。"],["ずんだもん","その通りなのだ。1番から順に処理して、前T/Bの数字を直していくのだ。"],["ずんだもん","直した後の数字を、損益計算書と貸借対照表に書き写すのだ。"],["めたん","金額の単位は全部千円ね。毎回言ってたら長くなるわ。"],["ずんだもん","だから話すときは、千円を省いて数字だけ言うのだ。"],["めたん","本人の点数も、先に聞いておきたいわ。"],["ずんだもん","25点中6点なのだ。退職給付費用、2つの減価償却費、ソフトウェア償却費が合っていたのだ。"],["ずんだもん","合っていた所も、解き方が合っていたか、一緒に確かめるのだ。"]],[["ずんだもん","最初は資料2の1番、返品権付き販売なのだ。"],["ずんだもん","ここを解くと、解答用紙の3つの欄が埋まるのだ。"],["めたん","3つも？どこかしら。"],["ずんだもん","損益計算書の、売上高の商品販売と、売上原価の商品販売なのだ。"],["ずんだもん","それと、問2の返品資産なのだ。"],["めたん","問題文には、売ってから1か月以内なら、返品されたら全額返金する、ってあるわ。"],["ずんだもん","そこが出発点なのだ。この1か月以内というのが、あとで効いてくるのだ。"],["めたん","ただの条件にしか見えないけど。"],["ずんだもん","この会社の決算日は、3月31日なのだ。"],["ずんだもん","2月までに売った商品は、もう1か月たったから、返品されないのだ。"],["めたん","じゃあ、まだ返ってくるかもしれないのは、3月に売った分だけね。"],["ずんだもん","その通りなのだ。4月に入ってから返ってくるかもしれないのだ。"],["めたん","それで、3月中の販売金額100,000が出てくるのね。"],["ずんだもん","そうなのだ。この100,000は、3月に売った商品の、売値の合計なのだ。"],["ずんだもん","しかも、もう前T/Bの売上高820,000の中に入っているのだ。"],["めたん","そのうち10%が、4月に返ってきそうなのよね。"],["ずんだもん","そうなのだ。この場面でやることは2つなのだ。"],["ずんだもん","返ってくる分を売上高から減らすことと、返ってくる商品を資産にすることなのだ。"]],[["めたん","まず返ってくる分の売値ね。100,000の10%で、10,000。"],["ずんだもん","その通りなのだ。"],["めたん","返されると分かってる分を、売上のままにしておくのは変よね。"],["ずんだもん","そうなのだ。だから、その10,000を売上高から減らすのだ。"],["めたん","減らした分は、どこへ行くのかしら。"],["ずんだもん","返金負債にするのだ。お客さんにお金を返す義務だから、負債なのだ。"],["めたん","仕訳は、借方が売上高10,000、貸方が返金負債10,000ね。"],["ずんだもん","完璧なのだ。"],["めたん","売上高の欄は、820,000−10,000で、810,000。"],["ずんだもん","その通りなのだ。解答用紙の、売上高の商品販売の欄は、810,000なのだ。"]],[["めたん","次は、返ってくる商品の方ね。"],["ずんだもん","そうなのだ。返品されると、商品が手元に戻ってくるのだ。"],["めたん","戻ってくる商品は、財産になるのね。"],["ずんだもん","そうなのだ。これを返品資産として計上するのだ。"],["めたん","金額は、さっきの10,000でいいでしょ。"],["ずんだもん","違うのだ。10,000は売値なのだ。商品は、仕入れた値段で数えるのだ。"],["めたん","でも、その商品をいくらで仕入れたかは、どこにも書いてないわよ。"],["ずんだもん","そうなのだ。だから問題文は、当期の原価率で見積もれ、と言っているのだ。"],["めたん","原価率って何？"],["ずんだもん","売値のうち、仕入れの値段が何割かという割合なのだ。"],["めたん","それが分かれば、売値10,000から仕入れの値段を逆算できるわけね。"],["ずんだもん","そうなのだ。原価率は、当期の売上原価を、当期の売上高で割って出すのだ。"],["めたん","でも、売上原価は前T/Bに載ってないわよ。"],["ずんだもん","この会社は三分法だから、自分で出すのだ。"],["めたん","三分法だと、なんで自分で出すの？"],["ずんだもん","三分法では、買ったときは仕入、期首の在庫は繰越商品に、分けて置いてあるだけなのだ。"],["ずんだもん","だから決算で、期首の在庫と仕入を足して、期末の在庫を引くのだ。"],["めたん","期首の在庫は、前T/Bの繰越商品60,000ね。"],["ずんだもん","そうなのだ。決算の前だから、まだ期首の在庫のままなのだ。"],["ずんだもん","仕入は、前T/Bの仕入高、661,000なのだ。"],["めたん","期末の在庫は、問題文に書いてある65,000ね。"],["ずんだもん","材料はそろったのだ。60,000＋661,000−65,000を計算するのだ。"],["めたん","656,000。これが売上原価ね。"],["ずんだもん","その通りなのだ。"],["めたん","あとは、さっき直した売上高810,000で割ればいいのね。"],["ずんだもん","そこは、返品を引く前の820,000で割るのだ。"],["ずんだもん","656,000は、返品を考える前の売上に対応する原価だからなのだ。分子と分母をそろえるのだ。"],["めたん","656,000÷820,000で、原価率は80%ね。"],["ずんだもん","その通りなのだ。"]],[["めたん","原価率が出たから、返品資産も出せるわね。10,000×80%で、8,000。"],["ずんだもん","その通りなのだ。戻ってくる商品を、仕入れの値段で数えたのだ。"],["ずんだもん","仕訳は、借方が返品資産8,000、貸方が売上原価8,000なのだ。"],["めたん","なんで売上原価を減らすの？"],["ずんだもん","戻ってくる商品は、売れなかったのと同じだからなのだ。"],["ずんだもん","売上高を10,000減らしたから、それに対応する原価も8,000減らすのだ。"],["めたん","売上と原価が、セットで戻るってことね。"],["めたん","じゃあ売上原価の欄は、656,000−8,000で、648,000。"],["ずんだもん","その通りなのだ。ここでまとめるのだ。"],["ずんだもん","解答用紙の、売上高の商品販売は810,000なのだ。"],["ずんだもん","売上原価の商品販売は648,000なのだ。"],["ずんだもん","問2の返品資産は8,000なのだ。"],["ずんだもん","返金負債の10,000は、あとの貸倒引当金の場面で、もう一度使うのだ。"]],[["ずんだもん","次は資料2の2番、ソフトウェア開発なのだ。"],["ずんだもん","ここで埋まるのは、売上高と売上原価の、ソフトウェア開発の欄なのだ。"],["ずんだもん","それと、問2の受注損失引当金なのだ。"],["めたん","問題文には、収益は履行義務が充足されるにつれて計上する、ってあるわね。"],["ずんだもん","完成したときに、まとめて売上にするのではないのだ。"],["ずんだもん","作業が進んだ分だけ、売上にするのだ。"],["めたん","進んだ分なんて、どうやって測るのよ。"],["ずんだもん","発生した原価に基づくインプット法、と書いてあるのだ。"],["ずんだもん","かかると見積もった原価の全体のうち、もう使った原価が何割か、で進み具合を測るのだ。"],["めたん","それが進捗度ね。発生原価の累計を、見積総原価で割るわけね。"],["ずんだもん","その通りなのだ。"],["めたん","表には、X社、Y社、Z社の3つが載ってるわ。全部計算するのかしら。"],["ずんだもん","まず、どれを処理するか決めるのだ。"],["ずんだもん","問題文に、前T/Bの売上高と売上原価は、当期中に全部終わった案件の当期分だ、と書いてあるのだ。"],["めたん","当期中に全部終わった案件って、どれ？"],["ずんだもん","完成年月を見るのだ。X社は、当期の10月に完成しているのだ。"],["ずんだもん","だからX社の当期分は、もう前T/Bに入っているのだ。何もしなくていいのだ。"],["めたん","Y社は来期の4月、Z社は再来期の3月に完成ね。"],["ずんだもん","そうなのだ。まだ途中だから、当期分を自分で計上するのだ。"]],[["ずんだもん","Y社から計算するのだ。まず、当期末までの進捗度を出すのだ。"],["めたん","当期末までの発生原価の累計が30,000、見積総原価が36,000ね。"],["ずんだもん","30,000÷36,000で、進捗度は6分の5、約83%なのだ。"],["めたん","取引価格45,000×6分の5で、37,500。これが当期の売上ね。"],["ずんだもん","惜しいのだ。これは、着手してから当期末までの、売上の累計なのだ。"],["ずんだもん","Y社は前の期に着手しているのだ。前の期にも、進んだ分の売上を計上済みなのだ。"],["めたん","じゃあ、前期の分を引かないといけないのね。"],["めたん","でも前期の売上は、どこにも書いてないわよ。"],["ずんだもん","自分で出すのだ。表に、前期末までの発生原価の累計6,000が載っているのだ。"],["めたん","前期末の進捗度は、6,000÷36,000で、6分の1ね。"],["めたん","あれ、見積総原価は前期も36,000でいいのかしら。"],["ずんだもん","いいのだ。Y社の見積りが変わったとは書いてないからなのだ。"],["ずんだもん","前期の売上は、45,000×6分の1で、7,500なのだ。"],["めたん","当期の売上は、37,500−7,500で、30,000ね。"],["ずんだもん","その通りなのだ。原価の方も、当期に発生した分だけを出すのだ。"],["めたん","累計30,000から前期の6,000を引いて、24,000。"],["めたん","でも、なんで原価まで引くの？"],["ずんだもん","前期の6,000は、前期の売上原価になっているからなのだ。"],["めたん","当期の24,000は、今どこにあるのかしら。"],["ずんだもん","仕掛品に貯まっているのだ。前T/Bの仕掛品36,600は、Y社の24,000と、Z社の12,600の合計なのだ。"],["ずんだもん","だから、仕掛品から売上原価に24,000を振り替えるのだ。"]],[["めたん","次はZ社ね。Y社と同じ手順でいいのかしら。"],["ずんだもん","2つ違うのだ。Z社は当期に着手したから、前期の分がないのだ。"],["ずんだもん","それと、見積総原価が途中で変わっているのだ。"],["めたん","問題文には、当初は45,000の見積りだったけど、52,500になると分かった、ってあるわ。"],["ずんだもん","当期末までに、見積りが増えたのだ。"],["めたん","進捗度は、最初の45,000で割るのよね。"],["ずんだもん","違うのだ。新しい見積りの52,500で割るのだ。当期末の時点で、一番正しい見積りだからなのだ。"],["めたん","発生原価は12,600だから、12,600÷52,500で、24%ね。"],["ずんだもん","その通りなのだ。取引価格48,000に24%をかけて、当期の売上は11,520なのだ。"],["めたん","原価は、前期の分がないから、当期に発生した12,600そのままね。"],["ずんだもん","そうなのだ。12,600を、仕掛品から売上原価に振り替えるのだ。"]],[["めたん","ちょっと待って。Z社は、売上11,520より原価12,600の方が大きいわ。"],["ずんだもん","そうなのだ。見積総原価52,500が、取引価格48,000を超えたからなのだ。"],["めたん","つまり、この仕事は全体で赤字なのね。"],["ずんだもん","そうなのだ。全体の損失は、52,500−48,000で、4,500なのだ。"],["めたん","問題文には、必要な受注損失引当金を計上しろ、ってあるわね。"],["ずんだもん","来期以降に出ると分かっている損失を、今期のうちに費用にしておく引当金なのだ。"],["めたん","じゃあ、4,500を全部引き当てればいいのね。"],["ずんだもん","全部ではないのだ。当期の分の損失は、もう出ているからなのだ。"],["めたん","当期の分は、売上11,520と原価12,600の差で、1,080ね。"],["ずんだもん","その通りなのだ。4,500−1,080で、3,420。これが来期以降の損失なのだ。"],["ずんだもん","解説では、来期以降の売上と、来期以降の原価の差でも出しているのだ。"],["めたん","来期以降の売上は、48,000−11,520で36,480ね。"],["ずんだもん","来期以降の原価は、52,500−12,600で39,900なのだ。差はやっぱり3,420なのだ。"],["めたん","どっちから出しても同じね。あとは繰入額の置き場所ね。"],["ずんだもん","問題文に、売上原価に含める、と書いてあるのだ。"],["ずんだもん","だから、売上原価のソフトウェア開発に、3,420を足すのだ。"]],[["めたん","売上を立てたときの、相手の科目は何？"],["ずんだもん","お金を先にもらっているか、まだもらっていないかで、分けるのだ。"],["ずんだもん","先にお金をもらって、まだ作業していない分は、契約負債なのだ。"],["めたん","逆に、作業はしたけどお金がまだなら、契約資産ね。"],["ずんだもん","その通りなのだ。"],["めたん","前T/Bに、契約負債19,500があるわね。"],["ずんだもん","これは、Y社とZ社から、先にもらったお金なのだ。"],["めたん","内訳が知りたいわ。"],["ずんだもん","Y社は、入金18,000のうち、前期の売上7,500にもう使った残りの、10,500なのだ。"],["ずんだもん","Z社は、入金9,000がまるごと残っているのだ。10,500＋9,000で、19,500なのだ。"],["めたん","前T/Bの数字と合うわね。"],["ずんだもん","そうなのだ。さっき自分で出した前期の売上7,500が、正しいことの確かめにもなるのだ。"],["めたん","Y社の当期の売上30,000は、どう仕訳するのかしら。"],["ずんだもん","まず、先にもらっている契約負債10,500を取り崩して、売上に回すのだ。"],["ずんだもん","足りない19,500は、まだお金をもらっていないから、契約資産なのだ。"],["めたん","Z社の11,520も同じね。契約負債9,000を取り崩して、足りない2,520が契約資産。"],["ずんだもん","完璧なのだ。"],["ずんだもん","次は、売上高のソフトウェア開発の欄なのだ。"],["ずんだもん","前T/Bの22,500に、Y社の30,000と、Z社の11,520を足すのだ。"],["めたん","前T/Bの22,500は、X社の当期分ね。"],["ずんだもん","そうなのだ。問題文に、前T/Bに入っていると書いてあったのだ。"],["ずんだもん","22,500＋30,000＋11,520で、64,020なのだ。"],["めたん","売上原価も、前T/Bの19,200に足していく形ね。"],["ずんだもん","Y社の24,000、Z社の12,600、引当金の3,420を足すのだ。"],["ずんだもん","合計で59,220なのだ。"],["ずんだもん","解答用紙の、売上高のソフトウェア開発は64,020なのだ。"],["ずんだもん","売上原価のソフトウェア開発は59,220なのだ。"],["ずんだもん","問2の受注損失引当金は、3,420なのだ。"],["ずんだもん","契約資産の19,500と2,520は、次の貸倒引当金で使うのだ。"]]],"drops":[{"prob":"売上高・売上原価（商品販売／ソフトウェア開発）","at":"2026-09-27","kind":"none","pair":null,"what":"収益認識（返金負債・工事進行基準に近い進捗度計算）が手つかず","n":0,"vs":"","seek":53.83}]},{"kind":"exam","no":"164回","sub":"過去問","ch":164,"probs":[],"hl":"[返品権付き]から/[税効果]まで","acct":"過去問","id":"x164-bo-2","title":"商業簿記 後編","sn":"商簿後","w":2.808,"wt":["収益認識（返金負債・工事進行基準に近い進捗度計算）が手つかず","外貨建有価証券の完成計算で、前T/Bへの足し戻しを忘れる","税効果会計・法人税等の計算が手つかず","有形固定資産の保有目的変更と減損が手つかず"],"video":{"blob":"648723f656d7f35b44bc875fe63b44f5","secs":1106.41,"mb":13.2},"scenes":[[0.0,"貸倒引当金"],[75.22,"減価償却費：建物甲と備品"],[156.54,"建物乙と土地：投資不動産への振替"],[216.79,"建物乙と土地：減損"],[350.59,"機械装置と研究開発費"],[417.82,"ソフトウェア償却費"],[491.87,"外貨建て債券：償却原価法"],[563.29,"外貨建て債券：換算替えと答え"],[635.85,"退職給付"],[736.62,"法人税等"],[767.2,"税効果会計"],[897.3,"損益計算書を完成させる"],[992.01,"配当と準備金"],[1071.88,"問2のまとめ"]],"shorts":[{"hl":"[前T／B]に/足すのを忘れない","at":491.87,"blob":"afb65436c79eb6daade08786fe3ede93"},{"hl":"前T／Bの7,000は/[足さない]","at":635.85,"blob":"e3c6276021a5ff3ebc2e5e641060a7e4"},{"hl":"売掛金は/[返金負債]と相殺してから","at":0.0,"blob":"dbe2e3090b2e3c349d6ae7feade340a7"}],"script":[[["ずんだもん","次は資料2の3番、貸倒引当金なのだ。"],["ずんだもん","ここで埋まるのは、販売費及び一般管理費の、貸倒引当金繰入額なのだ。"],["めたん","本人は空欄だったのよね。"],["ずんだもん","そうなのだ。でも、1番と2番が解ければ、すぐ出るのだ。"],["めたん","問題文には、売掛金と契約資産の残高に、1%を差額補充法で設定、ってあるわ。"],["ずんだもん","その2つに、貸倒引当金を設定するのだ。"],["めたん","売掛金は、前T/Bの135,980をそのまま使えばいいわね。"],["ずんだもん","そのままでは使わないのだ。問題文に、返金負債との相殺後、と書いてあるのだ。"],["めたん","どうして相殺するの？"],["ずんだもん","返品されれば、その分の売掛金は、お金を回収しないで消えるからなのだ。"],["めたん","1番の返金負債を引いて、135,980−10,000で、125,980ね。"],["ずんだもん","その通りなのだ。"],["めたん","契約資産は、2番のY社19,500とZ社2,520で、22,020。"],["ずんだもん","そうなのだ。契約資産も、いずれお金をもらう権利だから、貸倒引当金がいるのだ。"],["ずんだもん","125,980＋22,020で148,000、その1%で1,480なのだ。"],["めたん","これが繰入額ね。"],["ずんだもん","違うのだ。差額補充法だから、今ある引当金との差だけを足すのだ。"],["めたん","今ある引当金は、前T/Bの貸倒引当金400ね。"],["ずんだもん","そうなのだ。1,480−400で、繰入額は1,080なのだ。"],["ずんだもん","解答用紙の、貸倒引当金繰入額の欄は1,080なのだ。"],["ずんだもん","引当金の残高1,480は、税効果の場面で、もう一度使うのだ。"]],[["ずんだもん","次は資料2の4番、有形固定資産なのだ。"],["ずんだもん","ここは中身が多いので、3つに分けるのだ。"],["ずんだもん","建物甲と備品、建物乙と土地、それと機械装置なのだ。"],["ずんだもん","最初の建物甲と備品で埋まるのは、販売費及び一般管理費の減価償却費なのだ。"],["めたん","本人は21,500で、正解だったわね。"],["ずんだもん","そうなのだ。解き方を確かめるのだ。"],["ずんだもん","建物甲は、税法上の定額法、耐用年数20年、残存価額0なのだ。"],["めたん","定額法なら、償却率は1÷20で、0.05ね。"],["ずんだもん","その通りなのだ。取得原価250,000にかけて、12,500なのだ。"],["ずんだもん","次は備品なのだ。200%定率法で、償却率は定額法の率の2倍なのだ。"],["めたん","1÷8年が0.125だから、その2倍で0.25ね。"],["ずんだもん","そうなのだ。"],["めたん","あとは取得原価48,000に0.25をかければいいのよね。"],["ずんだもん","定率法は、まだ償却していない帳簿価額にかけるのだ。"],["ずんだもん","取得原価48,000から、前T/Bの備品減価償却累計額12,000を引いた、36,000なのだ。"],["めたん","36,000×0.25で、9,000ね。"],["めたん","改定償却率とか保証率は、使わなくていいのかしら。"],["ずんだもん","確かめるのだ。償却保証額は、取得原価48,000に保証率0.07909をかけて、約3,796なのだ。"],["ずんだもん","普通に計算した9,000の方が大きいから、改定償却率に切り替えなくていいのだ。"],["めたん","建物乙が入ってないけど、いいのかしら。"],["ずんだもん","乙は賃貸用に変えたので、次の場面で別に計算するのだ。"],["ずんだもん","12,500＋9,000で、21,500なのだ。"],["ずんだもん","解答用紙の、販売費及び一般管理費の減価償却費は、21,500なのだ。"]],[["ずんだもん","次は、建物乙と、土地の一部なのだ。"],["ずんだもん","ここで埋まるのは、営業外費用の減価償却費と、特別損失の減損損失なのだ。"],["めたん","本人は、営業外の減価償却費12,000は合っていて、減損は空欄だったのよね。"],["めたん","問題文には、当期首から、土地146,410と建物乙を賃貸目的に変えた、ってあるわ。"],["ずんだもん","賃貸目的に変えると、自分の事業で使う資産ではなくなるのだ。"],["ずんだもん","人に貸して賃料をもらう、投資のための資産になるのだ。"],["めたん","だから、建物と土地から、投資不動産に振り替えるのね。"],["ずんだもん","その通りなのだ。"],["めたん","振り替える金額は？"],["ずんだもん","取得原価で振り替えるのだ。建物乙の180,000と、土地の146,410で、326,410なのだ。"],["めたん","振り替えた後も、建物乙の減価償却は続けるのかしら。"],["ずんだもん","続けるのだ。建物乙は、耐用年数15年の定額法なのだ。"],["めたん","180,000÷15年で、12,000ね。"],["ずんだもん","その通りなのだ。"],["めたん","表示は、今までどおり販管費でいいわよね。"],["ずんだもん","本業の費用ではないので、営業外費用に入れるのだ。"],["ずんだもん","賃料の受取賃貸料が営業外収益なので、それに対応する費用も、営業外なのだ。"],["ずんだもん","解答用紙の、営業外費用の減価償却費は、12,000なのだ。"]],[["めたん","で、ここから減損の話になるのよね。なんで急に減損なの？"],["ずんだもん","問題文の続きに、当期末において減損の兆候が判明し、と書いてあるのだ。"],["めたん","減損の兆候って何？"],["ずんだもん","資産の価値が、帳簿の金額より大きく下がったかもしれない、というサインなのだ。"],["ずんだもん","兆候があるときは、本当に減損しているかを、判定しないといけないのだ。"],["めたん","判定するのは、振り替えた建物乙と土地ね。"],["ずんだもん","そうなのだ。2つをひとまとまりで見るのだ。"],["ずんだもん","キャッシュ・フローの見積りが、この2つをまとめて書いてあるからなのだ。"],["めたん","判定のやり方は？"],["ずんだもん","帳簿価額と、割引前の将来キャッシュ・フローの合計を比べるのだ。"],["ずんだもん","将来キャッシュ・フローの方が小さければ、減損を認識するのだ。"],["めたん","帳簿価額は、投資不動産326,410から減価償却累計額を引くのね。"],["ずんだもん","そうなのだ。建物乙は、4年前の4月に買ったのだ。当期末で、ちょうど4年たっているのだ。"],["めたん","1年12,000の4年分で、48,000ね。"],["ずんだもん","その通りなのだ。当期の12,000も含んでいるのだ。"],["ずんだもん","326,410−48,000で、帳簿価額は278,410なのだ。"],["めたん","将来キャッシュ・フローは？"],["ずんだもん","毎年29,282が、4年間入ってくるのだ。それと、4年後に土地を146,410で処分できるのだ。"],["めたん","建物の処分価額は、見当たらないわね。"],["ずんだもん","そうなのだ。問題文に、処分価額は土地のみ、と書いてあるのだ。"],["ずんだもん","29,282×4年で117,128。146,410を足して、263,538なのだ。"],["めたん","278,410の方が大きいわ。減損ね。"],["ずんだもん","その通りなのだ。帳簿価額を、回収可能価額まで下げるのだ。"],["めたん","回収可能価額って？"],["ずんだもん","売ったらいくらかと、使い続けたらいくらかの、高い方なのだ。"],["ずんだもん","この問題は、使い続けた場合の、使用価値だけが出せるのだ。"],["ずんだもん","使用価値は、将来キャッシュ・フローを、割引率10%で、今の価値に直した合計なのだ。"],["めたん","どうして割り引くの？"],["ずんだもん","来年の29,282は、今の29,282より価値が低いからなのだ。"],["ずんだもん","1年後の分は1.1で割る。2年後の分は1.1を2回かけたもので割る、と続けるのだ。"],["ずんだもん","4年分を割ると、26,620、24,200、22,000、20,000になるのだ。"],["ずんだもん","土地の146,410は、1.1の4乗で割ると、ちょうど100,000なのだ。"],["めたん","全部足すと、使用価値は192,820ね。"],["ずんだもん","その通りなのだ。"],["めたん","減損損失は、278,410−192,820で、85,590。"],["ずんだもん","そうなのだ。表示は特別損失なのだ。"],["ずんだもん","解答用紙の、特別損失の減損損失は、85,590なのだ。"],["ずんだもん","減損損失累計額の85,590は、税効果の場面でまた使うのだ。"]],[["ずんだもん","4番の最後は、機械装置なのだ。"],["ずんだもん","ここで埋まるのは、販売費及び一般管理費の、研究開発費なのだ。"],["めたん","本人は12,000で、正解は32,000だったわね。"],["めたん","問題文には、機械装置はもっぱら新規事業の研究開発に使う目的で買った、ってあるわ。"],["ずんだもん","その研究開発にしか使えない機械は、買ったときに全額を研究開発費にするのだ。"],["めたん","機械なのに、資産にしないの？"],["ずんだもん","研究開発は、将来お金を生むか分からないからなのだ。基準で、費用にすると決まっているのだ。"],["めたん","前T/Bでは、機械装置12,000が資産に載ってるわね。"],["ずんだもん","そうなのだ。だから、機械装置から研究開発費に、12,000を振り替えるのだ。"],["めたん","本人も、ここまでは合っていたのよね。"],["ずんだもん","そうなのだ。落としたのは、最後の一手なのだ。"],["めたん","振り替えた12,000が、そのまま研究開発費の答えでしょ。"],["ずんだもん","そこが落とし穴なのだ。前T/Bに、研究開発費がもう20,000あるのだ。"],["ずんだもん","20,000＋12,000で、32,000なのだ。"],["めたん","12,000だけ書くと、前T/Bの分が抜けちゃうのね。"],["ずんだもん","そうなのだ。前T/Bに同じ名前の科目があったら、必ず足すのだ。"],["めたん","機械装置の償却率も、問題文に書いてあったけど？"],["ずんだもん","解説には、資産のままにして、償却分の2,800だけを研究開発費にする別解も載っているのだ。"],["ずんだもん","でも、模範解答は全額費用の32,000なのだ。"],["ずんだもん","解答用紙の、研究開発費の欄は、32,000なのだ。"]],[["ずんだもん","次は資料2の5番、ソフトウェアなのだ。"],["ずんだもん","ここで埋まるのは、ソフトウェア償却費なのだ。本人は8,080で正解だったのだ。"],["めたん","問題文には、前T/Bのソフトウェア30,000に、2つのシステムが入っている、ってあるわ。"],["ずんだもん","基幹システムと、販売支援システムなのだ。"],["ずんだもん","基幹システムは、取得原価33,600、使える期間5年、定額法なのだ。"],["めたん","1年分は、33,600÷5年で、6,720ね。"],["ずんだもん","その通りなのだ。"],["めたん","販売支援システムの方は、取得原価が書いてないわよ。"],["ずんだもん","前T/Bから逆算するのだ。"],["ずんだもん","前T/Bの30,000は、基幹システムの当期首の帳簿価額と、販売支援システムの取得原価の合計なのだ。"],["めたん","じゃあ、基幹システムの当期首の帳簿価額を引けば、残りが販売支援システムね。"],["ずんだもん","その通りなのだ。使い始めてから当期首まで、21か月たっているのだ。"],["ずんだもん","5年は60か月だから、残りは39か月分なのだ。"],["めたん","33,600×60分の39で、21,840ね。"],["ずんだもん","そうなのだ。30,000−21,840で、販売支援システムの取得原価は8,160なのだ。"],["めたん","販売支援システムは、当期の途中から使い始めたのよね。"],["ずんだもん","そうなのだ。10月からだから、当期は6か月分なのだ。"],["ずんだもん","8,160÷3年で、1年分は2,720。その半分で、1,360なのだ。"],["めたん","6,720＋1,360で、8,080。本人の答えと同じね。"],["ずんだもん","その通りなのだ。解答用紙の、ソフトウェア償却費の欄は、8,080なのだ。"]],[["ずんだもん","次は資料2の6番、外貨建ての満期保有目的の債券なのだ。"],["ずんだもん","ここで埋まるのは、営業外収益の、有価証券利息と為替差益なのだ。"],["めたん","本人は、250と4,970を書いて、前T/Bに足すのを忘れたのよね。"],["ずんだもん","そうなのだ。増えた分の出し方は、合っていたのだ。順番に確かめるのだ。"],["めたん","問題文には、額面500ドルの社債を490ドルで買った、ってあるわ。満期は5年後ね。"],["ずんだもん","そうなのだ。満期保有目的だから、償却原価法なのだ。"],["めたん","償却原価法って、差を少しずつ足していくやつよね。"],["ずんだもん","そうなのだ。買った値段と額面の差を、満期までの間に少しずつ帳簿に足す方法なのだ。"],["めたん","なんで足すの？"],["ずんだもん","満期には500ドル返ってくるから、帳簿も満期の日に500ドルになるように近づけるのだ。"],["めたん","差の10ドルを5年で割って、1年に2ドルずつね。"],["ずんだもん","その通りなのだ。"],["めたん","足した2ドルは、何になるのかしら。"],["ずんだもん","有価証券利息なのだ。安く買った分は、実質的に利息と同じだからなのだ。"],["めたん","当期首までに3年たってるから、490に2ドルの3年分を足して、496ドルね。"],["ずんだもん","その通りなのだ。円では、前T/Bの投資有価証券59,520なのだ。"],["ずんだもん","496ドルに、前期末の120円をかけた数字と一致するのだ。"],["めたん","当期の2ドルは、期末の相場で換算するのよね。"],["ずんだもん","利息は1年かけて発生するから、当期中の相場の125円を使うのだ。"],["めたん","2ドル×125円で、250ね。"],["ずんだもん","そうなのだ。本人の250は、ここまで合っていたのだ。"]],[["めたん","次は為替差益ね。"],["ずんだもん","期末には、債券を、期末の相場で換算し直すのだ。"],["めたん","期末の帳簿価額は、496ドルに当期の2ドルを足して、498ドルね。"],["ずんだもん","その通りなのだ。期末の相場130円をかけて、64,740なのだ。"],["めたん","今の円の帳簿は、59,520＋250で、59,770。"],["ずんだもん","そうなのだ。64,740−59,770で、4,970が為替差益なのだ。"],["めたん","本人の4,970も、合っていたのね。"],["ずんだもん","そうなのだ。落としたのは、ここからなのだ。"],["めたん","前T/Bを見るのね。"],["ずんだもん","前T/Bに、有価証券利息1,250と、為替差損益800が、もう載っているのだ。"],["めたん","これは何の数字？"],["ずんだもん","問題文に内訳はないのだ。でも、決算の前に、期中でもう計上されている収益なのだ。"],["めたん","じゃあ損益計算書には、前T/Bの金額に、決算で増えた分を足すのね。"],["ずんだもん","その通りなのだ。有価証券利息は、1,250＋250で、1,500なのだ。"],["めたん","為替差益は、800＋4,970で、5,770。"],["めたん","あ、でも前T/Bの為替差損益800って、益なの？損なの？"],["ずんだもん","前T/Bの貸方にあるから、益なのだ。だから足してよいのだ。"],["ずんだもん","解答用紙の、有価証券利息は1,500、為替差益は5,770なのだ。"],["めたん","貸借対照表では？"],["ずんだもん","満期まで1年以内になったので、投資有価証券ではなく、流動資産の有価証券64,740になるのだ。"]],[["ずんだもん","次は資料2の7番、退職給付なのだ。"],["ずんだもん","ここで埋まるのは、退職給付費用と、問2の退職給付引当金なのだ。"],["めたん","本人は、退職給付費用7,800で正解、引当金は空欄だったわね。"],["めたん","問題文を見るわよ。数字が4つ並んでるわね。"],["ずんだもん","当期の勤務費用5,000、利息費用4,500、期待運用収益2,700、数理計算上の差異の費用処理額1,000なのだ。"],["めたん","これを足し引きすれば、退職給付費用ね。"],["ずんだもん","そうなのだ。勤務費用と利息費用は、退職金を払う義務が増える分だから、足すのだ。"],["ずんだもん","期待運用収益は、年金資産が増える分だから、引くのだ。"],["めたん","数理計算上の差異の1,000は？"],["ずんだもん","問題文に、年金資産の運用損による差異、と書いてあるのだ。損だから、費用に足すのだ。"],["めたん","5,000＋4,500−2,700＋1,000で、7,800ね。"],["ずんだもん","その通りなのだ。"],["めたん","前T/Bにも、退職給付費用7,000があるわね。研究開発費みたいに、これも足すのよね。"],["ずんだもん","足さないのだ。問題文に、これは当期に払った退職一時金と、年金の掛金だ、と書いてあるのだ。"],["めたん","払ったお金は、費用じゃないの？"],["ずんだもん","退職金は、毎年の費用として、引当金に積んできたものなのだ。"],["ずんだもん","払ったときは、積んである引当金を取り崩すだけなのだ。費用ではないのだ。"],["ずんだもん","だから、退職給付費用の7,000を、退職給付引当金に振り替えて消すのだ。"],["めたん","研究開発費は足したのに、こっちは足さないのね。紛らわしいわ。"],["ずんだもん","そうなのだ。前T/Bの数字は、何の金額かを問題文で確かめてから使うのだ。"],["ずんだもん","解答用紙の、退職給付費用の欄は、7,800なのだ。"],["めたん","引当金の残高は？"],["ずんだもん","前T/Bの54,000から、払った7,000を引いて、当期の費用7,800を足すのだ。"],["ずんだもん","54,000−7,000＋7,800で、54,800なのだ。"],["めたん","54,000って、問題文の数字とつながってるの？"],["ずんだもん","つながっているのだ。退職給付債務150,000から、年金資産90,000と、まだ費用にしていない差異6,000を引くと、54,000なのだ。"],["ずんだもん","問2の退職給付引当金は、54,800なのだ。これも税効果で使うのだ。"]],[["ずんだもん","次は資料2の8番、法人税等と税効果会計なのだ。"],["ずんだもん","ここで埋まるのは、法人税、住民税及び事業税と、法人税等調整額なのだ。"],["めたん","本人は、どっちも空欄だったわね。"],["めたん","問題文には、当年度の法人税等は28,000と見積もられた、ってあるわ。"],["ずんだもん","前T/Bの仮払法人税等10,000は、中間納付した額なのだ。"],["めたん","28,000を費用にして、もう払った10,000は、仮払法人税等を消すのね。"],["ずんだもん","その通りなのだ。残りの18,000は、未払法人税等にするのだ。"],["ずんだもん","解答用紙の、法人税、住民税及び事業税の欄は、28,000なのだ。"]],[["めたん","次は税効果ね。税効果会計って何？"],["ずんだもん","会計の利益と、税金の計算の利益のずれを、調整する方法なのだ。"],["めたん","どんなずれ？"],["ずんだもん","会計では今期の費用なのに、税金の計算では、まだ費用と認められないものがあるのだ。"],["ずんだもん","こういう、将来の税金を減らす効果がある差を、将来減算一時差異というのだ。"],["めたん","今回は、どれが一時差異なの？"],["ずんだもん","問題文に書いてあるのだ。貸倒引当金、受注損失引当金、減損損失累計額、退職給付引当金の、4つだけなのだ。"],["めたん","引当金ばっかりね。なんで引当金が、一時差異になるの？"],["ずんだもん","引当金を積んだときは、税金の計算では費用にならないのだ。実際に払ったときに、費用になるのだ。"],["ずんだもん","だから今は税金を多めに払っていて、将来その分の税金が減るのだ。"],["ずんだもん","その将来減る税金を、繰延税金資産として資産にするのだ。"],["めたん","当期末の一時差異を合計して、税率をかければいいのね。"],["ずんだもん","そうなのだ。税率30%をかけて、当期末の繰延税金資産を出すのだ。"],["ずんだもん","使うのは、今までの場面で出した数字なのだ。"],["ずんだもん","貸倒引当金は1,480、受注損失引当金は3,420なのだ。"],["ずんだもん","減損損失累計額は85,590、退職給付引当金は54,800なのだ。"],["ずんだもん","合計で145,290。30%をかけて、当期末の繰延税金資産は43,587なのだ。"],["めたん","当期首の分は、前T/Bの繰延税金資産16,500ね。"],["ずんだもん","そうなのだ。これが当期首の残高なのだ。"],["めたん","増えた分は、43,587−16,500で、27,087。それが法人税等調整額ね。"],["ずんだもん","その通りなのだ。繰延税金資産が増えた分だけ、税金の費用を減らすのだ。"],["ずんだもん","仕訳は、借方が繰延税金資産27,087、貸方が法人税等調整額27,087なのだ。"],["めたん","解説の表では、当期首の貸倒引当金が1,000になってるけど、前T/Bは400よね？"],["ずんだもん","16,500を30%で割ると、55,000なのだ。そこから退職給付引当金54,000を引くと、1,000なのだ。"],["ずんだもん","前期末には1,000あったけど、期中の貸倒れで600を取り崩して、前T/Bでは400になったと考えられるのだ。"],["ずんだもん","だから当期首の分は、前T/Bの繰延税金資産16,500を、そのまま使うのが確実なのだ。"],["めたん","損益計算書での書き方も、見ておきたいわ。"],["ずんだもん","法人税、住民税及び事業税28,000の下に、法人税等調整額をマイナス27,087と書くのだ。"],["ずんだもん","差し引きの法人税等合計は、913なのだ。"],["ずんだもん","解答用紙の、法人税等調整額の欄は、マイナス27,087なのだ。"]],[["ずんだもん","ここで、損益計算書を上から通して、完成させるのだ。"],["めたん","売上高は、商品販売810,000とソフトウェア開発64,020で、874,020ね。"],["ずんだもん","その通りなのだ。売上原価は、648,000と59,220で、707,220なのだ。"],["めたん","売上総利益は、874,020−707,220で、166,800。"],["ずんだもん","そうなのだ。次は販売費及び一般管理費なのだ。"],["ずんだもん","貸倒引当金繰入額1,080、給料手当20,000、退職給付費用7,800なのだ。"],["ずんだもん","減価償却費21,500、ソフトウェア償却費8,080、研究開発費32,000、一般管理費10,000なのだ。"],["めたん","給料手当と一般管理費は、今日一度も出てこなかったわね。"],["ずんだもん","前T/Bの金額そのままなのだ。資料2に、直す指示がないからなのだ。"],["ずんだもん","合計は100,460で、営業利益は66,340なのだ。"],["めたん","営業外収益は？"],["ずんだもん","受取賃貸料32,400と、受取配当金8,300は、前T/Bのままなのだ。"],["ずんだもん","有価証券利息1,500と、為替差益5,770を足して、47,970なのだ。"],["めたん","営業外費用は、減価償却費12,000と、前T/Bの支払利息8,000で、20,000ね。"],["ずんだもん","その通りなのだ。経常利益は、66,340＋47,970−20,000で、94,310なのだ。"],["めたん","特別損失は減損損失85,590だから、税引前当期純利益は8,720。"],["ずんだもん","そうなのだ。法人税等は、28,000とマイナス27,087を合わせて、913なのだ。"],["めたん","当期純利益は、8,720−913で、7,807ね。"],["ずんだもん","その通りなのだ。"],["めたん","本人が埋めていたのは、どこだった？"],["ずんだもん","退職給付費用、販管費の減価償却費、ソフトウェア償却費、営業外の減価償却費の4つなのだ。"],["ずんだもん","今日の流れで、残りの欄も全部埋まったのだ。"]],[["ずんだもん","最後は資料2の9番、配当に伴う準備金なのだ。"],["ずんだもん","ここで埋まるのは、問2の利益準備金と、繰越利益剰余金なのだ。"],["めたん","問題文には、支払配当金8,000は中間配当で、準備金の積立てがまだ、ってあるわ。"],["ずんだもん","そうなのだ。準備金を積む処理が、まだされていないのだ。"],["めたん","なんで準備金を積むの？"],["ずんだもん","会社法で、配当するときは、配当の10分の1を準備金として積むと決まっているのだ。"],["ずんだもん","ただし、資本準備金と利益準備金の合計が、資本金の4分の1に届くまででいいのだ。"],["めたん","だから2つ計算して、少ない方なのね。"],["ずんだもん","そうなのだ。1つ目は、配当8,000の10分の1で、800なのだ。"],["ずんだもん","2つ目は、資本金500,000の4分の1の125,000から、今ある準備金を引くのだ。"],["ずんだもん","資本準備金100,000と、利益準備金20,000を引いて、5,000なのだ。"],["めたん","800と5,000なら、少ない方の800ね。"],["ずんだもん","そうなのだ。繰越利益剰余金から配当したので、利益準備金に800を積むのだ。"],["めたん","利益準備金は、20,000＋800で、20,800ね。"],["ずんだもん","その通りなのだ。"],["めたん","繰越利益剰余金は、前T/Bの69,700から、配当の8,000と準備金の800を引くのね。"],["めたん","でも支払配当金8,000って、もう繰越利益剰余金から引かれてるんじゃないの？"],["ずんだもん","前T/Bでは、支払配当金という別の科目に置いてあるのだ。決算で、繰越利益剰余金に振り替えるのだ。"],["ずんだもん","そこに、損益計算書の当期純利益7,807を足すのだ。"],["ずんだもん","69,700−8,800＋7,807で、68,707なのだ。"],["ずんだもん","解答用紙の、問2の利益準備金は20,800、繰越利益剰余金は68,707なのだ。"]],[["ずんだもん","最後に、問2の5つを確かめるのだ。"],["ずんだもん","返品資産8,000は、1番の返品権付き販売で出したのだ。"],["ずんだもん","受注損失引当金3,420は、2番のZ社で出したのだ。"],["ずんだもん","退職給付引当金54,800は、7番で出したのだ。"],["ずんだもん","利益準備金20,800と、繰越利益剰余金68,707は、9番で出したのだ。"],["めたん","どれも、途中の計算で出てくる数字ね。"],["ずんだもん","そうなのだ。出たときにすぐ、問2の欄に書き込んでおくと、時間切れで落とさないのだ。"],["めたん","本人は、前半で止まって、後ろが空欄だったのよね。"],["ずんだもん","そうなのだ。4番から7番は、前の番号が解けなくても解けるのだ。"],["ずんだもん","止まったら飛ばして、先の番号を解くのも大事なのだ。"]]],"drops":[{"prob":"法人税等・法人税等調整額","at":"2026-09-27","kind":"none","pair":null,"what":"税効果会計・法人税等の計算が手つかず","n":0,"vs":"","seek":736.62},{"prob":"減損損失","at":"2026-09-27","kind":"none","pair":null,"what":"有形固定資産の保有目的変更と減損が手つかず","n":0,"vs":"","seek":216.79},{"prob":"有価証券利息・為替差益","at":"2026-09-27","kind":"slip","pair":null,"what":"外貨建有価証券の完成計算で、前T/Bへの足し戻しを忘れる","n":0,"vs":"","seek":491.87}]},{"kind":"exam","no":"164回","sub":"過去問","ch":164,"probs":[],"hl":"[在外子会社]の/[一部売却]","acct":"過去問","id":"x164-ka","title":"会計学","sn":"会計","w":0.936,"wt":["連結の数字で「非支配株主の分を含むか」を取り違える"],"video":{"blob":"bee3ce7d1c8910af5b3ea5410361293a","secs":1444.65,"mb":16.8},"scenes":[[0,"会計学の全体像"],[29.8,"第1問の1番：会計上の変更と誤謬"],[88.13,"第1問の2番：新株予約権付社債"],[136.4,"第1問の3番：棚卸減耗損と商品評価損"],[179.89,"第1問の4番：利息と配当金のキャッシュ・フロー"],[238.61,"第1問の5番：開業費"],[273.4,"第2問：資料を読む"],[325.49,"第2問：タイムテーブルを作る"],[407.72,"問1の1番：当期純利益"],[487.57,"問1の2番：非支配株主に帰属する当期純利益"],[518.75,"問1の3番：その他有価証券評価差額金の残高"],[613.75,"問1の4番：のれん償却額"],[649.87,"問1の5番：為替換算調整勘定"],[721.75,"問1の5番：親会社株主に係る包括利益"],[788.4,"問2の全体像：2年目に起きたこと"],[814.91,"問2の1番：P社の個別の当期純利益"],[844.77,"問2の2番：S2社の円換算後の当期純利益"],[874.44,"問2の3番：その他有価証券評価差額金の当期の動き"],[935.99,"問2の4番：為替換算調整勘定"],[1006.45,"問2の5番：S1社の非支配株主持分の増減"],[1054.32,"問2の6番：S2社の非支配株主持分の増減"],[1122.77,"問2の7番：のれんの期末残高"],[1158.42,"一部売却の考え方"],[1219.67,"問2の8番：資本剰余金の増減"],[1290.86,"問2の9番：連結の当期純利益"],[1356.86,"問2の10番：親会社株主に係る包括利益"],[1411.1,"会計学のまとめ"]],"script":[[["ずんだもん","今回は、164回の会計学を、最初から最後まで解くのだ。"],["ずんだもん","第1問は正誤問題、第2問は連結の計算問題なのだ。"],["めたん","まずは本人の点数から聞かせて。"],["ずんだもん","25点中18点なのだ。第1問は5問中4問、第2問は15問中10問、正解だったのだ。"],["ずんだもん","合っていた所も、解き方が合っていたか確かめるのだ。"],["めたん","第1問は、どういう形の問題？"],["ずんだもん","5つの文章に、下線が4つずつ引いてあるのだ。"],["ずんだもん","間違いが1つあれば、その記号と、正しい言葉を書くのだ。"],["めたん","間違いがなければ、丸を書くのよね。"],["ずんだもん","その通りなのだ。"]],[["ずんだもん","第1問の1番は、会計上の変更と、誤謬の訂正なのだ。"],["ずんだもん","ここで埋まるのは、第1問の1番の欄なのだ。"],["めたん","本人は、cと、会計上の見積りの変更、で正解だったわね。"],["ずんだもん","まず前提なのだ。会計上の変更は、会計方針の変更、見積りの変更、表示方法の変更の3つなのだ。"],["ずんだもん","誤謬の訂正は、会計上の変更とは別のものなのだ。"],["めたん","aは、会計方針の変更は遡及適用する、ね。"],["ずんだもん","合っているのだ。新しい方針で、過去の財務諸表も作り直すのだ。"],["めたん","bは、誤謬の訂正は修正再表示する。間違いを直して出し直すんだから、これも合ってそうね。"],["ずんだもん","その通りなのだ。過去の間違いを直して、表示し直すのだ。"],["めたん","cは、区別が難しいときは、会計方針の変更と同じに扱う、ね。"],["ずんだもん","ここが間違いなのだ。基準では、会計上の見積りの変更と同じに扱うのだ。"],["めたん","見積りの変更も、過去にさかのぼって直すのよね。"],["ずんだもん","そこは違うのだ。過去は直さず、変更した期から後に反映するのだ。"],["ずんだもん","丸から丸は継続性、三角から丸は見積りの変更、バツから丸は誤謬、と整理するのだ。"],["ずんだもん","解答は、記号がc、正しい言葉は、会計上の見積りの変更なのだ。"]],[["ずんだもん","2番は、新株予約権付社債なのだ。"],["ずんだもん","ここで埋まるのは、第1問の2番の欄なのだ。"],["めたん","本人は、bと、区分法、で正解ね。"],["めたん","区分法と一括法って、何が違うの？"],["ずんだもん","区分法は、社債の部分と新株予約権の部分を、分けて処理する方法なのだ。"],["ずんだもん","一括法は、分けずに、まとめて社債として処理する方法なのだ。"],["ずんだもん","まず発行する側なのだ。転換社債型は、区分法でも一括法でもいいのだ。だからaは合っているのだ。"],["めたん","じゃあ、転換社債型じゃない方も、一括法でいいのね。"],["ずんだもん","そこが違うのだ。区分法しか使えないのだ。問題文は一括法になっているから、bが間違いなのだ。"],["ずんだもん","次は買う側なのだ。転換社債型は一括法、それ以外は区分法なのだ。だから、cとdは合っているのだ。"],["めたん","一括法が出てくるのは、どっちも転換社債型のときだけね。 の、問2の1番は67,000なのだ。"]],[["ずんだもん","2番は、S2社の当期純利益を、円に直した額なのだ。"],["ずんだもん","ここで埋まるのは、問2の2番の欄なのだ。本人は57,600で正解なのだ。"],["めたん","まず、ドルで利益を出すのね。"],["ずんだもん","1,850ドル−1,500ドルで、350ドルなのだ。"],["めたん","S2社も、配当してるわよね。"],["ずんだもん","そうなのだ。100ドルを足し戻して、450ドルなのだ。"],["めたん","利益だから、2年目の期中平均の128円で換算ね。"],["ずんだもん","その通りなのだ。450×128で、57,600なのだ。"],["ずんだもん","解答用紙の、問2の2番は57,600なのだ。"]],[["ずんだもん","3番は、連結包括利益計算書の、その他有価証券評価差額金なのだ。"],["ずんだもん","ここで埋まるのは、問2の3番の欄なのだ。本人はマイナス1,092で正解なのだ。"],["めたん","今度は残高じゃなくて、1年間の動きなのね。"],["ずんだもん","そうなのだ。包括利益計算書だから、グループ全体の、当期の増減なのだ。"],["めたん","P社のA社株から。"],["ずんだもん","1年目の期末は20,160だったのだ。2年目に、180ドルを127円で、22,860で売ったのだ。"],["めたん","売るまでに、22,860−20,160で2,700値上がりしたのね。"],["ずんだもん","そうなのだ。これが、当期に発生した評価差額なのだ。"],["めたん","でも、売っちゃったのよね。"],["ずんだもん","そうなのだ。売ったら、それまでの評価差額は全部、売却益として損益計算書に移るのだ。"],["ずんだもん","これを組替調整額と言うのだ。取得の18,000から売った22,860までの、4,860を引くのだ。"],["めたん","甲社株は、12,600から13,200で、600増えたわね。"],["ずんだもん","そうなのだ。2,700＋600−4,860で、マイナス1,560なのだ。"],["ずんだもん","税効果の分として、30%の468を反対向きに足して、マイナス1,092なのだ。"],["ずんだもん","解答用紙の、問2の3番はマイナス1,092なのだ。"]],[["ずんだもん","4番は、連結包括利益計算書の、為替換算調整勘定なのだ。"],["ずんだもん","ここで埋まるのは、問2の4番の欄なのだ。本人は9,770で正解なのだ。"],["めたん","2年目の期末の残高から、出すのね。"],["ずんだもん","そうなのだ。2年目の期末の相場は、129円なのだ。"],["ずんだもん","資本金1,500ドルは、129−120で9円ずれて、13,500なのだ。"],["めたん","利益剰余金1,200ドルも、9円ずれて10,800ね。"],["ずんだもん","そうなのだ。1年目の利益300ドルは、129−123で6円ずれて、1,800なのだ。"],["めたん","2年目の利益450ドルは、129−128で1円だから、450ね。"],["ずんだもん","そうなのだ。配当のマイナス100ドルは、129−127で2円ずれて、マイナス200なのだ。"],["ずんだもん","合計で26,350なのだ。"],["めたん","1年目の期末は17,100だったから……"],["ずんだもん","当期の増加は、9,250なのだ。"],["ずんだもん","のれんの分も出すのだ。のれんの残高160ドルを129円で換算すると20,640、円で積み上げると18,980なのだ。"],["ずんだもん","ずれの累計は1,660。1年目の1,140から、520増えたのだ。"],["めたん","9,250＋520で、9,770ね。"],["めたん","8%売った分は、ここで引かなくていい？"],["ずんだもん","引かないのだ。一部売却で取り崩した分は組替調整ではなく、欄外なのだ。"],["ずんだもん","解答用紙の、問2の4番は9,770なのだ。"]],[["ずんだもん","5番は、S1社の連結に係る、非支配株主持分の当期の増減なのだ。"],["ずんだもん","ここで埋まるのは、問2の5番の欄なのだ。本人は21,368で正解なのだ。"],["めたん","非支配株主持分は、何で増えるの？"],["ずんだもん","子会社の資本のうち、非支配株主の割合の分だけ増えるのだ。"],["ずんだもん","S1社の2年目の利益は、226,000−173,000で、53,000なのだ。"],["めたん","その40%で、21,200ね。"],["ずんだもん","そうなのだ。もう1つ、評価差額金の分があるのだ。"],["ずんだもん","甲社株の評価差額金は、770から、1,190に増えたのだ。"],["めたん","1,190って、どこから来たの？"],["ずんだもん","13,200−11,500の1,700から、税効果30%を引いた数字なのだ。"],["めたん","増えた420の40%で、168ね。"],["ずんだもん","その通りなのだ。21,200＋168で、21,368なのだ。"],["ずんだもん","解答用紙の、問2の5番は21,368なのだ。"]],[["ずんだもん","6番は、S2社の連結に係る、非支配株主持分の当期の増減なのだ。"],["ずんだもん","ここで埋まるのは、問2の6番の欄なのだ。本人は45,402で正解なのだ。"],["めたん","非支配株主持分を動かすものは、いくつある？"],["ずんだもん","4つあるのだ。利益、配当、為替換算調整勘定、それと一部売却なのだ。"],["ずんだもん","利益は、57,600の20%で、11,520増えるのだ。"],["ずんだもん","配当は、100ドルを配当した日の127円で12,700。その20%の2,540が減るのだ。"],["めたん","非支配株主も、配当を受け取ったからね。"],["ずんだもん","為替換算調整勘定は、当期の増加9,250の20%で、1,850増えるのだ。"],["めたん","のれんの520も、20%入れておくわ。"],["ずんだもん","入れないのだ。のれんは親だけのものだから、非支配株主には入れないのだ。"],["ずんだもん","最後は一部売却なのだ。P社が売った8%は、非支配株主が買ったのと同じなのだ。"],["めたん","非支配株主の持分が、8%ぶん増えるってことね。"],["ずんだもん","そうなのだ。S2社の期末の資本は、1,500ドルと1,850ドルで3,350ドルなのだ。"],["ずんだもん","期末の129円をかけて、その8%で、34,572なのだ。"],["ずんだもん","11,520−2,540＋1,850＋34,572で、45,402なのだ。"],["ずんだもん","解答用紙の、問2の6番は45,402なのだ。"]],[["ずんだもん","7番は、S2社ののれんの、期末の残高なのだ。"],["ずんだもん","ここで埋まるのは、問2の7番の欄なのだ。本人は20,640で正解なのだ。"],["めたん","ドルののれんは、200ドルから、毎年20ドル減るのね。"],["ずんだもん","そうなのだ。2年償却して、160ドル残っているのだ。"],["めたん","償却のときと同じで、期中平均の128円で換算するのね。"],["ずんだもん","残高だから、期末の129円なのだ。160×129で、20,640なのだ。"],["ずんだもん","残高は期末の相場、償却額は平均の相場、と覚えるのだ。"],["めたん","一部売却で、のれんは減らないのかしら。"],["ずんだもん","減らないのだ。支配が続く一部売却では、のれんはそのまま残すのだ。"],["ずんだもん","解答用紙の、問2の7番は20,640なのだ。"]],[["ずんだもん","ここから、本人が時間切れだった所なのだ。まず、一部売却の考え方なのだ。"],["めたん","8%売っても、S2社は子会社のままなのよね。"],["ずんだもん","そうなのだ。80%が72%になっても、支配は続くのだ。"],["めたん","支配が続くと、何が変わるの？"],["ずんだもん","親会社と非支配株主は、同じグループの親戚みたいなものなのだ。"],["ずんだもん","親戚どうしで株をやりとりしても、グループ全体はもうからないのだ。"],["めたん","身内で売り買いしても、グループの外から見たら何も起きてないってことね。"],["ずんだもん","そうなのだ。だから損益にしないで、資本剰余金にするのだ。"],["ずんだもん","講義の言葉で、連結損益計算書の子会社株式売却益は、絶対にゼロ、なのだ。"],["めたん","個別では、売却益が出ているのよね。"],["ずんだもん","そうなのだ。まず個別を見るのだ。売った値段は、246ドル×129円で、31,734なのだ。"],["めたん","あとは、帳簿の値段と比べるのね。"],["ずんだもん","講義で言う、個簿価なのだ。持っていた80%のうち8%、つまり10分の1を売ったのだ。"],["ずんだもん","取得原価は、2,360ドル×120円で283,200。その10分の1で、28,320なのだ。"],["めたん","31,734−28,320で、個別の売却益は3,414ね。"],["ずんだもん","その通りなのだ。"]],[["ずんだもん","8番は、一部売却に伴う、資本剰余金の当期の増減なのだ。税金を引いた後なのだ。"],["ずんだもん","ここで埋まるのは、問2の8番の欄なのだ。"],["めたん","連結では、いくらで売ったと考えるの？"],["ずんだもん","売った値段は同じ31,734なのだ。違うのは、手放したものの値段なのだ。"],["ずんだもん","講義で言う、連簿価なのだ。連結の帳簿で、手放した持分の値段なのだ。"],["めたん","それなら、6番で出した34,572ね。"],["ずんだもん","そこから、為替換算調整勘定の分を引くのだ。"],["めたん","なんで引くの？"],["ずんだもん","34,572には、期末の相場で膨らんだ分が入っているのだ。その分は、為替換算調整勘定として、もう計上してあるのだ。"],["ずんだもん","売った8%に対応する、26,350の8%の2,108は、為替換算調整勘定を取り崩して、非支配株主に渡すのだ。"],["ずんだもん","だから連簿価は、34,572−2,108で、32,464なのだ。"],["めたん","31,734で売って、32,464のものを手放したのね。"],["ずんだもん","そうなのだ。講義の言葉で、価値より安く売れば損サイドなのだ。730の損なのだ。"],["めたん","その730が、資本剰余金になるのね。"],["ずんだもん","そうなのだ。さらに、税金の分を戻すのだ。"],["ずんだもん","730の30%、219は税金の効果なので、資本剰余金の減りは、730の70%で511なのだ。"],["ずんだもん","解答用紙の、問2の8番はマイナス511なのだ。"]],[["ずんだもん","9番は、2年目の、連結損益計算書の当期純利益なのだ。"],["ずんだもん","ここで埋まるのは、問2の9番の欄なのだ。"],["めたん","1年目と同じで、全部足すのね。"],["ずんだもん","そうなのだ。まず3社の個別の利益を足すのだ。"],["めたん","P社67,000、S1社53,000、S2社57,600で、177,600ね。"],["ずんだもん","その通りなのだ。そこから、連結で消すものを引くのだ。"],["ずんだもん","1つ目は、のれん償却なのだ。S1社4,000と、S2社の20ドル×128円の2,560で、6,560なのだ。"],["ずんだもん","2つ目は、S2社からの受取配当金なのだ。"],["めたん","グループの中でお金が動いただけ、だからね。"],["ずんだもん","そうなのだ。12,700の80%、10,160を消すのだ。"],["ずんだもん","3つ目は、個別の売却益3,414なのだ。連結の売却益はゼロだからなのだ。"],["ずんだもん","4つ目は、税金の219なのだ。"],["めたん","219は、なんで引くの？"],["ずんだもん","さっき資本剰余金に移した損730に対応する、税金の効果なのだ。"],["ずんだもん","この分を、損益計算書から資本剰余金の側へ移すので、損益計算書の税金が219増えるのだ。"],["ずんだもん","177,600−6,560−10,160−3,414−219で、157,247なのだ。"],["ずんだもん","解答用紙の、問2の9番は157,247なのだ。"]],[["ずんだもん","最後の10番は、2年目の、親会社株主に係る包括利益なのだ。"],["ずんだもん","ここで埋まるのは、問2の10番の欄なのだ。"],["めたん","また田の字ね。親の当期純利益から。"],["ずんだもん","P社67,000から、受取配当金10,160、売却益3,414、税金219を引くのだ。"],["ずんだもん","S1社53,000の60%で31,800、S2社57,600の80%で46,080を足すのだ。"],["ずんだもん","のれん償却6,560を引くのだ。"],["ずんだもん","次は、親のその他の包括利益なのだ。評価差額金は、P社がマイナス1,512なのだ。"],["めたん","A社株を売ったから、1年目の1,512が消えたってことね。"],["ずんだもん","そうなのだ。1年目の期末にあった1,512が、全部なくなったのだ。"],["ずんだもん","S1社は、増えた420の60%で、252なのだ。"],["ずんだもん","為替換算調整勘定は、S2社の9,250の80%で7,400、のれんの520は全部親なのだ。"],["めたん","全部足すと、いくつになる？"],["ずんだもん","131,187なのだ。"],["ずんだもん","解答用紙の、問2の10番は131,187なのだ。"]],[["めたん","今日のポイントをまとめて。"],["ずんだもん","第1問の4番は、受け取りは投資活動、支払いは財務活動、という書き方もあるのだ。"],["ずんだもん","連結は、非支配株主の分を含む数字か、含まない数字かを、答える前に決めるのだ。"],["ずんだもん","当期純利益と包括利益計算書は全体、評価差額金の残高は親の分なのだ。"],["めたん","一部売却は、支配が続くなら損益にしない、だったわね。"],["ずんだもん","そうなのだ。資本剰余金にするのだ。連結の売却益はゼロなのだ。"],["ずんだもん","連簿価は、持分から為替換算調整勘定の取り崩しを引いて出すのだ。"],["めたん","本人の数字は、計算ミスではなかったのね。"],["ずんだもん","そうなのだ。聞かれている物の取り違えなのだ。解き方そのものは、身についているのだ。"]]],"shorts":[{"hl":"[当期純利益]は/非支配の分も入る","at":407.72,"blob":"6d5dd75ed8fbedae343c40d41f7ad7cc"},{"hl":"評価差額金の残高は/[親の分]だけ","at":518.75,"blob":"94a48f295896975ab7f81b605cd0aadc"},{"hl":"資本剰余金は/[税金]を引いて","at":1158.42,"blob":"54921be512549a23404d3c8634bb7445"}],"drops":[{"prob":"問1(1)当期純利益・(3)その他有価証券評価差額金","at":"2026-09-27","kind":"run","pair":null,"what":"連結の数字で「非支配株主の分を含むか」を取り違える","n":0,"vs":"","seek":407.72}]},{"kind":"exam","no":"164回","sub":"過去問","ch":164,"probs":[],"hl":"[全部]と[直接]の/利益の差","acct":"過去問","id":"x164-ko","title":"工業簿記","sn":"工簿","w":0.719,"wt":["全部原価計算で、どの固定費を1個あたりにするか"],"video":{"blob":"034f7be93bc69a492b87a56a0d15dcf7","secs":624.43,"mb":7.2},"scenes":[[0,"工業簿記の全体像"],[29.5,"第1問：元帳の名前（1〜3）"],[86.67,"第1問：棚卸計算法と段取時間（4〜6）"],[161.19,"第2問：資料の読み方"],[212.58,"問1：製品1個あたりの固定費"],[255.95,"問1：売上原価と営業利益"],[311.23,"問2：直接原価計算"],[350.14,"問3の1：第2期の在庫とア・イ"],[385.3,"問3の1：第2期の利益の差（ウ・エ）"],[439.21,"問3の2：第4期（オ・カ・キ）"],[495.27,"問3の3：第3期の生産量が増えたら（ク・ケ・コ）"],[558.23,"問3の4：利益計画に向くのは（サ）"]],"script":[[["ずんだもん","今回は、164回の工業簿記を、最初から最後まで解くのだ。"],["ずんだもん","第1問は語群から選ぶ穴埋め、第2問は全部原価計算と直接原価計算の比べ合いなのだ。"],["めたん","本人の点数から聞かせて。"],["ずんだもん","1回目は25点中20点、1週間後の2回目は25点満点だったのだ。"],["めたん","満点なら、見直さなくてもいい気がするけど。"],["ずんだもん","2回目は、問題を覚えていた効果もあるのだ。だから、解き方が本当に合っていたかを確かめるのだ。"],["ずんだもん","1回目に落としたのは3か所。第1問の1番、第2問の問1、問3のクなのだ。"],["めたん","そこは特に丁寧にやってよね。"]],[["ずんだもん","第1問の1番から3番を埋めるのだ。語群から記号を選ぶのだ。"],["めたん","1番は、未完成品の原価計算票をファイルしたもの、ね。"],["ずんだもん","原価計算票は、個別原価計算で、製品1つ1つの原価を集める表なのだ。"],["めたん","未完成品っていうことは、まだ作っている途中の製品よね。"],["ずんだもん","そうなのだ。作りかけの製品の票を綴じたものは、原価元帳、または製造元帳と呼ぶのだ。"],["ずんだもん","仕掛品の勘定の中身を、製品ごとに分けて見せる帳簿なのだ。"],["めたん","作りかけなら、語群の半製品でもよさそうに見えるわ。1回目もケを選んでたわね。"],["ずんだもん","半製品は、途中の工程まで終わって、それだけで売ったり保管したりできる物なのだ。"],["ずんだもん","作りかけの票のファイルの名前ではないのだ。1番の答えは、カの、原価（製造）なのだ。"],["めたん","2番は、完成品の原価計算票をファイルしたもの。完成したら製品ね。"],["ずんだもん","その通りなのだ。完成した製品の票は、製品元帳に移すのだ。答えは、オの製品なのだ。"],["めたん","3番は、材料カードをファイルしたもの。これは材料でしょ。"],["ずんだもん","材料ごとの受け入れと払い出しを書いたカードなのだ。答えは、キの材料なのだ。"],["めたん","作りかけは原価元帳、できたら製品元帳、材料は材料元帳ね。"]],[["めたん","4番は、実際消費量を何々法で把握しても、特定の製品にしか使わないなら賦課できる、ね。"],["ずんだもん","消費量の測り方は2つあるのだ。継続記録法と、棚卸計算法なのだ。"],["ずんだもん","継続記録法は、払い出すたびに記録するのだ。どの製品に使ったかも分かるのだ。"],["ずんだもん","棚卸計算法は、月初と仕入れを足して、月末の棚卸の量を引くのだ。"],["めたん","それだと、使った量は出ても、どの製品に使ったかは分からないわね。"],["ずんだもん","そうなのだ。棚卸計算法は楽だけど、何に使ったかの内訳が分からないのだ。"],["ずんだもん","でも、その材料を1つの製品にしか使わないなら、全部その製品の分だと分かるのだ。"],["ずんだもん","だから、それでも賦課できる、という文になるのだ。4番の答えは、ナの棚卸計算なのだ。"],["めたん","5番と6番は、段取時間と段取費。段取って、準備のことよね。"],["ずんだもん","そうなのだ。作る製品を切り替える時の、機械の準備や調整のことなのだ。"],["ずんだもん","講義3-2では、手を洗ってからパンをこね出す、その手を洗う時間が段取だ、とたとえていたのだ。"],["ずんだもん","段取をしないと加工できないのだ。切っても切り離せないのだ。"],["ずんだもん","日本では、段取時間は直接作業時間に含めることが多いのだ。だから5番は、サの直接作業時間なのだ。"],["ずんだもん","段取費も、直接労務費に含めることが多いのだ。6番は、ソの直接労務費なのだ。"],["めたん","後ろの文に、自動化されても5番が生じる、ってあるわ。機械が全部やってくれるのに？"],["ずんだもん","機械が自動で加工しても、段取は人がやるのだ。だから、直接作業時間が出てくるのだ。"],["めたん","5番が同じ言葉で2回出るから、そこで確かめられるのね。"]],[["ずんだもん","第2問は、全部原価計算と直接原価計算の、営業利益の違いを見る問題なのだ。"],["めたん","資料を順に読むわよ。販売単価は4,000円。"],["ずんだもん","1個あたりの標準製造変動費が、1,500円なのだ。"],["めたん","製造固定費の予算は、1期で12,000,000円ね。"],["ずんだもん","正常作業時間は、1期で24,000時間なのだ。1個作るのに2時間かかるのだ。"],["めたん","正常作業時間って、ふだん働く時間の目安、くらいの意味かしら。"],["ずんだもん","そうなのだ。毎期これくらい働く、という基準の時間なのだ。固定費をこれで割って、配賦率を作るのだ。"],["めたん","販売費と一般管理費は、全部固定費で3,200,000円。"],["ずんだもん","生産と販売の表も大事なのだ。販売量は、4期とも10,000個なのだ。"],["ずんだもん","生産量は、第1期が12,000個、第2期が11,000個、第3期が10,000個、第4期が9,500個なのだ。"],["めたん","売る量は同じで、作る量だけ変えてるのね。"],["ずんだもん","その通りなのだ。作る量だけ変えると、利益がどう動くかを見る問題なのだ。"],["ずんだもん","もう1つ、原価差異は操業度差異だけで、売上原価に足す、と書いてあるのだ。"]],[["ずんだもん","問1は、全部原価計算で、第1期の営業利益を出すのだ。答案の問1の欄が埋まるのだ。"],["めたん","全部原価計算の全部って、変動費も固定費も全部、って意味よね。"],["ずんだもん","そうなのだ。全部を製品の原価に入れるのだ。"],["めたん","じゃあ、製品1個に固定費がいくら入るかが要るのね。"],["ずんだもん","その通りなのだ。1回目は、ここで固定費を1個あたりにしなかったのだ。"],["めたん","固定費12,000,000円を、作った12,000個で割ればいいのかしら。"],["ずんだもん","惜しいのだ。この問題は、時間で配賦するのだ。まず、1時間あたりにするのだ。"],["ずんだもん","予算の12,000,000円を、正常作業時間の24,000時間で割るのだ。12,000,000÷24,000で、1時間あたり500円なのだ。"],["めたん","1個は2時間かかるから、500円×2時間で、1,000円ね。"],["ずんだもん","その通りなのだ。これは問3のイの答えにもなるのだ。"],["めたん","変動費1,500円と足して、製品1個は2,500円。"],["ずんだもん","完璧なのだ。"]],[["めたん","第1期は、12,000個作って10,000個売ったのよね。"],["ずんだもん","そうなのだ。売上原価は、売れた10,000個の分だけなのだ。"],["ずんだもん","2,500円×10,000個で、25,000,000円なのだ。"],["めたん","固定費は12,000,000円かかってるのに、売上原価には10,000,000円しか入ってないわ。"],["ずんだもん","残りの2,000,000円は、売れ残った2,000個に乗って、期末の製品として次の期へ行くのだ。"],["ずんだもん","操業度差異も確かめるのだ。第1期は12,000個作ったので、12,000×2時間で24,000時間なのだ。"],["めたん","正常作業時間とぴったり同じ。じゃあ、操業度差異は0ね。"],["ずんだもん","その通りなのだ。あとは営業利益なのだ。"],["ずんだもん","売上高は、4,000円×10,000個で、40,000,000円なのだ。"],["ずんだもん","売上原価の25,000,000円を引いて、売上総利益は15,000,000円なのだ。"],["ずんだもん","販売費と一般管理費の3,200,000円を引いて、営業利益は11,800,000円なのだ。"],["めたん","1回目は9,800,000円だった。どこで違ったのかしら。"],["ずんだもん","固定費12,000,000円を、全部売上原価に入れた数字なのだ。それは、次の問2の直接原価計算と同じ答えになるのだ。"],["ずんだもん","問1の欄は、11,800,000円なのだ。"]],[["ずんだもん","問2は、直接原価計算で、第1期の営業利益を出すのだ。問2の欄が埋まるのだ。"],["めたん","直接原価計算は、変動費だけを製品の原価にするのよね。"],["ずんだもん","そうなのだ。固定費は、作った量に関係なく、その期の費用に全額入れるのだ。"],["めたん","変動費は売れた10,000個の分だから、1,500円×10,000個で、15,000,000円。"],["ずんだもん","売上高の40,000,000円から引いて、貢献利益は25,000,000円なのだ。"],["めたん","固定費は、製造の12,000,000円と、販売費と一般管理費の3,200,000円で、15,200,000円ね。"],["ずんだもん","25,000,000から15,200,000を引いて、営業利益は9,800,000円なのだ。"],["めたん","問1と2,000,000円違うわね。"],["ずんだもん","その2,000,000円は、さっきの、売れ残りに乗って次へ行った固定費なのだ。"],["ずんだもん","問2の欄は、9,800,000円なのだ。"]],[["ずんだもん","問3の1番では、第2期を例に、ア、イ、ウ、エを埋めるのだ。"],["めたん","アは、期首と比べて、期末の製品在庫が何個増えたか、ね。"],["ずんだもん","まず第2期の期首を出すのだ。第1期の売れ残りの2,000個なのだ。"],["めたん","第2期は、11,000個作って10,000個売ったわね。"],["ずんだもん","期首2,000個に11,000個を足して、10,000個を引くと、期末は3,000個なのだ。"],["ずんだもん","2,000個から3,000個へ、1,000個増えたのだ。アは1,000なのだ。"],["めたん","もっと簡単に、作った量から売った量を引いても出るわね。"],["ずんだもん","その通りなのだ。11,000−10,000で、1,000個なのだ。"],["めたん","イは、製品1個あたりの標準製造固定費。問1で出した1,000円ね。"],["ずんだもん","そうなのだ。イは1,000なのだ。"]],[["めたん","ウとエは、全部原価計算の利益が、直接原価計算よりいくら大きいか、小さいか、ね。"],["ずんだもん","問題文に、ウはア個かけるイ円で計算できる、と書いてあるのだ。"],["めたん","1,000個×1,000円で、1,000,000円。"],["ずんだもん","その通りなのだ。"],["めたん","大きいか小さいかは、どっちかしら。"],["ずんだもん","在庫が増えた期は、増えた在庫に固定費が乗って、次の期へ繰り越されるのだ。"],["ずんだもん","その分、全部原価計算の方が、今期の費用が少なくなるのだ。だから、利益は大きいのだ。"],["めたん","本当にそうなるか、損益計算書で確かめてみて。"],["ずんだもん","全部原価計算の第2期は、売上原価が25,000,000円に、操業度差異を足すのだ。"],["ずんだもん","11,000個×2時間で22,000時間。正常の24,000時間より2,000時間少ないのだ。"],["めたん","2,000時間×500円で、1,000,000円の不利差異ね。"],["ずんだもん","そうなのだ。売上原価は26,000,000円になるのだ。"],["ずんだもん","営業利益は、40,000,000−26,000,000−3,200,000で、10,800,000円なのだ。"],["めたん","直接原価計算は、売る量が同じだから毎期9,800,000円。差は1,000,000円で、ぴったりね。"],["ずんだもん","ウは1,000,000、エは大きい、なのだ。"]],[["めたん","2番は第4期ね。オは、期末の在庫が何個減ったか。"],["ずんだもん","第4期は、9,500個作って10,000個売ったのだ。"],["めたん","作った量より500個多く売ったから、500個減ったのね。"],["ずんだもん","その通りなのだ。オは500なのだ。"],["ずんだもん","念のため在庫も追うのだ。第3期は作った量と売った量が同じ10,000個なので、第3期の期末も3,000個のままなのだ。"],["ずんだもん","3,000個から500個減って、第4期の期末は2,500個なのだ。"],["めたん","カは、オ個かけるイ円だから、500個×1,000円で500,000円。"],["ずんだもん","そうなのだ。今度は、大きいか小さいかが逆になるのだ。"],["ずんだもん","在庫が減った期は、前の期から繰り越した固定費が、今期の売上原価に入ってくるのだ。"],["めたん","費用が増えるから、全部原価計算の方が利益は小さいのね。"],["ずんだもん","その通りなのだ。確かめるのだ。"],["ずんだもん","第4期の操業度差異は、9,500個×2時間で19,000時間。正常より5,000時間少ないのだ。"],["ずんだもん","5,000時間×500円で、2,500,000円の不利差異なのだ。"],["ずんだもん","売上原価は27,500,000円、営業利益は9,300,000円なのだ。直接原価計算の9,800,000円より500,000円小さいのだ。"],["ずんだもん","カは500,000、キは小さい、なのだ。"]],[["めたん","3番は、第3期の生産量が10,000個じゃなくて12,000個だったら、ね。"],["ずんだもん","ク、ケ、コを埋めるのだ。1回目はクが空欄だったのだ。"],["ずんだもん","ここは、コから考えるのだ。問題文は、クの金額は、第3期のコの金額と同じ、と言っているのだ。"],["ずんだもん","そして、正常生産量いっぱい作ると、コが発生しない、とも書いてあるのだ。"],["めたん","いっぱい作ると消える差異って、操業度差異ね。"],["ずんだもん","その通りなのだ。コは、操業度差異なのだ。"],["めたん","じゃあ、第3期の操業度差異を出せば、クになるのね。"],["ずんだもん","第3期は10,000個なので、10,000×2時間で20,000時間なのだ。"],["めたん","正常の24,000時間より4,000時間少ないから、4,000×500円で、2,000,000円。"],["ずんだもん","その通りなのだ。12,000個作ると、ちょうど24,000時間になって、この2,000,000円が消えるのだ。"],["ずんだもん","売上原価に足していた不利差異が消えるので、利益は2,000,000円増えるのだ。"],["めたん","売る量は同じなのに、作るだけで利益が増えるなんて、ちょっとずるい気がするわ。"],["ずんだもん","増やした2,000個は在庫になって、その固定費が次の期へ繰り越されるだけなのだ。"],["ずんだもん","クは2,000,000、ケは増加する、コは操業度差異なのだ。"],["めたん","1回目は、コが書けてたのに、クが空欄だったのよね。"],["ずんだもん","そうなのだ。後ろの設問が、前の答えの手がかりになっていることがあるのだ。空欄が残ったら、同じ大問をもう一度読むのだ。"]],[["めたん","最後のサは、在庫変動の影響を受けないので、利益計画に適しているのはどっち、ね。"],["ずんだもん","ここまでの結果を並べるのだ。直接原価計算の営業利益は、4期とも9,800,000円だったのだ。"],["ずんだもん","全部原価計算は、11,800,000円、10,800,000円、9,800,000円、9,300,000円と動いたのだ。"],["めたん","売る量は同じなのに、作る量で利益が動いてる。これじゃ計画は立てにくいわね。"],["ずんだもん","そうなのだ。直接原価計算の利益は、売る量だけで決まるのだ。だから計画が立てやすいのだ。"],["ずんだもん","全部原価計算だと、売っていなくても、作ってさえいれば利益を上げられてしまうのだ。"],["ずんだもん","サは、直接原価計算なのだ。"],["ずんだもん","まとめると、在庫が増えれば全部原価計算の方が大きい、減れば小さいのだ。差は、在庫の増減かける1個あたりの固定費なのだ。"],["ずんだもん","講義14-1では、これを、ぜん、ちょく、まっ、しゅ、と覚えていたのだ。"],["めたん","ぜん、ちょく、まっ、しゅ。呪文みたいね。"],["ずんだもん","全部の利益ひく直接の利益は、期末の在庫の固定費ひく期首の在庫の固定費、という式なのだ。"],["ずんだもん","覚え方は、マッシュルームみたいに、全直マッシュ、なのだ。"],["めたん","覚えやすいわね。第2期なら、期末3,000個と期首2,000個の差の1,000個に、1,000円をかけるのね。"],["ずんだもん","全部原価計算と書いてあったら、まず固定費を1個あたりにする。これが今回の一番大事な一手なのだ。"]]],"shorts":[{"hl":"固定費は/[時間]から1個あたりに","at":212.58,"blob":"941909df71ea5d9707d849b9ddf36ae2"},{"hl":"在庫が増えたら/[全部]の利益が大きい","at":385.3,"blob":"3efde269535a0d409a5fc738b8ac0e2b"},{"hl":"利益計画に向くのは/[直接原価計算]","at":558.23,"blob":"c3dfaf571b9b85893e87d713ee58598d"}],"drops":[{"prob":"第2問問1","at":"2026-09-19","kind":"run","pair":null,"what":"全部原価計算で、どの固定費を1個あたりにするか","n":0,"vs":"","seek":212.58}]},{"kind":"exam","no":"164回","sub":"過去問","ch":164,"probs":[],"hl":"[正常仕損費]を/[誰に]配る？","acct":"過去問","id":"x164-ge","title":"原価計算","sn":"原計","w":0.669,"wt":["最初に紙に書いた数字が、その後の判断の前提として固定される"],"video":{"blob":"ab10eadc87f8c45f4af9e1082fbeb48a","secs":699.98,"mb":8.2},"scenes":[[0,"原価計算の全体像"],[31.06,"第1問：品質原価計算（①〜③）"],[99.87,"第1問：ライフサイクル・コスティング（④⑤）"],[138.1,"第2問：資料とタイムテーブル"],[180.04,"第2問：どの方法で計算するか"],[226.3,"第2問：原料費の箱"],[276.61,"第2問：加工費の箱"],[327.45,"第2問：正常仕損費を出す"],[360.65,"第2問：正常仕損費を誰に配るか"],[452.55,"第2問：異常仕損費を出す（問1）"],[490.86,"第2問：異常仕損費の会計処理（問2）"],[566.23,"第2問：完成品原価と月末仕掛品原価（問3）"],[634.73,"第2問：売上総利益（問4）"]],"script":[[["ずんだもん","今回は、164回の原価計算を、最初から最後まで解くのだ。"],["ずんだもん","第1問は正しいものを全部選ぶ問題、第2問は仕損が出る総合原価計算なのだ。"],["めたん","本人の点数から聞かせて。"],["ずんだもん","1回目は30分で切り上げて、25点中7点だったのだ。1週間後の2回目は22点なのだ。"],["めたん","2回目は3点だけ落としたのね。どこかしら。"],["ずんだもん","異常仕損費の1か所だけなのだ。下書きには答えが出ていたのに、足さずに写してしまったのだ。"],["めたん","じゃあ今回は、第2問の流れを最初から最後まで追うのね。"],["ずんだもん","そうなのだ。第2問は、問1の答えが問3と問4につながっているのだ。1つずつ積み上げるのだ。"]],[["ずんだもん","第1問は、5つの文から、正しいものの番号を全部選ぶのだ。答案の第1問の欄が埋まるのだ。"],["めたん","①から③は、品質原価計算の話ね。品質にかかったお金を集める計算、くらいのイメージだけど。"],["ずんだもん","それで合っているのだ。集めた原価を、品質の改善に役立てるのだ。"],["ずんだもん","品質原価は4つに分けるのだ。予防原価、評価原価、内部失敗原価、外部失敗原価なのだ。"],["めたん","予防と評価は、名前でなんとなく分かるわ。"],["ずんだもん","予防原価は、不良を出さないための教育や訓練なのだ。評価原価は、検査やテストの費用なのだ。"],["ずんだもん","内部失敗原価は、社内で不良が見つかった時の原価。仕損がここに入るのだ。"],["ずんだもん","外部失敗原価は、お客さんに渡した後で不良が見つかった時の原価。リコールがここなのだ。"],["めたん","①は、通常の原価計算は費目別・部門別・製品別だから、品質の原価を見るには不十分、ね。"],["ずんだもん","品質のための費用は、いろいろな部門や費目に散らばっているのだ。いつもの集め方では見えないのだ。だから①は正しいのだ。"],["めたん","②は、外部失敗原価に、リコール費用や仕損費が含まれる。リコールは外部失敗で合ってるわね。"],["ずんだもん","そうなのだ。でも仕損は社内で起きるので、内部失敗原価なのだ。②は間違いなのだ。"],["めたん","③は、品質原価計算は設計品質に焦点を当てる。品質なんだから、設計でいいんじゃない？"],["ずんだもん","そこが引っかけなのだ。品質原価計算が見るのは、設計どおりに作れたか、という適合品質なのだ。③は間違いなのだ。"]],[["めたん","④と⑤は、ライフサイクル・コスティングね。"],["ずんだもん","製品を開発してから、使われて、捨てられるまでの、一生分のコストを計算するのだ。"],["めたん","④は、会社の外で発生する原価も含むようになっている、ね。"],["ずんだもん","使う人の運用や保守、処分の費用も、一生分に入るのだ。これは会社の外で起きるのだ。④は正しいのだ。"],["めたん","⑤は、各段階のコストの間には、トレードオフの関係はない、ね。"],["ずんだもん","トレードオフは、片方を減らすと、もう片方が増える関係なのだ。"],["めたん","安物買いの銭失い、みたいな話ね。"],["ずんだもん","まさにそれなのだ。安く作ると壊れやすくなって、使う人の修理代が増えるのだ。だから、関係はあるのだ。⑤は間違いなのだ。"],["めたん","残ったのは、①と④ね。"],["ずんだもん","第1問の欄は、①と④なのだ。本人は2回とも正解なのだ。"]],[["ずんだもん","第2問は、仕損が出る総合原価計算なのだ。まず資料を図にするのだ。"],["めたん","月初仕掛品が100キロで、進捗度50パーセント。当月投入が4,400キロ。"],["ずんだもん","正常仕損が60キロで20パーセントの点、異常仕損が40キロで80パーセントの点で出たのだ。"],["めたん","月末仕掛品が100キロで50パーセント、完成品が4,300キロね。"],["ずんだもん","原料は工程の始点で全部入れるのだ。仕損は全部、当月に作り始めた分から出た、とも書いてあるのだ。"],["ずんだもん","これをタイムテーブルにするのだ。工程の始まりから終わりまで1本の線を引いて、進捗度の点に印をつけるのだ。"],["めたん","20パーセントに正常仕損、50パーセントに月初と月末、80パーセントに異常仕損ね。"],["ずんだもん","その通りなのだ。描く目的は、誰が正常仕損の点を通ったかを、目で見るためなのだ。"],["ずんだもん","これが後で、正常仕損費を誰に配るかを決めるのだ。"]],[["めたん","仕損費の計算って、度外視法と非度外視法があったわよね。"],["ずんだもん","度外視法は、仕損をいなかったことにして、良品だけで原価を割る方法なのだ。"],["ずんだもん","非度外視法は、仕損品の原価を一度きちんと計算して、それから良品に配る方法なのだ。"],["めたん","楽そうだから、度外視法でいきたいわ。"],["ずんだもん","それはできないのだ。答案用紙が、正常仕損費の金額を聞いているのだ。"],["ずんだもん","度外視法だと、正常仕損費の金額が出てこないのだ。だから非度外視法で計算するのだ。"],["めたん","注意書きにも、発生の点で負担を考えること、ってあるわね。"],["ずんだもん","その通りなのだ。異常仕損品は80パーセントの点で出たので、20パーセントの正常仕損の点を通っているのだ。"],["ずんだもん","だから異常仕損品にも、正常仕損費を負担させるのだ。ここが2回とも落ちた所につながるのだ。"],["めたん","完成品と月末への配り方は、先入先出法って書いてあるわ。"],["ずんだもん","月初仕掛品を先に仕上げて、残りを当月に作り始めた分から完成させる、と考えるのだ。"]],[["ずんだもん","原料費と加工費は、別々の箱で計算するのだ。まず原料費なのだ。"],["めたん","原料費は、当月352,000円ね。"],["ずんだもん","原料は始点で入れるので、当月に入れた量は4,400キロなのだ。"],["めたん","先入先出法だから、当月の分だけで割るのよね。352,000÷4,400で、1キロ80円。"],["ずんだもん","その通りなのだ。"],["ずんだもん","正常仕損品は、60キロ×80円で4,800円なのだ。"],["ずんだもん","異常仕損品は、40キロ×80円で3,200円。月末仕掛品は、100キロ×80円で8,000円なのだ。"],["めたん","完成品は4,300キロだから、4,300×80円ね。"],["ずんだもん","そこは注意なのだ。月初仕掛品の100キロは、原料をもう先月に入れてあるのだ。"],["ずんだもん","当月の原料を使った完成品は、4,300−100で4,200キロなのだ。4,200×80円で、336,000円なのだ。"],["めたん","月初仕掛品原価の14,400円は、どこへ行くの？"],["ずんだもん","原料費と加工費が混ざった金額なのだ。問3で、完成品にまとめて足すのだ。"]],[["めたん","次は加工費ね。当月260,640円。"],["ずんだもん","加工費は、進捗度をかけた量で数えるのだ。これを加工換算量と呼ぶのだ。"],["めたん","完成品は100パーセントだから、4,300キロのままね。"],["ずんだもん","完成品全体はそうなのだ。でも月初仕掛品は、先月に50パーセントまで加工済みなのだ。"],["ずんだもん","100キロの50パーセントで50キロ分は先月の仕事なので、当月の完成品の分は、4,300−50で4,250キロなのだ。"],["めたん","正常仕損は60キロの20パーセントで12キロ、異常仕損は40キロの80パーセントで32キロね。"],["ずんだもん","月末仕掛品は100キロの50パーセントで50キロなのだ。"],["めたん","足すと、4,250と12と32と50で、4,344キロ。"],["ずんだもん","260,640÷4,344で、1キロあたり60円なのだ。"],["ずんだもん","正常仕損は12×60で720円。異常仕損は32×60で1,920円なのだ。"],["ずんだもん","月末仕掛品は50×60で3,000円。完成品は4,250×60で255,000円なのだ。"]],[["ずんだもん","ここから問1なのだ。正常仕損費と異常仕損費の欄が埋まるのだ。"],["めたん","正常仕損品の原料費4,800円と、加工費720円を足して、5,520円ね。"],["ずんだもん","まだ終わりではないのだ。問題文に、使っていない数字が残っているのだ。"],["めたん","あっ、廃棄費用ね。正常仕損品の廃棄費用は556円。"],["ずんだもん","そうなのだ。仕損品は再利用できずに捨てて、その費用は仕損費にする、と書いてあるのだ。"],["ずんだもん","5,520に556を足して、正常仕損費は6,076円なのだ。"],["めたん","これで正常仕損費の欄は6,076円ね。本人は2回とも正解。"],["ずんだもん","でも異常仕損費は、この6,076円を配ってからでないと決まらないのだ。"]],[["ずんだもん","6,076円を配る相手は、当月に、20パーセントの正常仕損の点を通った物なのだ。"],["めたん","完成品は全部通ってるから、4,300キロ全部ね。"],["ずんだもん","そこが落とし穴なのだ。完成品のうち、月初仕掛品の100キロは、先月もう50パーセントまで進んでいたのだ。"],["ずんだもん","20パーセントの点は、先月に通り過ぎているのだ。だから、当月の正常仕損費は負担しないのだ。"],["めたん","先入先出法だから、月初の分は先月の話、ってわけね。"],["ずんだもん","講義8-3では、先入先出法は、期首からは仕損が出ない、という仮定を置くのだ、と言っていたのだ。"],["ずんだもん","だから、月初の進捗度が何パーセントでも、指示がない限り月初は外すのだ。講師は、1ひく期首、対、1、と呼んでいたのだ。"],["ずんだもん","完成品のうち配る量は、4,300−100で4,200キロなのだ。"],["めたん","月末仕掛品は50パーセントまで進んでるから、20パーセントの点を当月に通ってる。100キロね。"],["ずんだもん","その通りなのだ。"],["めたん","異常仕損品は80パーセントで出たから、これも通ってる。でも、異常な物に正常な費用を負担させるのは、ちょっと変な気もするわ。"],["ずんだもん","講義8-4では、考え方が2つあると言っていたのだ。通った物みんなで負担する考え方と、異常には負担させない考え方なのだ。"],["ずんだもん","この問題は、注意書きで、発生の点で負担を考えること、と決めているのだ。だから負担させるのだ。"],["めたん","じゃあ、4,200と100と40で、4,340キロ。"],["ずんだもん","そうなのだ。1回目は、4,300と100と40を足した4,440キロで割ろうとしていたのだ。月初の100キロを引いていなかったのだ。"],["ずんだもん","6,076÷4,340で、1キロあたり1.4円なのだ。"],["ずんだもん","完成品は4,200×1.4で5,880円。月末仕掛品は100×1.4で140円。異常仕損品は40×1.4で56円なのだ。"],["めたん","検算するわよ。5,880と140と56で、6,076円。ぴったりね。"]],[["ずんだもん","異常仕損費は、3つを足すのだ。異常仕損品の原料費と加工費、配られた正常仕損費、そして廃棄費用なのだ。"],["めたん","原料費3,200円と加工費1,920円で、5,120円。"],["ずんだもん","配られた正常仕損費が56円なのだ。"],["めたん","廃棄費用は、異常仕損品の分が324円だったわね。"],["ずんだもん","5,120と56と324を足して、異常仕損費は5,500円なのだ。"],["めたん","2回目の答えは5,444円。56円だけ足りないのね。"],["ずんだもん","下書きには、5,444の後ろに、たす56、まで書いてあったのだ。答案に写す時に足さなかったのだ。"],["めたん","式が、イコールで閉じてない所は、写す前に閉じる、ね。"],["ずんだもん","その通りなのだ。問1の欄は、正常仕損費6,076円、異常仕損費5,500円なのだ。"]],[["ずんだもん","問2は、番号を1つ選んで、理由を40字以内で書くのだ。"],["めたん","異常仕損が、機械の整備不良による故障で出た時、ね。選択肢は、製品原価、一般管理費、営業外費用、特別損失。"],["ずんだもん","まず、異常仕損費は、原価に入れないのだ。"],["めたん","異常なものだから、原価じゃない、ってこと？"],["ずんだもん","そうなのだ。原価は、ふつうの状態で作った時にかかるもの、という性質があるのだ。異常な原因で出た損は、それを満たさないのだ。"],["ずんだもん","だから非原価項目なのだ。①の製品原価と、②の一般管理費は外れるのだ。"],["めたん","残りは、営業外費用か特別損失ね。"],["ずんだもん","営業外費用は、本業以外で、いつも起こり得る費用なのだ。特別損失は、たまたま臨時に起きた損失なのだ。"],["めたん","整備不良なら、ちゃんと整備していれば防げたはずよね。"],["ずんだもん","その通りなのだ。会社が管理できる原因なので、臨時の災害とは違うのだ。だから③の営業外費用なのだ。"],["めたん","でも講義では、異常な仕損は特別損失、って言ってた気がするわ。"],["ずんだもん","講義1-1では、異常な仕損や火災を、特別損失の例に挙げていたのだ。ふつうはそう覚えておいていいのだ。"],["ずんだもん","でもこの問題は、原因が整備不良だと、わざわざ書いてあるのだ。その原因で、営業外か特別かを分けさせる問題なのだ。"],["ずんだもん","理由は、機械の整備不良は非原価項目である。また、管理可能であるため営業外費用に該当する、なのだ。"],["めたん","非原価項目、管理可能、営業外費用、の3つを入れればいいのね。"],["ずんだもん","そうなのだ。1回目は空欄だったのだ。計算の要らない設問は、先に埋めるのが大事なのだ。"]],[["ずんだもん","問3は、仕損費を配った後の、完成品原価と月末仕掛品原価なのだ。"],["めたん // ---------- 画面の状態 ----------
let tab = "home", homeChip = "すべて", pickCh = null, showAll = false, meView = null, fChip = "すべて", searching = false, q = "";
let queue = [], usage = null;

const viewKey = () => searching ? "search" : tab + (tab === "list" ? (showAll ? ":all" : ":" + pickCh) : tab === "me" ? ":" + meView : "");

let toastT = 0;

// ホーム：動画のある講義だけ。弱点と未視聴を多めに混ぜる（並びは同じ日のあいだ変わらない）
function rnd(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return (((h >>> 0) % 99991) + 1) / 99992; }
const today = (d => d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate())(new Date());
function homeOrder() {
  return V.filter(v => v.video)
    .map(v => ({ v, k: Math.pow(rnd(today + v.id), 1 / ((1 + 2 * v.w) * (seen(v.id) ? (finished(v.id) ? .3 : 1.5) : 2))) }))
    .sort((a, b) => b.k - a.k).map(x => x.v);
}
let order = homeOrder();
const HOME_CHIPS = {
  "すべて": () => true,
  "弱点": v => lvl(v) > 0,
  "未視聴": v => !seen(v.id),
};
// 科目のチップは、1つのアカウントに2種類以上あるときだけ（分けた後の本番は1種類なので出ない）
// 講義の科目が1つだけのアカウント（分けた後の本番）では、講義のチップの名前は「講義」
if (KINDS.length > 1) KINDS.forEach(k => {
  if (k === "過去問") HOME_CHIPS[k] = isExam;
  else if (k === "問題") HOME_CHIPS[k] = isProb;
  else HOME_CHIPS[LSUBS.length > 1 ? k : "講義"] = v => isLec(v) && v.sub === k;
});
function renderHome() {
  const cont = V.filter(v => v.video && seen(v.id) && !finished(v.id)).sort((a, b) => pg(b.id).at - pg(a.id).at);
  const list = order.filter(HOME_CHIPS[homeChip]);
  return `<header class="top"><span class="logo"><i></i>ずんだ講義</span><button class="ico sbtn" data-search aria-label="検索">${I.search}</button></header>
  <div class="chips" role="group" aria-label="絞り込み">${Object.keys(HOME_CHIPS).map(c =>
    `<button class="chip" data-chip="${c}" aria-pressed="${c === homeChip}">${c}<span class="n">${order.filter(HOME_CHIPS[c]).length}</span></button>`).join("")}</div>
  ${cont.length ? `<section class="sec"><div class="sech"><h2>続きから</h2></div><div class="row">${cont.map(mini).join("")}</div></section>` : ""}
  <div class="feed">${list.map(card).join("") || '<p class="empty">この条件の講義はありません</p>'}</div>`;
}

// ショート
// 並びはランダム（本人 2026-09-29「ショート動画の順番はランダムでいいよ」）。開くたびに変わり、開いている間は変わらない（戻ると同じ1本に戻れるように）
const shortSeed = String(Math.random());
const shortList = () => V.flatMap(v => (v.shorts || []).map((sh, i) => ({ v, sh, k: shortKey(v.id, i + 1) })))
  .map(x => ({ x, r: rnd(shortSeed + x.k) })).sort((a, b) => a.r - b.r).map(o => o.x);
function renderShorts() {
  return `<div class="shorts" id="shorts">${shortList().map(({ v, sh, k }) => {
    const at = sh.at;
    return `<article class="short" data-sid="${k}" style="--h:${hue(v.sub, v.ch)}">
      <span class="slabel">ショート</span>
      ${sh.blob ? `<video playsinline loop preload="metadata" src="v/${sh.blob}.mp4"></video>`
        : `<p class="shl">${hl(sh.hl)}</p><div class="sframe">${thumb(v)}</div>`}
      <div class="side">
        <button data-save="${k}"><i>${I.mark(saved(k))}</i>保存</button>

      </div>
      <div class="sfoot"><b>${name(v)}</b><small>${esc(place(v))}${sh.blob ? "" : "・ショートは準備中"}</small>
        <button class="gomain" data-open="${v.id}" data-fs="1" ${at != null ? `data-at="${at}"` : ""}>本編を見る${at != null && v.video ? `　${mmss(at)}から` : ""}</button></div>
      <div class="sline"><i></i></div>
    </article>`; }).join("") || '<p class="empty">ショートはまだありません</p>'}</div>`;
}
let shortWatch = null;
function watchShorts() {
  if (shortWatch) { shortWatch.disconnect(); shortWatch = null; }
  const box = document.getElementById("shorts");
  if (!box || !("IntersectionObserver" in window)) return;
  shortWatch = new IntersectionObserver(es => es.forEach(e => {
    const vid = e.target.querySelector("video");
    if (!vid) return;
    if (e.isIntersecting && e.intersectionRatio >= .6) vid.play().catch(() => {}); else vid.pause();
  }), { root: box, threshold: [0, .6] });
  box.querySelectorAll(".short").forEach(a => {
    shortWatch.observe(a);
    const vid = a.querySelector("video"), bar = a.querySelector(".sline i");
    if (!vid) return;
    vid.addEventListener("timeupdate", () => { if (vid.duration) bar.style.width = (vid.currentTime / vid.duration * 100).toFixed(1) + "%"; });
    vid.addEventListener("click", () => { if (vid.paused) vid.play().catch(() => {}); else vid.pause(); });
  });
}
function stopShorts() { document.querySelectorAll("#shorts video").forEach(x => x.pause()); }

// 検索
function results() {
  const words = norm(q).trim().split(/\s+/).filter(Boolean);
  if (!words.length) return "";
  const hit = V.filter(v => {
    const c = (v.core ? JSON.stringify(v.core) : "") + (v.script ? JSON.stringify(v.script) : "");
    const h = norm([v.no, isExam(v) ? "過去問 第" + v.no + " " + v.sn : isProb(v) ? "問題" + v.no : "講義" + v.no, v.title, v.sub, chName(v.sub, v.ch), v.hl, c, ...(v.probs || [])].join(" "));
    return words.every(w => h.includes(w));
  });
  return hit.map(v => li(v.id)).join("") || '<p class="empty">見つかりませんでした</p>';
}
function renderSearch() {
  return `<div class="backbar"><button class="ico" data-back aria-label="戻る">${I.back}</button>
    <input id="q" type="search" value="${esc(q)}" placeholder="講義・論点・数字で探す" aria-label="検索" autocomplete="off"></div>
    <div class="list" id="res">${results()}</div>`;
}

// 再生リスト：丸い章。優先＝弱点の重い章から
function chapterOrder() {
  const keys = [...new Set(V.map(chKey))];
  return keys.map(k => { const v = V.find(x => chKey(x) === k); return { sub: v.sub, ch: v.ch, k, w: chW(v.sub, v.ch) }; })
    .sort((a, b) => b.w - a.w || (a.sub === b.sub ? a.ch - b.ch : a.sub === "商会" ? -1 : 1));
}
function renderList() {
  const chs = chapterOrder();
  if (!pickCh) pickCh = chs[0].k;
  const top = chs.slice(0, 5);
  if (!top.some(c => c.k === pickCh)) top.push(chs.find(c => c.k === pickCh));
  const cur = chs.find(c => c.k === pickCh);
  const disc = c => `<button class="sub" data-ch="${c.k}" aria-pressed="${c.k === pickCh}">
      <span class="disc" style="--h:${hue(c.sub, c.ch)}">${discTxt(c.sub, c.ch)}${c.w >= .5 ? '<i class="dot" aria-label="弱点あり"></i>' : ""}</span>
      <span>${esc(chName(c.sub, c.ch))}</span></button>`;
  if (showAll) {
    const grp = sub => (CH[sub] || []).map((n, i) => {
      const k = sub + (i + 1), vs = chVideos(sub, i + 1), nv = vs.filter(v => v.video).length;
      return `<button class="chrow" data-ch="${k}" ${vs.length ? "" : "disabled"}><span class="disc" style="--h:${hue(sub, i + 1)}">${short(sub)}${i + 1}</span>
        <span class="nm">${esc(n)}</span><span class="cnt">${vs.length ? `${vs.length}本${nv ? `（動画${nv}）` : ""}` : "講義なし"}</span></button>`;
    }).join("");
    const grpX = () => EXAMS.map(r => {
      const vs = chVideos("過去問", r), nv = vs.filter(v => v.video).length;
      return `<button class="chrow" data-ch="過去問${r}"><span class="disc" style="--h:${hue("過去問", r)}">${r}</span>
        <span class="nm">第${r}回</span><span class="cnt">${nv ? `動画${nv}本` : "準備中"}</span></button>`;
    }).join("");
    const head = t => KINDS.length > 1 ? `<h3>${esc(t)}</h3>` : "";
    return `<div class="backbar"><button class="ico" data-back aria-label="戻る">${I.back}</button><h1>${SUBS.length ? "すべての章" : "すべての回"}</h1></div>
      <div class="grid-ch">${SUBS.map(s => head(SUBNAME[s] || s) + grp(s)).join("")}${EXAMS.length ? head("過去問") + grpX() : ""}</div>`;
  }
  const vids = chVideos(cur.sub, cur.ch);
  const done = vids.filter(v => finished(v.id)).length;
  return `<header class="top"><h1>再生リスト</h1><button class="ico sbtn" data-search aria-label="検索">${I.search}</button></header>
  <div class="subs">${top.map(disc).join("")}<button class="all" data-all>すべて</button></div>
  <div class="chhead"><h2>${esc(place(vids[0]))}</h2>
    <small>${cur.sub === "過去問" ? new Set(vids.map(v => v.sn[0] + v.sn[1])).size + "科目" : vids.length + "本"}・動画 ${vids.filter(v => v.video).length}本・見終わった ${done}本</small></div>
  <div class="feed">${vids.map(card).join("")}</div>`;
}

  const items = folderItems(f);
  const list = items.filter(k => fChip === "すべて" || (fChip === "ショート") === isShort(k));
  const first = items[0], fv = first && byId[keyId(first)];
  const can = items.some(k => !isShort(k) && byId[k].video);
  return `<div class="fhead" style="--h:${fv ? hue(fv.sub, fv.ch) : 140}">
      ${fv ? `<div class="fbg" aria-hidden="true">${thumb(fv, isShort(first) && shortOf(first))}</div>` : ""}
      <div class="ftop"><button class="ico" data-back aria-label="戻る">${I.back}</button><button class="ico" data-search aria-label="検索">${I.search}</button></div>
      <div class="fbody">${fv ? `<div class="fcover">${thumb(fv, isShort(first) && shortOf(first))}</div>` : ""}
        <h1>${esc(f.name)}</h1><small>${items.length}本</small>
        <button class="playall" data-playall="${f.id}" ${can ? "" : "disabled"}>${I.play}すべて再生</button></div>

// アカウントの切り替え（本人 2026-09-29「マイページのずんだもんのアイコンの上にアカウントボタンを作って押すと、他のアカウント(アーティファクト)に飛べるように」）
// 本番: ほかのアカウントのアーティファクトを今の画面で開く（url が無いものは押せない）。モック: 同じページの中で切り替える
// 顔: 今のアカウントは --zun（上で差し替え済み）。ほかのアカウントは顔があればその画像、無ければ色の丸に字
const acctAv = a => a.id === ACCT ? `<span class="av z" aria-hidden="true"></span>`
  : a.face ? `<span class="av z" style="background-image:url('${a.face}');box-shadow:none" aria-hidden="true"></span>`
  : `<span class="av" style="background:hsl(${a.hue} 42% 44%)" aria-hidden="true">${esc(a.abbr)}</span>`;
function acctSheet() {
  const row = a => {
    const inner = `${acctAv(a)}<span class="nm"><b>${esc(a.name)}</b><small>${esc(a.sub)}</small></span>`;
    if (a.id === ACCT) return `<div class="acrow">${inner}<svg class="ck" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12.5l5 5L20 6.5"/></svg></div>`;
    if (MOCK) return `<button class="acrow" data-acct="${esc(a.id)}">${inner}</button>`;
    // _top＝今の画面で開く。_blank だとホーム画面に追加した claude.ai から帯つきのブラウザで開いてしまう（本人 2026-09-29 のスクショ。_top は実機で「うまく行ってる」）
    return a.url ? `<a class="acrow" href="${esc(a.url)}" target="_top">${inner}</a>` : `<div class="acrow off">${inner}</div>`;
  };
  openSheet(`<div class="sheeth"><h2>アカウント</h2><button class="ico" data-back aria-label="閉じる">${I.close}</button></div>
    <div class="sbody accts">${ACCTS.filter(a => a.id === ACCT).map(row).join("")}
      <h3>その他のアカウント</h3>${ACCTS.filter(a => a.id !== ACCT).map(row).join("")}</div>`);
}
function renderMe() {

  if (meView === "hist") {
    return `<div class="backbar"><button class="ico" data-back aria-label="戻る">${I.back}</button><h1>履歴</h1></div>
      <div class="list">${hist.map(v => li(v.id, state(v))).join("") || '<p class="empty">まだありません</p>'}</div>`;
  }
  if (meView && folderOf(meView)) return renderFolder(folderOf(meView));
  const nv = V.filter(v => v.video).length, nl = V.filter(isLec).length, npb = V.filter(isProb).length;
  const me = ACCTS.length > 1 && ME;
  const cap = usage ? `<small${usage.bytes > 800 * 1048576 ? ' class="warn"' : ""}>動画の容量 ${(usage.bytes / 1048576).toFixed(0)}MB／${(usage.maxBytes / 1048576).toFixed(0)}MB</small>` : "";
  const acbtn = ACCTS.length > 1 ? `<button class="acbtn" data-accts>アカウント<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg></button>` : "<h1>マイページ</h1>";
  return `<header class="top">${acbtn}<button class="ico sbtn" data-search aria-label="検索">${I.search}</button></header>
  <div class="me"><span class="big" aria-hidden="true"></span><div><b>わたし</b>${me ? `<small>${esc(me.name)}</small>` : ""}<small>見終わった ${V.filter(v => finished(v.id)).length}本・動画 ${nv}本／${[nl ? `講義 ${nl}本` : "", npb ? `問題 ${npb}問` : "", EXAMS.length ? `過去問 ${EXAMS.length}回` : ""].filter(Boolean).join("・")}</small>${cap}</div></div>
  <section class="sec"><div class="sech"><h2><button data-hist>履歴 ›</button></h2></div>
    <div class="row">${hist.map(mini).join("") || '<p class="empty">まだありません</p>'}</div></section>
  <section class="sec"><div class="sech"><h2>お気に入りリスト</h2><button class="plus" data-newfolder aria-label="フォルダを作る">＋</button></div>
    <div class="row">${S.folders.map(f => { const its = folderItems(f), k = its[0], v = k && byId[keyId(k)];
      return `<button class="mini folder" data-folder="${f.id}">${v ? thumb(v, isShort(k) && shortOf(k)).replace(/<span class="dur[^<]*<\/span>/, "").replace(/<\/div>\s*$/, `<span class="cnt">${its.length}</span></div>`) : `<div class="th K"><span class="cnt">0</span></div>`}<b>${esc(f.name)}</b><small>${its.length}本</small></button>`; }).join("")}</div></section>`;
}
async function loadUsage() {
  if (MOCK || usage || !window.claude || !window.claude.use) return;
  try {
    const a = await window.claude.use("assets");
    if (!a) return;
    usage = (await a.list()).usage;
    if (tab === "me" && meView === null && !searching && document.getElementById("player").hidden && document.getElementById("sheet").hidden) rerender();
  } catch (e) {}
}

function render() {
  const app = document.getElementById("app");
  app.innerHTML = searching ? renderSearch() : tab === "home" ? renderHome() : tab === "shorts" ? renderShorts() : tab === "list" ? renderList() : renderMe();
  renderNav();
  const box = document.getElementById("shorts");
  if (box) { box.scrollTop = scrollMem[viewKey()] || 0; watchShorts(); }
  else window.scrollTo(0, scrollMem[viewKey()] || 0);
  if (tab === "me") loadUsage();
}

    const f = folderOf(d.fold);
    if (!f) return;
    if (e.target.checked) { if (!f.ids.includes(sheetKey)) f.ids.push(sheetKey); } else f.ids = f.ids.filter(x => x !== sheetKey);
    markLib();
  }
});
document.addEventListener("submit", e => {
  if (!e.target.matches("[data-newf]")) return;
  e.preventDefault();
  const n = document.getElementById("newname").value.trim();
  if (!n) return;
  S.folders.push({ id: "f" + Date.now().toString(36), name: n, ids: sheetKey ? [sheetKey] : [] }); markLib();
  if (sheetKey) saveSheet(sheetKey); else back();
});
render();
connect();
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));</script></body></html>
