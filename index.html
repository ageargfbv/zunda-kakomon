"間接労務費は、拾い漏れが多いのだ。直接工の間接作業と手待の分と足すのを、忘れないのだ。"]],[["ずんだもん","問2の賃金・給料勘定を埋めるのだ。直接工と間接工と事務員を、合わせた1つの勘定なのだ。"],["めたん","諸口は、払った額の合計ね。直接工の分と、間接工と事務員の分を足すわ。"],["ずんだもん","3,136,900なのだ。"],["めたん","次月繰越は、当月の未払ね。"],["ずんだもん","直接工の595,000と、間接工と事務員の462,900を足して、1,057,900なのだ。"],["めたん","前月繰越は、前月の未払の合計で、973,300ね。"],["ずんだもん","仕掛品は、直接労務費の1,107,600なのだ。"],["めたん","製造間接費は、直接工の間接の分と、間接工と事務員の分を足して、2,053,100になるわ。"],["ずんだもん","そして、賃率差異が60,800なのだ。"],["めたん","合計は、両方とも4,194,800ね。"],["ずんだもん","貸借がそろったので、問2は完成なのだ。"]],[["ずんだもん","次は経費なのだ。資料3の⑴を見るのだ。"],["めたん","製品Yは、原料を外注業者に無償支給して、加工の一部を頼んでいるのね。"],["ずんだもん","外注業者に払う加工賃が、376,400なのだ。"],["めたん","外注に払うお金は、何の費用になるのかしら。"],["ずんだもん","外注加工賃は、うちの会社の労働力ではないので、労務費ではないのだ。物でもないので、経費なのだ。"],["めたん","しかも、製品Yのためだけの加工ね。"],["ずんだもん","そうなのだ。製品との対応関係が明確なので、直接経費なのだ。"],["めたん","経費なのに、製品と直接つながっているのは珍しいわね。"],["ずんだもん","直接経費はレアなのだ。外注加工賃は、その代表なのだ。"],["めたん","11日に外注業者向けに出した原料Aの3,800kgは、どうなるの？"],["ずんだもん","問題文に、出庫記録は通常の出庫票による、とあるのだ。だから普通の払出と同じで、製品Yの直接材料費なのだ。"],["めたん","材料は材料費、加工の手間賃は経費、と分けるのね。"],["ずんだもん","その通りなのだ。"],["めたん","⑵の521,200は、何の経費？"],["ずんだもん","ほかの資料に出てこない間接経費なのだ。そのまま製造間接費に入れるのだ。"]],[["ずんだもん","ここで、製造間接費の実際発生額をまとめるのだ。"],["めたん","間接材料費、間接労務費、間接経費の3つを集めるのね。"],["ずんだもん","間接材料費は、補助材料BとCの1,201,700なのだ。"],["めたん","間接労務費は、問2で出した2,053,100ね。"],["ずんだもん","間接経費は、内部副費と棚卸減耗損と、その他の間接経費の3つなのだ。"],["めたん","足すと、1,141,560になるわ。"],["ずんだもん","3つの費目を足して、実際発生額は4,396,360なのだ。"],["めたん","材料と労務費の場面で出した数字が、全部ここに集まってくるのね。"],["ずんだもん","そうなのだ。一か所でも拾い漏れると、問3の差異が全部ずれるのだ。"]],[["ずんだもん","次は資料4の、製造間接費の予定配賦なのだ。"],["めたん","製造間接費は、直接作業時間を基準に予定配賦する、とあるわ。"],["ずんだもん","製造間接費は、工場全体でいくらかかったかしか分からないのだ。だから何かの基準で製品に配るのだ。これを配賦と言うのだ。"],["めたん","時間で配るのは、どうして？"],["ずんだもん","製造間接費の多くは、減価償却費のように、時の経過とともに発生するからなのだ。"],["めたん","予定配賦率は、年間の予算を、年間の基準操業度で割るのね。"],["ずんだもん","変動費と固定費を合わせた年間予算を、9,000時間で割って、1時間6,000円なのだ。"],["めたん","内訳は、変動費率が1,800円、固定費率が4,200円になるわ。"],["ずんだもん","そうなのだ。1時間作業するたびに、製品に6,000円ずつ製造間接費を乗せていくのだ。"],["めたん","製品Xは450時間だから、2,700,000ね。"],["ずんだもん","製品Yは260時間で、1,560,000なのだ。合わせて予定配賦額は4,260,000なのだ。"]],[["ずんだもん","問3は、配賦差異を、予算差異と操業度差異に分けるのだ。"],["めたん","実際発生額から予定配賦額を引くと、差は136,360ね。"],["ずんだもん","この差を、シュラッター図で2つに分けるのだ。年間のデータは、12で割って1か月にするのだ。"],["めたん","月の基準操業度は750時間、固定費予算は3,150,000になるわ。"],["ずんだもん","右下から書くのだ。750時間の所に縦線を立てて、固定費予算と変動費予算を積むのだ。"],["ずんだもん","基準操業度はノーマルアワーと呼んで、NHと書くのだ。"],["めたん","実際の直接作業時間は、710時間ね。"],["ずんだもん","こちらはアクチュアルアワー、AHなのだ。AHは、NHの内側に書くのだ。"],["めたん","予算差異は、予算許容額と実際発生額の差よね。"],["ずんだもん","そうなのだ。予算許容額は、実際の710時間なら本来いくらかかってよかったか、という額なのだ。"],["ずんだもん","固定費予算に、変動費率の1,800円×710時間を足して、4,428,000なのだ。"],["めたん","実際は4,396,360だから、31,640少なく済んでいるわ。"],["ずんだもん","節約できたので、有利差異、貸方差異なのだ。"],["めたん","操業度差異の出し方も知りたいわ。"],["ずんだもん","AHからNHを引いて、固定費率を掛けるのだ。必ず、内側から外側を引くのだ。"],["めたん","710時間から750時間を引いて、マイナス40時間に4,200円を掛けて、マイナス168,000ね。"],["ずんだもん","電卓のマイナスが、そのまま不利差異、借方差異なのだ。"],["めたん","操業度差異は、何が悪かったと考えればいいの？"],["ずんだもん","予定より40時間しか動かさなかったので、固定費の一部を製品に乗せきれなかったのだ。時間の相違なのだ。"],["めたん","2つを合わせると、マイナス136,360で、さっきの差とぴったり合うわ。"],["ずんだもん","検算もできたのだ。予算差異は31,640の貸方差異、操業度差異は168,000の借方差異なのだ。"]],[["ずんだもん","最後の問4は、製品Xと製品Yの当月製造費用なのだ。"],["めたん","直接材料費、直接労務費、直接経費、製造間接費を、製品ごとに足すのね。"],["ずんだもん","そうなのだ。直接材料費は、原料Aを予定価格で払い出した分なのだ。"],["めたん","払い出したkgに480円を掛けるのね。"],["ずんだもん","補助材料は製造間接費に入っているので、ここには入れないのだ。"],["めたん","直接労務費は、予定賃率に直接作業時間を掛けるわ。"],["ずんだもん","Xは450時間で702,000、Yは260時間で405,600なのだ。"],["めたん","直接経費は外注加工賃で、Yだけに入るわ。"],["ずんだもん","製造間接費は、予定配賦額を使うのだ。"],["めたん","実際発生額は使わないのね。"],["ずんだもん","製品に乗せるのは予定配賦額なのだ。実際との差は、差異として製品とは別にしているのだ。"],["めたん","足すと、製品Xは6,666,000、製品Yは4,166,000になるわ。"],["ずんだもん","その通りなのだ。これで問4も埋まったのだ。"]],[["ずんだもん","最後にまとめるのだ。まずは材料なのだ。"],["めたん","購入原価は、購入代価と外部副費だったわね。"],["ずんだもん","外部副費は引取費用なのだ。この問題では、代価の15%を予定配賦したのだ。"],["めたん","内部副費は、購入原価に入れずに間接経費ね。"],["ずんだもん","そうなのだ。払出は、原料AとBが継続記録法、Cは棚卸計算法の差額なのだ。"],["めたん","消費は予定価格で、実際との差が消費価格差異になるわ。"],["ずんだもん","棚卸減耗は、実際の単価の494.5円で測って、正常なので製造間接費なのだ。"],["めたん","差異は、買うときと使うときの2か所で出たわね。"]],[["ずんだもん","次は、労務費と製造間接費なのだ。"],["めたん","支払賃金は、就業時間に支払賃率を掛けて、割増を足すのね。"],["ずんだもん","そして未払で、1か月分に直すのだ。当月末を足して、前月末を引くのだ。"],["めたん","消費は予定賃率で、直接作業は仕掛品、間接作業と手待は製造間接費ね。"],["ずんだもん","外注加工賃は、直接経費なのだ。"],["めたん","予算差異は予算許容額と実際の差、操業度差異は時間のずれに固定費率を掛けるのよね。"],["ずんだもん","その通りなのだ。費目別計算は、1つ1つは基本なのだ。でも全部がつながっているので、下書きで1つずつ確かめるのが大事なのだ。"],["めたん","下書きが答案のどこにつながるか、意識して解くわ。"],["ずんだもん","168回の工業簿記は、これでおしまいなのだ。"]]],"shorts":[{"hl":"[材料副費]は/外部と内部で行き先が違う","at":143.5,"blob":"d063833180fefe34b68b2116dd3e6c8a"},{"hl":"[棚卸計算法]は/差額で消費量","at":293.49,"blob":"651c150504cdc6d1835b0c2d558230b0"},{"hl":"棚卸減耗は/[間接経費]・実際の単価","at":454.75,"blob":"ba88e85fcbed1a616d18a9491715d941"},{"hl":"[手待時間]にも/時給は出る","at":678.45,"blob":"956ff686e1a406e7c9e01f454d1350ce"},{"hl":"[操業度差異]は/時間のずれ","at":987.11,"blob":"a455c15a28a7547989907f31d654ed24"}]},{"kind":"exam","no":"168回","sub":"過去問","ch":168,"probs":[],"hl":"[CVP分析]と/[臨時の注文]の受注可否","acct":"過去問","id":"x168-ge","title":"原価計算","sn":"原計","w":0.0,"wt":[],"video":{"blob":"6ee941305e3caabe9415383bb68c478a","secs":705.97,"mb":8.8},"scenes":[[0,"原価計算の全体像"],[29.59,"問題1の①②：過去の実績データ"],[77.58,"固変分解の5つの方法"],[132.79,"問題1の③：意思決定"],[171.29,"問題1の④：代替的"],[204.55,"問題1の⑤：貢献利益の増加"],[248.1,"問題1の⑥⑦：固定費の削減"],[289.02,"問題1の⑥⑦：固定費を削ったあと"],[310.94,"問題1の⑧⑨⑩：経営レバレッジ係数"],[361.51,"問題2：資料"],[398.1,"問題2：今の損益と差額"],[432.88,"問題2の(1)：遊休の中の注文"],[478.84,"問題2の(2)：遊休を超える注文"],[541.8,"問題2の(3)：一部だけ受ける"],[595.54,"(3)を総額で確かめる"],[630.32,"模範解答"],[655.08,"まとめ：問題1"],[681.56,"まとめ：問題2"]],"script":[[["ずんだもん","今回は、168回の原価計算を、最初から最後まで解くのだ。"],["めたん","原価計算は2問ね。"],["ずんだもん","問題1は、CVP分析の文章を完成させる問題なのだ。空欄は①から⑩まで10個あるのだ。"],["めたん","①から④は語群から選んで、⑤から⑩は数字を入れたり、どちらかを選んだりするのね。"],["ずんだもん","そうなのだ。問題2は、臨時の注文を引き受けるかどうかを決める問題なのだ。"],["めたん","配点は問題1が16点、問題2が9点になっているわ。"],["ずんだもん","問題1は国語の問題に見えるけど、⑤から⑩は下書きを描けば一瞬なのだ。"],["ずんだもん","では、①と②から見ていくのだ。"]],[["ずんだもん","1）の文章で埋まるのは、①から④なのだ。"],["めたん","CVP分析を行うには、原価予測が必要である、から始まっているわ。"],["ずんだもん","CVP分析は、売上と原価と利益の関係を見る分析なのだ。"],["めたん","利益計画を立てるときに使うのよね。"],["ずんだもん","その通りなのだ。そのためには、原価を変動費と固定費に分けておく必要があるのだ。これを固変分解と言うのだ。"],["めたん","固変分解って、どうやって分けるの？"],["ずんだもん","よくあるのは、これまでの月ごとの原価のデータを使って、傾向から分ける方法なのだ。"],["めたん","それなら、①に入るのは「過去の実績」ね。"],["ずんだもん","正解なのだ。①はイなのだ。"],["ずんだもん","文章の後ろでも、①から推定した傾向が、利益計画期間に当てはまるとは限らない、と言っているのだ。"],["めたん","将来の予測だと、傾向を推定するって話と合わないものね。"],["ずんだもん","次の②は、過去の実績データを使う、理論的に洗練された統計的方法なのだ。"],["めたん","語群には、費目別精査法、IE法、最小自乗法、高低点法があるわ。"]],[["ずんだもん","講義の板書で、固変分解の方法を並べて見るのだ。"],["ずんだもん","右に書いてあるように、3つのグループに分かれるのだ。"],["ずんだもん","1つ目の費目別精査法は、経理の人の経験で、この科目は変動費っぽい、と分ける方法なのだ。"],["めたん","簡単だけど、人によって変わるわね。"],["ずんだもん","そうなのだ。主観的という短所があるのだ。これを非統計的方法と言うのだ。"],["ずんだもん","高低点法、スキャッター・チャート法、最小自乗法の3つが、過去のデータを使う統計的方法なのだ。"],["めたん","高低点法は2級でやったわ。一番高い月と一番低い月の2点で線を引くのよね。"],["ずんだもん","でも、たった2点で全体を決めるのは無理があるし、その2点が異常値のことも多いのだ。"],["めたん","スキャッター・チャート法は、全部の点を見て目分量で線を引くのね。"],["ずんだもん","最小自乗法は、全部の点からのずれの二乗の合計が一番小さくなるように線を引くのだ。誰がやっても同じ線になるのだ。"],["めたん","だから理論的に一番優れている、ってことね。"],["ずんだもん","その通りなのだ。②はウの最小自乗法なのだ。"],["ずんだもん","最後のIE法は、ストップウォッチで作業を測る工学的方法なのだ。過去のデータは使わないのだ。"],["めたん","費目別精査法とIE法は、そもそも統計じゃないから外れるのね。"]],[["ずんだもん","次は③なのだ。過去の実績データを使うのが、適切でない場合の話なのだ。"],["めたん","原料の価格が大きく上がりそう、とか、生産設備や生産方法が大きく変わった、とか書いてあるわ。"],["ずんだもん","そういうときは、過去の傾向をそのまま使えないのだ。"],["めたん","次の期に新しく設備投資を計画している場合もあるわね。"],["ずんだもん","そうなのだ。だから、計画している設備投資や生産方法の変更を反映して、原価予測をするのだ。"],["めたん","設備投資をするって決めるのは、会社の意思決定よね。"],["ずんだもん","その通りなのだ。③はイの「意思決定」なのだ。"],["ずんだもん","後ろの段落でも、③の結果を前提に、理論値や予測値で原価予測をすればよい、と言っているのだ。"],["めたん","設備投資を決めた結果を前提にする、なら意味が通るわね。"],["ずんだもん","模範解答では、アの環境変化も別解になっているのだ。"]],[["ずんだもん","④は、利益計画のための変動費と固定費の考え方なのだ。"],["めたん","次の利益計画期間内に取りうる、④な生産・販売量のもとで予定される原価の推定値、とあるわ。"],["ずんだもん","計画を立てる前は、たくさん作る案も、少なめに作る案も選べるのだ。"],["めたん","どれを選んでも原価がいくらになるか分かるように、線にしておくのね。"],["ずんだもん","そうなのだ。でも実際に実現するのは、そのうちの1点だけなのだ。"],["めたん","いくつもある案の中から選べる、ということは、代わりになる案が並んでいるわけね。"],["ずんだもん","それが「代替的」なのだ。④はウなのだ。"],["ずんだもん","工の動態的と、③の環境変化を組み合わせても意味が通るので、そちらも別解なのだ。"],["めたん","③と④はセットで別解なのね。"]],[["ずんだもん","ここから2）なのだ。数字を入れる⑤から⑦なのだ。"],["めたん","貢献利益率が40%で、もう損益分岐点の売上高は超えているのね。"],["ずんだもん","まず用語なのだ。貢献利益は、売上高から変動費だけを引いた利益なのだ。"],["めたん","固定費を引く前の利益ね。貢献利益率は、それを売上高で割った割合になるわ。"],["ずんだもん","そうなのだ。損益分岐点は、ちょうど利益がゼロになる売上高なのだ。"],["めたん","⑤は、貢献利益が20万円増えたら、営業利益はいくら増えるか、ね。"],["ずんだもん","営業利益は、貢献利益から固定費を引いたものなのだ。"],["ずんだもん","固定費は、売上が増えても変わらないのだ。"],["めたん","じゃあ、貢献利益が増えた分が、そのまま営業利益の増加になるのね。"],["ずんだもん","その通りなのだ。⑤は20なのだ。"],["めたん","解説では、仮に売上高を100万円として、表にして確かめているわ。"],["ずんだもん","売上高が150万円になると、貢献利益は20万円増えて、営業利益も20万円増えているのだ。"]],[["ずんだもん","⑥と⑦は、固定費を10%削減したら、損益分岐点の売上高がどう動くかなのだ。"],["ずんだもん","こういう、条件を変えたら利益がどう動くかを調べるのを、感度分析と言うのだ。"],["めたん","式でXと置いて解けばいいのよね。"],["ずんだもん","方程式も公式もいらないのだ。CVP図表を描くのだ。"],["ずんだもん","ピンクの売上高線と、青い変動原価の線を引いて、その上に固定費の幅だけ平行に総原価の線を乗せるのだ。"],["めたん","売上高線と総原価線がぶつかった所が、損益分岐点ね。"],["ずんだもん","解説と同じ仮の数字で描くのだ。売上高100万円で、固定費は40万円なのだ。"],["めたん","貢献利益率40%だから、貢献利益は40万円ね。ちょうど固定費と同じだから、ここが損益分岐点になるわ。"],["ずんだもん","損益分岐点の売上高は、固定費を貢献利益率で割れば出るのだ。40万円÷40%で100万円なのだ。"]],[["ずんだもん","固定費を10%削ると、36万円なのだ。平行線の幅が狭くなるのだ。"],["めたん","36万円÷40%で、損益分岐点は90万円ね。"],["ずんだもん","100万円から90万円で、10%下がっているのだ。"],["めたん","貢献利益率が変わらないなら、損益分岐点は固定費と同じ割合で動くのね。"],["ずんだもん","その通りなのだ。⑥は10、⑦は「低くなる」に丸なのだ。"],["めたん","固定費が減れば、少ない売上で元が取れるものね。"]],[["ずんだもん","最後の3）なのだ。貢献利益が100万円、営業利益が50万円なのだ。"],["めたん","⑧は経営レバレッジ係数ね。聞いたことはあるけど、中身があやふやだわ。"],["ずんだもん","経営レバレッジ係数は、貢献利益を営業利益で割った数字なのだ。"],["めたん","100万円÷50万円で、2になるわ。"],["ずんだもん","⑧は2なのだ。図で言うと、貢献利益の長い矢印を、営業利益の短い矢印で割っているのだ。"],["めたん","レバレッジって、テコのことよね。"],["ずんだもん","そうなのだ。固定費が支点になって、売上高を少し動かすと、営業利益が大きく跳ねるのだ。"],["ずんだもん","売上高の増加率に経営レバレッジ係数を掛けると、営業利益の増加率になるのだ。"],["めたん","売上高が10%増えるから、10%に2を掛けて、営業利益は20%増えるのね。"],["ずんだもん","その通りなのだ。⑨は20、⑩は「増加する」に丸なのだ。"],["めたん","解説の仮の数字でも、営業利益が50万円から60万円になって、ちゃんと20%増えているわ。"],["ずんだもん","固定費が大きい会社ほど係数が大きくなって、増えるときも減るときも大きく動くのだ。"]],[["ずんだもん","次は問題2なのだ。資料を順に読むのだ。"],["めたん","生産能力は1ヶ月に15,000個分の設備時間ね。"],["ずんだもん","そして今は、一般市場向けの製品を毎月13,000個作って売っているのだ。"],["めたん","売価は1個2,000、直接材料は1個1,000になっているわ。"],["ずんだもん","直接工は月給制で、残業もしていないのだ。だから直接労務費は固定費なのだ。"],["めたん","製造間接費も、全部固定費ね。"],["ずんだもん","そこへ、1個1,500で臨時の注文が来たのだ。"],["めたん","臨時の注文は、作る時間が通常の製品の半分で、直接材料は1個1,100かかるのね。"],["ずんだもん","もう1つ大事なのが、注文は全部引き受けるか、全部断るかのどちらかだ、という条件なのだ。"],["めたん","それと、遊休で作り切れないときは、市場向けの製品をあきらめるしかないのね。"]],[["ずんだもん","まずは今の損益を、直接原価計算の形で見ておくのだ。"],["めたん","売上高から変動費を引いて貢献利益、そこから固定費を引いて営業利益ね。"],["ずんだもん","固定費は、直接労務費と製造間接費を足した5,850,000なのだ。"],["めたん","臨時の注文を受けても受けなくても、この固定費は変わらないわね。"],["ずんだもん","そうなのだ。どちらの案でもかかる原価は、比べるときに関係ないのだ。これを埋没原価と言うのだ。"],["ずんだもん","反対に、注文を受けるときだけ変わる収益と原価を比べるのが、差額原価収益分析なのだ。"],["めたん","臨時の注文で増えるのは、売上の1,500と、直接材料の1,100だけね。"],["ずんだもん","その差の400が、臨時の注文1個あたりの貢献利益なのだ。"],["めたん","プラスだから、作る余裕さえあれば、受けたほうが得になるわ。"]],[["ずんだもん","(1)は、臨時の注文が2,000個の場合なのだ。"],["ずんだもん","問題を見たら、最初に遊休生産能力をつかむのだ。"],["めたん","遊休生産能力って、設備がまだ空いている分のことよね。"],["ずんだもん","そうなのだ。最大の15,000個から、今の13,000個を引くのだ。"],["めたん","通常の製品なら、2,000個分の時間が空いているのね。"],["ずんだもん","そこで止まらないのだ。臨時の注文は、半分の時間で作れるのだ。"],["めたん","同じ時間で2個作れるから、臨時の注文なら4,000個まで作れるわね。"],["ずんだもん","その通りなのだ。2,000個の注文は、遊休の中に収まるのだ。"],["ずんだもん","下書きは、差額収益、差額原価、差額利益の順に縦に書くのだ。"],["めたん","差額収益は、1,500の2,000個分ね。"],["ずんだもん","差額原価は、直接材料の1,100の2,000個分なのだ。直接労務費と製造間接費は固定費なので入れないのだ。"],["めたん","差額利益は800,000ね。"],["ずんだもん","プラスなので、引き受けるべきなのだ。(1)は800,000で、有利に丸なのだ。"]],[["ずんだもん","(2)は、臨時の注文が7,000個なのだ。"],["めたん","遊休で作れるのは4,000個までだったわね。3,000個もはみ出しているわ。"],["ずんだもん","はみ出した分は、通常の製品をあきらめて、時間を空けるしかないのだ。"],["めたん","臨時の3,000個は、通常の製品だと何個分の時間になるのかしら。"],["ずんだもん","半分の時間なので、3,000個÷2で、通常の製品1,500個分なのだ。"],["めたん","じゃあ、市場向けを1,500個あきらめるのね。"],["ずんだもん","今、あきらめる、という言葉が出たのだ。あきらめると来たら、機会原価なのだ。"],["めたん","機会原価って、あきらめた案で得られたはずの利益のことよね。"],["ずんだもん","そうなのだ。お金は出ていかないけど、逃した利益も差額原価に入れるのだ。"],["めたん","あきらめるのは売上の2,000じゃなくて、そこから材料を引いた1,000の儲けのほうね。"],["ずんだもん","その通りなのだ。1個あたりの貢献利益を、あきらめる個数の分だけ掛けるのだ。"],["めたん","機会原価は1,500,000になるわ。"],["ずんだもん","そうなのだ。差額収益は、臨時の注文7,000個分の10,500,000なのだ。"],["めたん","現金支出原価は、直接材料の7,000個分で7,700,000ね。"],["ずんだもん","現金支出原価は、実際にお金が出ていく原価のことなのだ。機会原価と足して、差額原価は9,200,000なのだ。"],["めたん","差額利益は1,300,000で、まだプラスね。"],["ずんだもん","(2)は1,300,000で、有利に丸なのだ。機会原価を入れ忘れると2,800,000になってしまうので、気をつけるのだ。"]],[["ずんだもん","(3)は、注文の一部だけ受けてもよい、という条件に変わるのだ。"],["めたん","一番利益が大きくなる数量を選ぶのね。全部受けた(2)より得になるのかしら。"],["ずんだもん","足りないのは設備の時間なのだ。限りのある時間をどちらに使うか、という問題になるのだ。"],["めたん","1個あたりの貢献利益なら、通常品が1,000で、臨時が400ね。"],["ずんだもん","単なる1個あたりの利益で比べてはいけないのだ。制約になっている時間1単位あたりの貢献利益で比べるのだ。"],["めたん","時間で割るのね。通常品1個分の時間で、臨時の注文は2個作れるわ。"],["ずんだもん","だから臨時の注文は、400の2個分で、通常品1個分の時間あたり800なのだ。"],["めたん","通常品の1,000のほうが大きいわね。通常品が1位、臨時が2位よ。"],["ずんだもん","そうなのだ。通常品を需要の13,000個まで作って、空いた時間だけ臨時の注文に回すのだ。"],["めたん","遊休で作れるのは4,000個だったわね。"],["ずんだもん","差額利益は、400の4,000個分で1,600,000なのだ。"],["ずんだもん","(3)は1,600,000で有利、注文履行数量は4,000個 }

let shortWatch = null;
function watchShorts() {
  if (shortWatch) { shortWatch.disconnect(); shortWatch = null; }
  const box = document.getElementById("shorts");
  if (!box || !("IntersectionObserver" in window)) return;
  shortWatch = new IntersectionObserver(es => es.forEach(e => {
    const vid = e.target.querySelector("video");
    if (!vid) return;
    if (e.isIntersecting && e.intersectionRatio >= .6) vid.play().catch(() => {}); else vid.pause();
  }), { root: box, threshold: [0, .6] });
  box.querySelectorAll(".short").forEach(a => {
    shortWatch.observe(a);
    const vid = a.querySelector("video"), bar = a.querySelector(".sline i");
    if (!vid) return;
    vid.addEventListener("timeupdate", () => { if (vid.duration) bar.style.width = (vid.currentTime / vid.duration * 100).toFixed(1) + "%"; });
    vid.addEventListener("click", () => { if (vid.paused) vid.play().catch(() => {}); else vid.pause(); });
  });
}

  const hit = V.filter(v => {
    const c = (v.core ? JSON.stringify(v.core) : "") + (v.script ? JSON.stringify(v.script) : "");
    const h = norm([v.no, isExam(v) ? "過去問 第" + v.no + " " + v.sn : isProb(v) ? "問題" + v.no : "講義" + v.no, v.title, v.sub, chName(v.sub, v.ch), v.hl, c, ...(v.probs || [])].join(" "));
    return words.every(w => h.includes(w));
  });
  return hit.map(v => li(v.id)).join("") || '<p class="empty">見つかりませんでした</p>';
}

  openSheet(`<div class="sheeth"><h2>台本</h2><button class="ico" data-back aria-label="閉じる">${I.close}</button></div>
    <div class="sbody scr" data-id="${id}">${v.script.map((ls, i) => `<section class="sc">
      <button class="sch" data-sseek="${v.scenes[i][0]}"><span class="no">${mmss(v.scenes[i][0])}</span><b>${esc(v.scenes[i][1])}</b></button>
      ${ls.map(([w, t]) => `<p><i class="${w === "めたん" ? "m" : "z"}">${esc(w)}</i><span>${esc(t)}</span></p>`).join("")}</section>`).join("")}</div>`, false, playing === id);
  markScene();
}
function saveSheet(k) {
  sheetKey = k;
  openSheet(`<div class="sheeth"><h2>保存先</h2><button class="ico" data-back aria-label="閉じる">${I.close}</button></div>
    <div class="sbody">
      <div class="fold">${S.folders.map(f => `<label><input type="checkbox" data-fold="${f.id}" ${f.ids.includes(k) ? "checked" : ""}>${esc(f.name)}</label>`).join("")}</div>
      <form class="newf" data-newf><input id="newname" maxlength="20" placeholder="新しいフォルダ" aria-label="新しいフォルダの名前"><button>作る</button></form>
    </div>`, true);
}
function newFolderSheet() {
  sheetKey = null;
  openSheet(`<div class="sheeth"><h2>新しいフォルダ</h2><button class="ico" data-back aria-label="閉じる">${I.close}</button></div>
    <div class="sbody"><form class="newf" data-newf><input id="newname" maxlength="20" placeholder="フォルダの名前" aria-label="フォルダの名前"><button>作る</button></form></div>`, true);
}
function menuSheet(k, ctx) {
  sheetKey = k; sheetCtx = ctx || "";
  const v = byId[keyId(k)], s = isShort(k), f = sheetCtx.startsWith("folder:") ? folderOf(sheetCtx.slice(7)) : null;
  const it = (m, ic, t) => `<button data-m="${m}">${ic}<span>${t}</span></button>`;
  const later = folderOf(LATER);
  openSheet(`<div class="sheeth"><h2 class="sm">${s ? "ショート・" : ""}${name(v)}</h2><button class="ico" data-back aria-label="閉じる">${I.close}</button></div>
    <div class="menu">
      ${sheetCtx === "queue" ? it("unqueue", I.trash, "「次に再生」から外す") : ""}
      ${!s && v.video && sheetCtx !== "queue" && k !== playing ? it("next", I.qnext, "次に再生") + it("last", I.qlast, "最後に再生") : ""}
      ${later && !later.ids.includes(k) ? it("later", I.clock, "［後で見る］に保存") : ""}
      ${it("fav", I.mark(false), "お気に入りリストに保存")}
      ${f ? it("unfolder", I.trash, `［${esc(f.name)}］から削除`) : ""}
      ${s ? "" : it("done", I.check(false), finished(v.id) ? "未視聴に戻す" : seen(v.id) ? "見終わったにする／未視聴に戻す" : "見終わったにする")}
    </div>`, true);
}
function setDone(id, on) {
  if (on) S.prog[id] = Object.assign({ t: 0, d: 0 }, pg(id), { at: Date.now(), done: true });
  else S.prog[id] = { t: 0, d: 0, at: Date.now(), x: 1 };
  markProg(id); flush();
}
function doMenu(m) {
  const k = sheetKey, id = keyId(k), ctx = sheetCtx;
  if (m === "fav") return saveSheet(k);
  if (m === "done" && !finished(id) && seen(id)) {
    return openSheet(`<div class="sheeth"><h2 class="sm">${name(byId[id])}</h2><button class="ico" data-back aria-label="閉じる">${I.close}</button></div>
      <div class="menu"><button data-m="done1">${I.check(false)}<span>見終わったにする</span></button><button data-m="done0">${I.trash}<span>未視聴に戻す</span></button></div>`, true);
  }
  if (m === "next") { queue = [id].concat(queue.filter(x => x !== id)); toast("次に再生します"); }
  else if (m === "last") { queue = queue.filter(x => x !== id).concat(id); toast("最後に再生します"); }
  else if (m === "unqueue") { queue = queue.filter(x => x !== id); }
  else if (m === "later") { const f = folderOf(LATER); if (!f.ids.includes(k)) f.ids.push(k); markLib(); toast("［後で見る］に保存しました"); }
  else if (m === "unfolder") { const f = folderOf(ctx.slice(7)); if (f) { f.ids = f.ids.filter(x => x !== k); markLib(); toast(`［${f.name}］から削除しました`); } }
  else if (m === "done") setDone(id, !finished(id));
  else if (m === "done1") setDone(id, true);
  else if (m === "done0") setDone(id, false);
  back();
}
function playAll(fid) {
  const f = folderOf(fid); if (!f) return;
  const ids = folderItems(f).filter(k => !isShort(k) && byId[k].video);
  if (!ids.length) return;
  queue = ids.slice(1);
  leave(); openPlayer(ids[0], null, false, false);
  const vid = document.getElementById("vid"); if (vid) vid.play().catch(() => {});
}

// ---------- 操作 ----------
document.addEventListener("click", e => {
  if (e.target.id === "scrim") return back();
  const t = e.target.closest("button");
  if (!t) return;
  const d = t.dataset;
  if ("back" in d) back();
  else if ("search" in d) { leave(); searching = true; pushLayer(); render(); const i = document.getElementById("q"); if (i) i.focus(); }
  else if (d.tab) { leave(); tab = d.tab; showAll = false; meView = null; searching = false; render(); }
  else if (d.chip) { homeChip = d.chip; rerender(); }
  else if (d.fchip) { fChip = d.fchip; rerender(); }
  else if (d.ch) { leave(); pickCh = d.ch; if (showAll) back(); else render(); }
  else if ("all" in d) { leave(); showAll = true; pushLayer(); render(); }
  else if ("hist" in d) { leave(); meView = "hist"; pushLayer(); render(); }
  else if (d.folder) { leave(); meView = d.folder; fChip = "すべて"; pushLayer(); render(); }
  else if ("newfolder" in d) newFolderSheet();
  else if ("accts" in d) acctSheet();
  else if (d.acct) { flush(); try { localStorage.setItem(MOCK_ACCT, d.acct); } catch (e) {} location.reload(); }
  else if (d.playall) playAll(d.playall);
  else if (d.more) menuSheet(d.more, d.ctx);
  else if (d.m) doMenu(d.m);
  else if (d.short) {
    leave(); searching = false; meView = null; tab = "shorts";
    scrollMem.shorts = 0; render();
    const box = document.getElementById("shorts"), a = box && box.querySelector(`[data-sid="${d.short}"]`);
    if (a) box.scrollTop = a.offsetTop;
  }
  else if (d.open) {
    const vid = document.getElementById("vid"); if (vid) vid.pause();
    closeSheet(true);
    const inPlayer = !document.getElementById("player").hidden;
    if (!inPlayer) leave();
    openPlayer(d.open, d.at != null ? +d.at : null, d.fs === "1", inPlayer);
  }
  else if (d.seek) {
    const id = sheetKey, vid = document.getElementById("vid");
    closeSheet(true);
    if (playing === id && vid) { vid.currentTime = +d.seek; vid.play().catch(() => {}); }
    else { const inPlayer = !!playing; if (!inPlayer) leave(); openPlayer(id, +d.seek, tab === "shorts" && !inPlayer, inPlayer); }
  }
  else if ("full" in d) goFull();
  else if (d.script) scriptSheet(d.script);
  else if (d.sseek) {
    const vid = document.getElementById("vid");
    if (playing === sheetKey && vid) { vid.currentTime = +d.sseek; vid.play().catch(() => {}); markScene(); }
    else { const id = sheetKey, inPlayer = !!playing; closeSheet(true); if (!inPlayer) leave(); openPlayer(id, +d.sseek, tab === "shorts" && !inPlayer, inPlayer); }
  }
  else if (d.about) about(d.about);
  else if (d.save) saveSheet(d.save);
  else if (d.done) { setDone(d.done, !finished(d.done)); refreshPlayer(); }
  else if ("auto" in d) { S.set.auto = !S.set.auto; markSet(); flush(); refreshPlayer(); }
  else if (d.rate) {
    S.set.rate = +d.rate; markSet(); flush();
    const vid = document.getElementById("vid"); if (vid) vid.playbackRate = S.set.rate;
    document.querySelectorAll("[data-rate]").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.rate === S.set.rate)));
  }
});
document.addEventListener("input", e => {
  if (e.target.id === "q") { q = e.target.value; document.getElementById("res").innerHTML = results(); }
});
document.addEventListener("change", e => {
  const d = e.target.dataset;
  if (d.fold != null && sheetKey) {
    const f = folderOf(d.fold);
    if (!f) return;
    if (e.target.checked) { if (!f.ids.includes(sheetKey)) f.ids.push(sheetKey); } else f.ids = f.ids.filter(x => x !== sheetKey);
    markLib();
  }
});
document.addEventListener("submit", e => {
  if (!e.target.matches("[data-newf]")) return;
  e.preventDefault();
  const n = document.getElementById("newname").value.trim();
  if (!n) return;
  S.folders.push({ id: "f" + Date.now().toString(36), name: n, ids: sheetKey ? [sheetKey] : [] }); markLib();
  if (sheetKey) saveSheet(sheetKey); else back();
});
render();
connect();
</script>
<script>if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));</script></body></html>
